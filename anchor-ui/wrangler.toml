name = "anchor-frontend"
compatibility_date = "2024-01-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[env.dev]
name = "anchor-frontend-dev"
routes = [
  { pattern = "anchordev.nanostack.dev", custom_domain = true }
]

[env.production]
name = "anchor-frontend"
routes = [
  { pattern = "anchor.nanostack.dev", custom_domain = true }
]
