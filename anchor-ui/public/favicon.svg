<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Master Gradients -->
    <linearGradient id="slateFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F5272" />
      <stop offset="100%" stop-color="#2A2C3F" />
    </linearGradient>
    <linearGradient id="slateMid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A3C55" />
      <stop offset="100%" stop-color="#1A1B26" />
    </linearGradient>
    <linearGradient id="slateBack" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242636" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    
    <!-- Glowing Sphere -->
    <radialGradient id="sphere" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="60%" stop-color="#e2e2ec" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#6F7399" stop-opacity="0.8" />
    </radialGradient>

    <!-- Filters -->
    <filter id="layerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- The Mathematical Cradle Mask -->
    <mask id="cradle">
      <rect x="0" y="0" width="200" height="200" fill="white" />
      <!-- The exact gap cutout (Radius 30, center 85,50) -->
      <circle cx="85" cy="50" r="30" fill="black" />
    </mask>
  </defs>

  <!-- The Structural N masked by the cradle -->
  <g mask="url(#cradle)">
    <rect x="135" y="30" width="35" height="140" fill="url(#slateBack)" />
    <polygon points="30,30 65,30 170,170 135,170" fill="url(#slateMid)" filter="url(#layerShadow)"/>
    <rect x="30" y="30" width="35" height="140" fill="url(#slateFront)" filter="url(#layerShadow)"/>
  </g>
  <!-- The Glowing Application Core -->
  <circle cx="85" cy="50" r="22" fill="url(#sphere)" filter="url(#orbGlow)" />
</svg>