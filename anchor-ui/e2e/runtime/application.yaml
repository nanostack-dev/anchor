# The e2e backend's file layer (cmd/app.LoadConfig). Keys are the config:
# names (apps/anchor/cmd/app/CONFIG.md). e2e-runtime.mjs sets the rest in
# the environment: POSTGRES_PORT, MIGRATIONS_BASE_PATH, REDIS_ADDRESS,
# SERVER_PORT, ALLOWED_ORIGIN, and the secrets through *_FILE variables.
postgres:
  host: "127.0.0.1"
  user: "anchor_e2e"
  db: "anchor_e2e"
  sslmode: "disable"

migrations:
  auto_fix_dirty: false

core:
  environment: "development"
