<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Role names substring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: an incident dossier. One reading column for prose, full width for the two pictures (the timeline replay and the whys tree). Times are UTC and relative to the trigger (T+). */
:root {
  --canvas: #f5f6f8; --surface: #ffffff; --subtle: #eef0f4; --hover: #e6e9ef; --border: #dadfe6; --line: #a3abb8;
  --text: #1a2030; --muted: #5b6474; --accent: #2550c4; --accent-soft: #e8eefc; --on-accent: #ffffff;
  --bad: #b42f2a; --bad-soft: #fbeae8; --warn: #8a5a00; --warn-soft: #fdf1d8;
  --good: #1d6e42; --good-soft: #e4f3ea; --vio: #6343b5; --vio-soft: #efe9fc;
  --shadow: 0 1px 2px #1a203014, 0 8px 28px #1a20300f;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 10px; --r-sm: 6px; --wide: 1160px; --read: 72ch;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #121418; --surface: #1a1d22; --subtle: #23272e; --hover: #2b3038; --border: #343b45; --line: #5d6775;
  --text: #eceff3; --muted: #a2acba; --accent: #9db6ff; --accent-soft: #23314f; --on-accent: #12203f;
  --bad: #ff9f97; --bad-soft: #3d2224; --warn: #f0c46e; --warn-soft: #372c17;
  --good: #89d3a8; --good-soft: #183627; --vio: #c7b2ff; --vio-soft: #2c2542;
  --shadow: 0 1px 2px #00000040, 0 8px 28px #00000052; color-scheme: dark; } }
:root[data-theme="dark"] {
  --canvas: #121418; --surface: #1a1d22; --subtle: #23272e; --hover: #2b3038; --border: #343b45; --line: #5d6775;
  --text: #eceff3; --muted: #a2acba; --accent: #9db6ff; --accent-soft: #23314f; --on-accent: #12203f;
  --bad: #ff9f97; --bad-soft: #3d2224; --warn: #f0c46e; --warn-soft: #372c17;
  --good: #89d3a8; --good-soft: #183627; --vio: #c7b2ff; --vio-soft: #2c2542;
  --shadow: 0 1px 2px #00000040, 0 8px 28px #00000052; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--canvas); color: var(--text); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
code { font: 0.86em var(--mono); background: var(--subtle); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: var(--wide); margin: 0 auto; padding-inline: 16px; }
.kicker { font-size: 11.5px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; background: var(--subtle); color: var(--muted); }
.chip.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.sm { height: 20px; padding: 0 7px; font-size: 11.5px; }
.bad { background: var(--bad-soft); color: var(--bad); }
.warn { background: var(--warn-soft); color: var(--warn); }
.good { background: var(--good-soft); color: var(--good); }
.info { background: var(--accent-soft); color: var(--accent); }
.vio { background: var(--vio-soft); color: var(--vio); }
.muted { background: var(--subtle); color: var(--muted); }
.rid { font: 600 11.5px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--good-soft); color: var(--good); white-space: nowrap; }
.aid { font: 600 11.5px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }

.btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn svg { width: 14px; height: 14px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.bar .wrap { display: flex; align-items: center; gap: 18px; height: 46px; }
.bar .tag { font: 600 12px var(--mono); color: var(--muted); white-space: nowrap; }
.bar nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.bar nav a { padding: 6px 9px; border-radius: 6px; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.bar nav a:hover { color: var(--text); background: var(--hover); text-decoration: none; }
@media (max-width: 640px) { .bar .tag { display: none; } }

/* hero */
.hero { background: var(--surface); border-bottom: 1px solid var(--border); }
.hero .wrap { padding-block: 36px 30px; display: grid; gap: 18px; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font: 500 12.5px var(--mono); color: var(--muted); }
.hero h1 { font-size: clamp(26px, 3.6vw, 40px); line-height: 1.12; font-weight: 800; letter-spacing: -0.022em; max-width: 30ch; }
.hero .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hero .row .grow { flex: 1; }
.byline { color: var(--muted); font-size: 13.5px; }
.clock { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin: 6px 0 0; }
.clock > div { background: var(--surface); padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.clock dt { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.clock dd { margin: 0; font: 600 clamp(22px, 2.6vw, 30px)/1.15 var(--mono); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.clock small { font-size: 12px; color: var(--muted); }
.clock .k-ttd dd { color: var(--warn); }
.clock .k-ttr dd { color: var(--text); }
@media (max-width: 760px) { .clock { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* sections */
main.wrap { display: grid; gap: 56px; padding-block: 40px 96px; }
section { min-width: 0; scroll-margin-top: 64px; display: grid; gap: 16px; align-content: start; }
section > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
section > header h2 { font-size: 22px; font-weight: 750; letter-spacing: -0.012em; }
section > header .hint { color: var(--muted); font-size: 14px; max-width: var(--read); }
section > header .spacer { flex: 1; }
.lead { font-size: 17px; line-height: 1.6; max-width: var(--read); }
.prose { max-width: var(--read); }
.box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); }

.impact { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; padding: 20px; }
.impact .numbers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; align-content: start; }
.impact .numbers b { display: block; font: 600 22px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.impact .numbers span { font-size: 13px; color: var(--muted); }
@media (max-width: 760px) { .impact { grid-template-columns: minmax(0, 1fr); } }

/* timeline replay */
.replay { padding: 18px 0 6px; overflow: hidden; }
.replay .scroll { overflow-x: auto; padding-inline: 12px; }
.replay svg { display: block; width: 100%; min-width: 760px; height: auto; }
.replay text { font-family: var(--sans); fill: var(--text); }
.replay .tick text, .replay .t { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.replay .axis { stroke: var(--line); stroke-width: 1.5; }
.replay .tick line { stroke: var(--border); }
.replay .break { stroke: var(--line); fill: none; stroke-width: 1.5; }
.replay .seglabel { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); letter-spacing: 0.04em; }
.replay .phase rect { rx: 4; }
.replay .phase text { font-size: 11.5px; font-weight: 650; }
.ph-undetected rect { fill: var(--bad-soft); stroke: var(--bad); } .ph-undetected text { fill: var(--bad); }
.ph-responding rect { fill: var(--warn-soft); stroke: var(--warn); } .ph-responding text { fill: var(--warn); }
.ph-recovering rect { fill: var(--accent-soft); stroke: var(--accent); } .ph-recovering text { fill: var(--accent); }
.replay .lead-line { stroke: var(--border); stroke-width: 1; }
.replay .ev circle { stroke: var(--surface); stroke-width: 2.5; }
.replay .ev .lbl { font-size: 12.5px; font-weight: 550; }
.replay .ev.k-trigger circle, .replay .ev.k-trigger .ring { fill: var(--bad); }
.replay .ev.k-detect .ring { fill: var(--warn); } .replay .ev.k-resolve .ring { fill: var(--good); }
.replay .ev.k-detect circle { fill: var(--warn); }
.replay .ev.k-mitigate circle { fill: var(--accent); }
.replay .ev.k-resolve circle, .replay .ev.k-followup circle { fill: var(--good); }
.replay .ev.k-escalate circle { fill: var(--vio); }
.replay .ev.k-comms circle { fill: var(--accent); }
.replay .ev.k-change circle, .replay .ev.k-note circle { fill: var(--line); }
.replay .ev.k-trigger .lbl { fill: var(--bad); font-weight: 650; }
.replay .ev.k-resolve .lbl { fill: var(--good); font-weight: 650; }
.replay .metric-area { fill: var(--accent-soft); }
.replay .metric-line { fill: none; stroke: var(--accent); stroke-width: 2; }
.replay .metric-axis { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); }
.replay .playhead line { stroke: var(--text); stroke-width: 1.5; stroke-dasharray: 3 3; }
.replay .playhead circle { fill: var(--text); }
.replay .playhead { opacity: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 10px 18px 12px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); margin-top: 10px; }
.legend b { color: var(--text); font: 600 13px var(--mono); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1.5px solid; }
.legend .l-undetected i { background: var(--bad-soft); border-color: var(--bad); }
.legend .l-responding i { background: var(--warn-soft); border-color: var(--warn); }
.legend .l-recovering i { background: var(--accent-soft); border-color: var(--accent); }

.playing .ev, .playing .phase g { animation: pop 0.45s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: var(--d); }
.playing .phase rect { transform-box: fill-box; transform-origin: left center; animation: grow var(--len, .6s) linear backwards; animation-delay: var(--d); }
.playing .phase text { animation: fade .3s ease-out backwards; animation-delay: calc(var(--d) + var(--len, .6s)); }
.playing .ev .ring { animation: ring 1.1s ease-out backwards; animation-delay: var(--d); }
.playing .metric-line { stroke-dasharray: 1; animation: draw var(--total) linear backwards; }
.playing .metric-area { animation: fade .8s ease-out backwards; animation-delay: calc(var(--total) - .4s); }
.playing .playhead { animation: sweep var(--total) linear backwards; }
.ev .ring { opacity: 0; fill: none; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes ring { 0% { opacity: .55; r: 6; } 100% { opacity: 0; r: 26; } }
@keyframes sweep { from { opacity: 1; transform: translateX(0); } to { opacity: 1; transform: translateX(var(--span)); } }

/* event list */
.events { list-style: none; margin: 0; padding: 0; display: grid; }
.events li { display: grid; grid-template-columns: 84px 92px 104px minmax(0, 1fr); gap: 4px 14px; padding: 12px 18px; border-top: 1px solid var(--border); align-items: baseline; }
.events li:first-child { border-top: 0; }
.events .time { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.events .rel { font: 12.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.events .what b { font-weight: 650; }
.events .what p { color: var(--muted); font-size: 14px; margin-top: 2px; }
.events li.k-trigger { background: color-mix(in srgb, var(--bad-soft) 55%, transparent); }
.events li.k-resolve { background: color-mix(in srgb, var(--good-soft) 55%, transparent); }
@media (max-width: 720px) {
  .events li { grid-template-columns: auto auto minmax(0, 1fr); padding: 12px 14px; }
  .events .what { grid-column: 1 / -1; }
}

/* whys */
.diagram { padding: 18px 12px; overflow-x: auto; }
.diagram svg { display: block; margin: 0 auto; height: auto; }
.diagram .fallback { padding: 8px; color: var(--muted); font-size: 14px; display: grid; gap: 10px; }
.diagram .fallback pre { font: 12px/1.5 var(--mono); background: var(--subtle); padding: 12px; border-radius: var(--r-sm); overflow-x: auto; margin: 0; color: var(--text); }
#whys-diagram pre.mermaid { margin: 0; font: 12px var(--mono); color: var(--muted); white-space: pre-wrap; }
#whys-diagram .node rect, #whys-diagram .node polygon, #whys-diagram .node path { fill: var(--surface) !important; stroke: var(--line) !important; }
#whys-diagram .nodeLabel, #whys-diagram .nodeLabel p, #whys-diagram .node .label { color: var(--text) !important; fill: var(--text) !important; font-family: var(--sans) !important; }
#whys-diagram .flowchart-link { stroke: var(--line) !important; }
#whys-diagram marker path, #whys-diagram .marker { fill: var(--line) !important; stroke: var(--line) !important; }
#whys-diagram .edgeLabel, #whys-diagram .edgeLabel p, #whys-diagram .edgeLabel span { background: var(--surface) !important; color: var(--muted) !important; font: 500 11px var(--mono) !important; }
#whys-diagram .edgeLabel rect { fill: var(--surface) !important; }
#whys-diagram .node.problem rect { fill: var(--bad-soft) !important; stroke: var(--bad) !important; }
#whys-diagram .node.problem .nodeLabel, #whys-diagram .node.problem .nodeLabel p { color: var(--bad) !important; font-weight: 650; }
#whys-diagram .node.root rect { fill: var(--good-soft) !important; stroke: var(--good) !important; }
#whys-diagram .node.root .nodeLabel, #whys-diagram .node.root .nodeLabel p { color: var(--good) !important; font-weight: 650; }
#whys-diagram .node.open rect { fill: var(--warn-soft) !important; stroke: var(--warn) !important; }
#whys-diagram .node.hl rect { stroke-width: 3px !important; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--good) 55%, transparent)); }
.growing g.node { animation: fade .5s ease-out backwards; animation-delay: var(--d); }
.growing g.node > rect { transform-box: fill-box; transform-origin: center; animation: nodepop .5s cubic-bezier(.25,1,.5,1) backwards; animation-delay: var(--d); }
.growing .flowchart-link:not(.edge-pattern-dotted) { stroke-dasharray: 1; animation: draw .4s ease-in-out backwards; animation-delay: var(--d); }
.growing .flowchart-link.edge-pattern-dotted { animation: fade .4s ease-out backwards; animation-delay: var(--d); }
#whys-diagram .flowchart-link.edge-pattern-dotted { stroke: var(--warn) !important; stroke-dasharray: 5 4; }
#whys-diagram .edgeLabel.impact p, #whys-diagram .edgeLabel.impact span { color: var(--warn) !important; }
.growing .edgeLabel { animation: fade .3s ease-out backwards; animation-delay: var(--d); }
@keyframes nodepop { from { transform: scale(.82); } to { transform: none; } }

.whys-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .whys-grid { grid-template-columns: minmax(0, 1fr); } }
.tree-box { padding: 18px 18px 18px 8px; }
.tree, .tree ul { list-style: none; margin: 0; padding-left: 22px; }
.tree ul { position: relative; }
.tree li { position: relative; padding: 6px 0 0 14px; }
.tree li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1.5px solid var(--border); }
.tree li:last-child::before { bottom: auto; height: 20px; }
.tree li::after { content: ""; position: absolute; left: 0; top: 20px; width: 10px; border-top: 1.5px solid var(--border); }
.tree .problem { font-weight: 650; color: var(--bad); padding: 0 0 2px 10px; }
.why { font-size: 14.5px; line-height: 1.5; }
.why .q { font: 600 11.5px var(--mono); color: var(--muted); margin-right: 4px; white-space: nowrap; }
.why .q.impact { color: var(--warn); }
.why .ev { font-size: 13px; color: var(--muted); margin-top: 1px; }
.is-root > .why { background: var(--good-soft); border-radius: var(--r-sm); padding: 6px 10px; margin-left: -4px; }
.is-root > .why .txt { color: var(--good); font-weight: 650; }
.is-open > .why { background: var(--warn-soft); border-radius: var(--r-sm); padding: 6px 10px; margin-left: -4px; }
.roots { display: grid; gap: 12px; }
.root-card { padding: 14px 16px; display: grid; gap: 10px; transition: border-color .15s; }
.root-card:hover { border-color: var(--good); }
.root-card .head { display: flex; gap: 10px; align-items: baseline; }
.root-card .head p { font-weight: 650; }
.root-card ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.root-card li { display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; }
.root-card li .w { flex: 1; min-width: 0; }
.how { font-size: 13.5px; color: var(--muted); max-width: var(--read); }
.how b { color: var(--text); }

/* three columns */
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 860px) { .cols3 { grid-template-columns: minmax(0, 1fr); } }
.card { padding: 16px 18px; display: grid; gap: 8px; align-content: start; }
.card h3 { font-size: 15px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.card p, .card li { font-size: 14.5px; }
.card ul { margin: 0; padding-left: 18px; display: grid; gap: 7px; }
.card h3 .sw { width: 9px; height: 9px; border-radius: 50%; }
.c-well .sw { background: var(--good); } .c-wrong .sw { background: var(--bad); } .c-lucky .sw { background: var(--warn); }
.c-lucky { background: color-mix(in srgb, var(--warn-soft) 45%, var(--surface)); }
.factors { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: var(--read); }

/* actions */
.table { overflow-x: auto; }
.table table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 11.5px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 11px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.table td { padding: 12px; border-top: 1px solid var(--border); vertical-align: top; }
.table tr:first-child td { border-top: 0; }
.table td.nowrap { white-space: nowrap; }
.table tr.done td.what { color: var(--muted); }
@media (max-width: 760px) {
  .table thead { display: none; }
  .table table, .table tbody, .table tr, .table td { display: block; }
  .table tr { padding: 12px 14px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .table tr:first-child { border-top: 0; }
  .table td { padding: 0; border: 0; }
  .table td.what { flex-basis: 100%; order: -1; font-weight: 600; }
  .table td[data-l]::before { content: attr(data-l) " "; color: var(--muted); font-size: 12px; }
}

.people { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .people { grid-template-columns: minmax(0, 1fr); } }
.responders { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.responders li { display: grid; gap: 0; }
.responders small { color: var(--muted); font-size: 12.5px; }
.msg { display: grid; gap: 8px; }
.msg .top { display: flex; align-items: center; gap: 10px; }
.msg .top .kicker { flex: 1; }
.msg blockquote { margin: 0; padding: 12px 14px; background: var(--subtle); border-radius: var(--r-sm); font-size: 14.5px; }
.links { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--canvas); padding: 9px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 600; z-index: 30; box-shadow: var(--shadow); }
.copybox { position: fixed; inset: 10% 8%; z-index: 40; font: 12px/1.5 var(--mono); padding: 14px; border-radius: var(--r); border: 1px solid var(--border); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

<script>
const DATA = {"title":"Role search returned roles nobody asked for: `names` matched substrings and `name_contains` was ignored","short":"Role names substring","service":"anchor","date":"2026-10-31","severity":"SEV3","status":"in review","authors":["Nanostack routine (echopoint-investigation)"],"summary":"`POST /v1/products/{product}/roles/search` has filtered `filter.names` with `LIKE '%name%'` since the v1 snapshot (2026-05-11), although the contract says \"exact matches\". The `filter.name_contains` field that the contract offers for substrings was never mapped, so the server silently ignored it and returned every role. Nobody noticed until infra#271 added a `workspace_admin` role to the Echopoint product on dev and prod at 22:29Z on 2026-10-31, the first role name that contains another one. At 23:13Z the routine's echopoint suite failed: `echopoint: cursor searches — members, invitations & api keys` looked up `names: [\"admin\"]` and got two roles. The flow was narrowed by `resource_types` at 23:32Z and the exact-match checks moved to `anchor: known bugs`; the server fix (exact `names`, mapped `name_contains`, near-miss tests) waits for review because clients see the change.","impact":{"text":"Every Anchor API client on dev and prod that searched roles by `names` got every role whose name contains the searched name, and a client that used `name_contains` got every role of the product. The responses looked plausible (more rows, never an error), so the impact on customers is unmeasurable. Echopoint does not call the role search. One routine suite run lost the cursor-search checks for members, invitations and API keys (one flow of 40); the next echopoint post-deploy gate would have failed on the same flow and held the deploy.","numbers":[{"value":"173 days","label":"contract drift in prod (2026-05-11 to 2026-10-31)"},{"value":"1 of 71","label":"suite flows red (cursor searches)"},{"value":"0","label":"gates blocked (no deploy in the window)"}]},"trigger":"infra#271 applied the Echopoint `workspace_admin`, `workspace_editor` and `workspace_viewer` managed roles to the Echopoint product on dev (22:29:12Z) and prod (22:29:26Z). `workspace_admin` contains `admin`, so `names: [\"admin\"]` started to return two roles.","detection":"The routine's echopoint suite run at 23:13Z: node `admin-role` asserted `$.total equals 1` and got 2. Detection took 44 minutes after the trigger. It took 173 days after the defect, because every fixture and every caller used role names where none contained another, and the existing tests could not tell exact from substring: the repository test even pinned the substring behaviour.","resolution":"At 23:31Z `anchor: known bugs` gained an own-product reproduction (`kbadmin`, `ws_kbadmin`, `kbviewer`): `names` gives 2 for 1 and `name_contains` gives 3 for 2, twice. At 23:32Z the cursor-search flow's `admin-role` lookup added `resource_types: [\"organization\"]` and ran green three times. The fix PR filters `names` by equality, maps `name_contains` to an escaped, case-insensitive substring match like the resource search, and adds a near-miss role to the CT and repository tests.","timeline":{"events":[{"t":"2026-05-11T21:16:14Z","approx":true,"kind":"change","label":"v1 snapshot: role `names` filter is `LIKE '%name%'`","detail":"`product_role_repository.go` builds one `LIKE` per name; the API mapper never copies `NameContains`. The contract already said \"exact matches\" and offered `name_contains`.","link":"https://github.com/nanostack-dev/anchor/commit/98d19607","_ms":1778534174000,"_rel":-14951574.0},{"t":"2026-10-16T02:40:37Z","kind":"change","label":"Cursor-search flow finds role `admin` by `names`, total 1","detail":"Created by another session for echopoint#645; it reads the shared dev Echopoint product's catalog. Source: flow `updated_at`.","_ms":1792118437000,"_rel":-1367311.0},{"t":"2026-10-31T22:28:47Z","kind":"change","label":"infra#271 merged: Echopoint workspace roles","link":"https://github.com/nanostack-dev/infra/pull/271","_ms":1793485727000,"_rel":-21.0},{"t":"2026-10-31T22:29:08Z","kind":"trigger","label":"`workspace_admin` created on the dev Echopoint product","detail":"`created_at` of the role in the failing search response; Terraform job `apply-dev` 22:28:57-22:29:12Z.","link":"https://github.com/nanostack-dev/infra/actions/runs/41248358677","_ms":1793485748000,"_rel":0.0},{"t":"2026-10-31T22:29:26Z","kind":"note","label":"Same roles applied to the prod Echopoint product","detail":"Terraform job `apply-prod` 22:29:13-22:29:26Z. No flow suite runs after an Anchor catalog apply.","link":"https://github.com/nanostack-dev/infra/actions/runs/41248358677","_ms":1793485766000,"_rel":18.0},{"t":"2026-10-31T23:13:11Z","kind":"detect","label":"Suite: `admin-role` expected total 1, got 2","detail":"Execution `01a1943d-038f`; 112 later nodes skipped, cleanup ran. The five org API keys whose cleanup failed (403: the tester never became a member) were removed by the org delete's `ON DELETE CASCADE`.","_ms":1793488391000,"_rel":2643.0},{"t":"2026-10-31T23:20:00Z","approx":true,"kind":"note","label":"Contract read: `names` exact, `name_contains` unmapped","_ms":1793488800000,"_rel":3052.0},{"t":"2026-10-31T23:31:21Z","kind":"note","label":"`anchor: known bugs` reproduces both drifts twice","_ms":1793489481000,"_rel":3733.0},{"t":"2026-10-31T23:32:06Z","kind":"mitigate","label":"Cursor-search flow narrowed by `resource_types`","_ms":1793489526000,"_rel":3778.0},{"t":"2026-10-31T23:34:00Z","approx":true,"kind":"resolve","label":"Cursor-search flow green three times","_ms":1793489640000,"_rel":3892.0},{"t":"2026-10-31T23:55:00Z","approx":true,"kind":"followup","label":"Fix PR opened, waiting for human review","_ms":1793490900000,"_rel":5152.0}]},"whys":{"problem":"A client that searched roles by `names: [\"admin\"]` got `admin` and `workspace_admin`; one that used `name_contains` got every role","because":[{"text":"The repository filters `names` with `LIKE '%name%'` ins because":[{"id":"R3","root":true,"text":"Anchor catalog applies reach dev and prod without running the flow suites that read that catalog","_id":"R3"}],"_id":"W9"}],"_id":"W8"}],"_id":"W7"},{"lens":"impact","text":"The drift lived 173 days in prod with no report","because":[{"text":"Both defects return extra rows, never an error, and no caller had a name containing another","because":[{"text":"The suites searched only shared catalogs whose names happened to be distinct","because":[{"id":"R4","root":true,"text":"No flow checked a search filter on its own fixture with a lookalike value, so the shared data decided what was tested","_id":"R4"}],"_id":"W12"}],"_id":"W11"}],"_id":"W10"}]},"contributing":["The other `names` filters (organizations, API keys, workspaces) already use `jetx.BuildStringArrayFilter`; only roles kept the hand-built `LIKE`.","The cursor-search flow's API key cleanup used the tester's session, whose access comes from a later step (accepting the invitation), so it answered 403 when an earlier node failed."],"lessons":{"well":["A count assertion on a lookup (`total equals 1`) caught a filter defect that 173 days of green results had hidden.","The reproduction went into `anchor: known bugs` on an own product before the feature flow changed, so the defect stays visible."],"wrong":["The repository test documented the substring behaviour as intended, against the contract next to it.","A catalog change to dev and prod shipped with a Terraform plan as its only check."],"lucky":["No echopoint or anchor deploy ran between 22:29Z and 23:32Z, so no post-deploy gate failed and no promotion was held.","Echopoint does not call the role search, so the new workspace roles did not change any Echopoint authorization.","The org delete cascades to its API keys; the flow's own key cleanup failed and would otherwise have leaked five keys."]},"actions":[{"id":"A1","what":"Filter `names` by equality, map `name_contains` (escaped, case-insensitive, like resources), add a near-miss role to the CT and repository tests","type":"prevent","owner":"Anchor maintainers (review)","due":"2026-11-07","status":"open","fixes":["R1","R2"]},{"id":"A2","what":"Testing guide line: a filter test includes a near-miss row, so exact and substring answer differently","type":"process","owner":"Nanostack routine (echopoint-investigation)","due":"2026-10-31","status":"done","fixes":["R1"]},{"id":"A3","what":"Test that every field of each generated search filter is read by its mapper (reflection over the generated structs, with an allowlist)","type":"detect","owner":"Anchor maintainers","due":"2026-11-14","status":"open","fixes":["R2"]},{"id":"A4","what":"Run the `anchor` and `echopoint` flow tags after the Anchor catalog apply on dev, before apply-prod","type":"detect","owner":"Infra maintainers","due":"2026-11-14","status":"open","fixes":["R3"]},{"id":"A5","what":"Own-product reproduction in `anchor: known bugs`; cursor-search lookup narrowed by `resource_types`","type":"mitigate","owner":"Nanostack routine (echopoint-investigation)","due":"2026-10-31","status":"done","fixes":["R3","R4"]},{"id":"A6","what":"Flow-suite-testing skill line: test a search filter on an owned fixture with a lookalike value, and narrow lookups in shared catalogs by every discriminator","type":"process","owner":"Nanostack routine (echopoint-investigation)","due":"2026-10-31","status":"done","fixes":["R4"]}],"responders":[{"role":"Detection, diagnosis and fix","name":"Nanostack routine (echopoint-investigation)"}],"messaging":{"internal":"SEV3 anchor: role search `names` matched substrings and `name_contains` was ignored since v1, in dev and prod. infra#271's `workspace_admin` exposed it. Flow narrowed and reproduction in `anchor: known bugs`; fix waits for review because clients see the change.","external":"Role search now treats `filter.names` as exact matches and supports `filter.name_contains`, as documented. Clients that relied on partial matches in `names` should move them to `name_contains`."},"links":[{"label":"Report","url":"https://claude.ai/artifact/TDFZ5F5nMnaYhUsDtV9VeL"},{"label":"infra#271","url":"https://github.com/nanostack-dev/infra/pull/271"},{"label":"Terraform run 41248358677","url":"https://github.com/nanostack-dev/infra/actions/runs/41248358677"}],"_m":{"t0":1793485748000,"ttd":2643.0,"detect_ms":1793488391000,"ttm":3778.0,"mitigate_ms":1793489526000,"ttr":3892.0,"resolve_ms":1793489640000},"_depth":{"P":0,"W1":1,"W2":2,"W3":3,"R1":4,"W4":1,"W5":2,"W6":3,"R2":4,"W7":1,"W8":2,"W9":3,"R3":4,"W10":1,"W11":2,"W12":3,"R4":4},"_mermaid":"flowchart TD\n  P[\"A client that searched roles by `names: [#quot;admin#quot;]` got `admin` and `workspace_admin`; one that used `name_contains` got every role\"]\n  W1[\"The repository filters `names` with `LIKE '%name%'` instead of equality\"]\n  W2[\"The v1 code was written that way and no test compared it with the contract's #quot;exact matches#quot;\"]\n  W3[\"The CT searched names that share no substring (`Editor_…`, `Admin_…`), so exact and substring answer alike\"]\n  R1[\"R1 · Filter tests use fixtures without a near-miss row, so they cannot tell an exact filter from a substring one\"]\n  W4[\"`name_contains` reaches the server and is dropped: the API mapper never copies it to the domain filter\"]\n  W5[\"Mappers from generated filter types are written by hand, field by field\"]\n  W6[\"An unread generated field compiles and passes every test; only a test that sends it would fail\"]\n  R2[\"R2 · Nothing checks that every contract filter field of a search reaches its query\"]\n  W7[\"It surfaced as a red suite flow, and would have held the next echopoint deploy, though no app code changed\"]\n  W8[\"infra#271 changed the shared dev Echopoint catalog that the gate reads, from Terraform, outside any app deploy\"]\n  W9[\"The Anchor catalog Terraform applies dev and prod in one run, with no suite between them\"]\n  R3[\"R3 · Anchor catalog applies reach dev and prod without running the fl very contract filter field of a search reaches its query\"]\n  W7[\"It surfaced as a red suite flow, and would have held the next echopoint deploy, though no app code changed\"]\n  W8[\"infra#271 changed the shared dev Echopoint catalog that the gate reads, from Terraform, outside any app deploy\"]\n  W9[\"The Anchor catalog Terraform applies dev and prod in one run, with no suite between them\"]\n  R3[\"R3 · Anchor catalog applies reach dev and prod without running the flow suites that read that catalog\"]\n  W10[\"The drift lived 173 days in prod with no report\"]\n  W11[\"Both defects return extra rows, never an error, and no caller had a name containing another\"]\n  W12[\"The suites searched only shared catalogs whose names happened to be distinct\"]\n  R4[\"R4 · No flow checked a search filter on its own fixture with a lookalike value, so the shared data decided what was tested\"]\n  P -->|why?| W1\n  W1 -->|why?| W2\n  W2 -->|why?| W3\n  W3 -->|why?| R1\n  P -->|why?| W4\n  W4 -->|why?| W5\n  W5 -->|why?| W6\n  W6 -->|why?| R2\n  P -.->|why so bad?| W7\n  W7 -->|why?| W8\n  W8 -->|why?| W9\n  W9 -->|why?| R3\n  P -.->|why so bad?| W10\n  W10 -->|why?| W11\n  W11 -->|why?| W12\n  W12 -->|why?| R4\n  class P problem\n  class R1,R2,R3,R4 root\n  classDef problem stroke-width:2px\n  classDef root stroke-width:2px\n  classDef open stroke-dasharray:5 4","_markdown":"# Role search returned roles nobody asked for: `names` matched substrings and `name_contains` was ignored\n\n| | |\n|---|---|\n| **Date** | 2026-10-31 |\n| **Severity** | SEV3 |\n| **Status** | In review |\n| **Service** | anchor |\n| **Authors** | Nanostack routine (echopoint-investigation) |\n| **Duration** | ~1h 04m (trigger to resolution) |\n| **Time to detect** | 44m 03s |\n| **Time to mitigate** | 1h 02m |\n\n> Blameless: this document names systems, processes and missing guards, not people.\n\n## Summary\n\n`POST /v1/products/{product}/roles/search` has filtered `filter.names` with `LIKE '%name%'` since the v1 snapshot (2026-05-11), although the contract says \"exact matches\". The `filter.name_contains` field that the contract offers for substrings was never mapped, so the server silently ignored it and returned every role. Nobody noticed until infra#271 added a `workspace_admin` role to the Echopoint product on dev and prod at 22:29Z on 2026-10-31, the first role name that contains another one. At 23:13Z the routine's echopoint suite failed: `echopoint: cursor searches — members, invitations & api keys` looked up `names: [\"admin\"]` and got two roles. The flow was narrowed by `resource_types` at 23:32Z and the exact-match checks moved to `anchor: known bugs`; the server fix (exact `names`, mapped `name_contains`, near-miss tests) waits for review because clients see the change.\n\n## Impact\n\nEvery Anchor API client on dev and prod that searched roles by `names` got every role whose name contains the searched name, and a client that used `name_contains` got every role of the product. The responses looked plausible (more rows, never an error), so the impact on customers is unmeasurable. Echopoint does not call the role search. One routine suite run lost the cursor-search checks for members, invitations and API keys (one flow of 40); the next echopoint post-deploy gate would have failed on the same flow and held the deploy.\n\n- **173 days** contract drift in prod (2026-05-11 to 2026-10-31)\n- **1 of 71** suite flows red (cursor searches)\n- **0** gates blocked (no deploy in the window)\n\n## Trigger\n\ninfra#271 applied the Echopoint `workspace_admin`, `workspace_editor` and `workspace_viewer` managed roles to the Echopoint product on dev (22:29:12Z) and prod (22:29:26Z). `workspace_admin` contains `admin`, so `names: [\"admin\"]` started to return two roles.\n\n## Detection\n\nThe routine's echopoint suite run at 23:13Z: node `admin-role` asserted `$.total equals 1` and got 2. Detection took 44 minutes after the trigger. It took 173 days after the defect, because every fixture and every caller used role names where none contained another, and the existing tests could not tell exact from substring: the repository test even pinned the substring behaviour.\n\n## Resolution\n\nAt 23:31Z `anchor: known bugs` gained an own-product reproduction (`kbadmin`, `ws_kbadmin`, `kbviewer`): `names` gives 2 for 1 and `name_contains` gives 3 for 2, twice. At 23:32Z the cursor-search flow's `admin-role` lookup added `resource_types: [\"organization\"]` and ran green three times. The fix PR filters `names` by equality, maps `name_contains` to an escaped, case-insensitive substring match like the resource search, and adds a near-miss role to the CT and repository tests.\n\n## Timeline (UTC)\n\n| Time | | Event |\n|---|---|---|\n| ~21:16 | T−173d 01h | **v1 snapshot: role `names` filter is `LIKE '%name%'`** `product_role_repository.go` builds one `LIKE` per name; the API mapper never copies `NameContains`. The contract already said \"exact matches\" and offered `name_contains`. ([link](https://github.com/nanostack-dev/anchor/commit/98d19607)) |\n| 02:40:37 | T−15d 19h | **Cursor-search flow finds role `admin` by `names`, total 1** Created by another session for echopoint#645; it reads the shared dev Echopoint product's catalog. Source: flow `updated_at`. |\n| 22:28:47 | T−21s | **infra#271 merged: Echopoint workspace roles** ([link](https://github.com/nanostack-dev/infra/pull/271)) |\n| 22:29:08 | T+0s | **`workspace_admin` created on the dev Echopoint product** `created_at` of the role in the failing search response; Terraform job `apply-dev` 22:28:57-22:29:12Z. ([link](https://github.com/nanostack-dev/infra/actions/runs/41248358677)) |\n| 22:29:26 | T+18s | **Same roles applied to the prod Echopoint product** Terraform job `apply-prod` 22:29:13-22:29:26Z. No flow suite runs after an Anchor catalog apply. ([link](https://github.com/nanostack-dev/infra/actions/runs/41248358677)) |\n| 23:13:11 | T+44m 03s | **Suite: `admin-role` expected total 1, got 2** Execution `01a1943d-038f`; 112 later nodes skipped, cleanup ran. The five org API keys whose cleanup failed (403: the tester never became a member) were removed by the org delete's `ON DELETE CASCADE`. |\n| ~23:20 | T+50m 52s | **Contract read: `names` exact, `name_contains` unmapped** |\n| 23:31:21 | T+1h 02m | **`anchor: known bugs` reproduces both drifts twice** |\n| 23:32:06 | T+1h 02m | **Cursor-search flow narrowed by `resource_types`** |\n| ~23:34 | T+1h 04m | **Cursor-search flow green three times** |\n| ~23:55 | T+1h 25m | **Fix PR opened, waiting for human review** |\n\n## Root cause analysis: the five whys\n\nStart at the impact and ask why until the answer is something the team can change. Solid edges ask why it happened; dashed edges ask why the impact was as large as it was.\n\n```mermaid\nflowchart TD\n  P[\"A client that searched roles by `names: [#quot;admin#quot;]` got `admin` and `workspace_admin`; one that used `name_contains` got every role\"]\n  W1[\"The repository filters `names` with `LIKE '%name%'` instead of equality\"]\n  W2[\"The v1 code was written that way and no test compared it with the contract's #quot;exact matches#quot;\"]\n  W3[\"The CT searched names that share no substring (`Editor_…`, `Admin_…`), so exact and substring answer alike\"]\n  R1[\"R1 · Filter tests use fixtures without a near-miss row, so they cannot tell an exact filter from a substring one\"]\n  W4[\"`name_contains` reaches the server and is dropped: the API mapper never copies it to the domain filter\"]\n  W5[\"Mappers from generated filter types are written by hand, field by field\"]\n  W6[\"An unread generated field compiles and passes every test; only a test that sends it would fail\"]\n  R2[\"R2 · Nothing checks that every contract filter field of a search reaches its query\"]\n  W7[\"It surfaced as a red suite flow, and would have held the next echopoint deploy, though no app code changed\"]\n  W8[\"infra#271 changed the shared dev Echopoint catalog that the gate reads, from Terraform, outside any app deploy\"]\n  W9[\"The Anchor catalog Terraform applies dev and prod in one run, with no suite between them\"]\n  R3[\"R3 · Anchor catalog applies reach dev and prod without running the flow suites that read that catalog\"]\n  W10[\"The drift lived 173 days in prod with no report\"]\n  W11[\"Both defects return extra rows, never an error, and no caller had a name containing another\"]\n  W12[\"The suites searched only shared catalogs whose names happened to be distinct\"]\n  R4[\"R4 · No flow checked a search filter on its own fixture with a lookalike value, so the shared data decided what was tested\"]\n  P -->|why?| W1\n  W1 -->|why?| W2\n  W2 -->|why?| W3\n  W3 -->|why?| R1\n  P -->|why?| W4\n  W4 -->|why?| W5\n  W5 -->|why?| W6\n  W6 -->|why?| R2\n  P -.->|why so bad?| W7\n  W7 -->|why?| W8\n  W8 -->|why?| W9\n  W9 -->|why?| R3\n  P -.->|why so bad?| W10\n  W10 -->|why?| W11\n  W11 -->|why?| W12\n  W12 -->|why?| R4\n  class P problem\n  class R1,R2,R3,R4 root\n  classDef problem fill:#fdecea,stroke:#c2362f,stroke-width:2px,color:#4a1210\n  classDef root fill:#e7f5ec,stroke:#1f7a45,stroke-width:2px,color:#0f3a20,font-weight:bold\n  classDef open fill:#fff4d9,stroke:#9a6200,stroke-dasharray:5 4,color:#3f2a00\n```\n\n- **Problem:** A client that searched roles by `names: [\"admin\"]` got `admin` and `workspace_admin`; one that used `name_contains` got every role\n  - **Why?** The repository filters `names` with `LIKE '%name%'` instead of equality _Evidence: `apps/anchor/internal/repository/product_role_repository.go` (`Name.LIKE(\"%\" + name + \"%\")`); the failing node's response holds both roles_\n    - **Why?** The v1 code was written that way and no test compared it with the contract's \"exact matches\" _Evidence: Repository test `TestProductRoleRepositorySearchByProductIDFilterByNames` asserted \"a partial name is enough\"_\n      - **Why?** The CT searched names that share no substring (`Editor_…`, `Admin_…`), so exact and substring answer alike _Evidence: `cmd/it/ct/product_role_search_test.go` before the fix_\n        - **Why?** Filter tests use fixtures without a near-miss row, so they cannot tell an exact filter from a substring one → **Root cause R1** (fixed by A1, A2)\n  - **Why?** `name_contains` reaches the server and is dropped: the API mapper never copies it to the domain filter _Evidence: `mapToSearchProductRoleInput` in `internal/api/product_role_api.go` copies ids, names, permissions, resource types only_\n    - **Why?** Mappers from generated filter types are written by hand, field by field\n      - **Why?** An unread generated field compiles and passes every test; only a test that sends it would fail\n        - **Why?** Nothing checks that every contract filter field of a search reaches its query → **Root cause R2** (fixed by A1, A3)\n  - **Why so bad?** It surfaced as a red suite flow, and would have held the next echopoint deploy, though no app code changed _Evidence: The echopoint post-deploy gate runs the `echopoint` tag, which holds the cursor-search flow_\n    - **Why?** infra#271 changed the shared dev Echopoint catalog that the gate reads, from Terraform, outside any app deploy _Evidence: Run 41248358677: prep, apply-dev, apply-prod, notify; no flow job_\n      - **Why?** The Anchor catalog Terraform applies dev and prod in one run, with no suite between them\n        - **Why?** Anchor catalog applies reach dev and prod without running the flow suites that read that catalog → **Root cause R3** (fixed by A4, A5)\n  - **Why so bad?** The drift lived 173 days in prod with no report\n    - **Why?** Both defects return extra rows, never an error, and no caller had a name containing another\n      - **Why?** The suites searched only shared catalogs whose names happened to be distinct\n        - **Why?** No flow checked a search filter on its own fixture with a lookalike value, so the shared data decided what was tested → **Root cause R4** (fixed by A5, A6)\n\n## Root causes\n\n- **R1** Filter tests use fixtures without a near-miss row, so they cannot tell an exact filter from a substring one\n- **R2** Nothing checks that every contract filter field of a search reaches its query\n- **R3** Anchor catalog applies reach dev and prod without running the flow suites that read that catalog\n- **R4** No flow checked a search filter on its own fixture with a lookalike value, so the shared data decided what was tested\n\n## Contributing factors\n\n- The other `names` filters (organizations, API keys, workspaces) already use `jetx.BuildStringArrayFilter`; only roles kept the hand-built `LIKE`.\n- The cursor-search flow's API key cleanup used the tester's session, whose access comes from a later step (accepting the invitation), so it answered 403 when an earlier node failed.\n\n## Lessons learned\n\n### What went well\n\n- A count assertion on a lookup (`total equals 1`) caught a filter defect that 173 days of green results had hidden.\n- The reproduction went into `anchor: known bugs` on an own product before the feature flow changed, so the defect stays visible.\n\n### What went wrong\n\n- The repository test documented the substring behaviour as intended, against the contract next to it.\n- A catalog change to dev and prod shipped with a Terraform plan as its only check.\n\n### Where we got lucky\n\n- No echopoint or anchor deploy ran between 22:29Z and 23:32Z, so no post-deploy gate failed and no promotion was held.\n- Echopoint does not call the role search, so the new workspace roles did not change any Echopoint authorization.\n- The org delete cascades to its API keys; the flow's own key cleanup failed and would otherwise have leaked five keys.\n\n## Action items\n\n| ID | Action | Type | Owner | Due | Status | Ticket | Fixes |\n|---|---|---|---|---|---|---|---|\n| A1 | Filter `names` by equality, map `name_contains` (escaped, case-insensitive, like resources), add a near-miss role to the CT and repository tests | prevent | Anchor maintainers (review) | 2026-11-07 | open |  | R1, R2 |\n| A2 | Testing guide line: a filter test includes a near-miss row, so exact and substring answer differently | process | Nanostack routine (echopoint-investigation) | 2026-10-31 | done |  | R1 |\n| A3 | Test that every field of each generated search filter is read by its mapper (reflection over the generated structs, with an allowlist) | detect | Anchor maintainers | 2026-11-14 | open |  | R2 |\n| A4 | Run the `anchor` and `echopoint` flow tags after the Anchor catalog apply on dev, before apply-prod | detect | Infra maintainers | 2026-11-14 | open |  | R3 |\n| A5 | Own-product reproduction in `anchor: known bugs`; cursor-search lookup narrowed by `resource_types` | mitigate | Nanostack routine (echopoint-investigation) | 2026-10-31 | done |  | R3, R4 |\n| A6 | Flow-suite-testing skill line: test a search filter on an owned fixture with a lookalike value, and narrow lookups in shared catalogs by every discriminator | process | Nanostack routine (echopoint-investigation) | 2026-10-31 | done |  | R4 |\n\n## Responders\n\n- **Detection, diagnosis and fix**: Nanostack routine (echopoint-investigation)\n\n## Messaging\n\n### Internal\n\nSEV3 anchor: role search `names` matched substrings and `name_contains` was ignored since v1, in dev and prod. infra#271's `workspace_admin` exposed it. Flow narrowed and reproduction in `anchor: known bugs`; fix waits for review because clients see the change.\n\n### Customers\n\nRole search now treats `filter.names` as exact matches and supports `filter.name_contains`, as documented. Clients that relied on partial matches in `names` should move them to `name_contains`.\n\n## Supporting information\n\n- [Report](https://claude.ai/artifact/TDFZ5F5nMnaYhUsDtV9VeL)\n- [infra#271](https://github.com/nanostack-dev/infra/pull/271)\n- [Terraform run 41248358677](https://github.com/nanostack-dev/infra/actions/runs/41248358677)\n"};

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = s => esc(s)
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/`([^`]+)`/g, "<code>$1</code>")

function dur(sec) {
  const s = Math.round(Math.abs(sec));
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}m`;
  return `${Math.floor(s / 86400)}d ${String(Math.floor(s % 86400 / 3600)).padStart(2, "0")}h`;
}
const rel = sec => (sec >= 0 ? "T+" : "T−") + dur(sec);
const iso = ms => new Date(ms).toISOString();
const clock = e => e.approx ? "~" + iso(e._ms).slice(11, 16) : iso(e._ms).slice(11, 19);

/* ------------------------------------------------------------ timeline replay */

const TOTAL = 7; // seconds for one replay

function niceStep(span) {
  const steps = [10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 14400, 21600, 43200, 86400];
  return (steps.find(s => span / s <= 8) || 86400) * 1000;
}

function timelineSvg() {
  if (!EVENTS.length || M.t0 == null) return "";
  const W = 1000, L = 28, R = 28, SEG = 120, GAP = 22;
  const end = M.resolve_ms ?? EVENTS[EVENTS.length - 1]._ms;
  const pad = Math.max((end - M.t0) * 0.14, 30000);
  const fa = M.t0 - pad, fb = end + pad;
  const before = EVENTS.filter(e => e._ms < fa), after = EVENTS.filter(e => e._ms > fb);
  const x0 = L + (before.length ? SEG + GAP : 0), x1 = W - R - (after.length ? SEG + GAP : 0);
  const lin = (t, a, b, xa, xb) => b === a ? (xa + xb) / 2 : xa + (t - a) / (b - a) * (xb - xa);
  const bMin = before.length ? before[0]._ms : 0, aMax = after.length ? after[after.length - 1]._ms : 0;
  const x = t => t < fa ? lin(t, bMin, fa, L + 8, L + SEG - 8) : t > fb ? lin(t, fb, aMax, W - R - SEG + 8, W - R - 8) : lin(t, fa, fb, x0, x1);

  const metric = D.timeline?.metric;
  const pts = (metric?.points || []).map(([t, v]) => [Date.parse(t), +v]).filter(p => !isNaN(p[0]) && !isNaN(p[1]));
  const hasMetric = pts.length > 1;
  const phaseY = 18, axisY = hasMetric ? 196 : 82;
  const out = [];

  // metric
  if (hasMetric) {
    const top = 66, bot = axisY - 22, vmax = Math.max(...pts.map(p => p[1])) || 1;
    const y = v => bot - v / vmax * (bot - top);
    const line = pts.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
    out.push(`<path class="metric-area" d="${line}L${x(pts[pts.length - 1][0]).toFixed(1)},${bot}L${x(pts[0][0]).toFixed(1)},${bot}Z"/>`);
    out.push(`<path class="metric-line" pathLength="1" d="${line}"/>`);
    out.push(`<text class="metric-axis" x="${L}" y="${top - 8}">${esc(metric.label || "")} · peak ${vmax}${esc(metric.unit || "")}</text>`);
    out.push(`<line class="tick" x1="${L}" x2="${W - R}" y1="${bot}" y2="${bot}" stroke="var(--border)"/>`);
  }

  // phases
  const ph = [];
  if (M.detect_ms != null) ph.push(["undetected", "Undetected", M.t0, M.detect_ms]);
  if (M.detect_ms != null && M.mitigate_ms != null) ph.push(["responding", "Responding", M.detect_ms, M.mitigate_ms]);
  else if (M.detect_ms != null && M.resolve_ms != null) ph.push(["responding", "Responding", M.detect_ms, M.resolve_ms]);
  if (M.mitigate_ms != null && M.resolve_ms != null) ph.push(["recovering", "Recovering", M.mitigate_ms, M.resolve_ms]);
  const usable = W - L - R;
  const delayAt = px => ((px - L) / usable * TOTAL).toFixed(2);
  out.push(`<g class="phase">`);
  for (const [cls, label, a, b] of ph) {
    const xa = x(a), xb = Math.max(x(b), xa + 2), w = xb - xa;
    const txt = `${label} ${dur((b - a) / 1000)}`;
    const fits = txt.length * 6.8 + 14 < w;
    out.push(`<g class="ph-${cls}" style="--d:${delayAt(xa)}s;--len:${((w / usable) * TOTAL).toFixed(2)}s"><rect x="${xa.toFixed(1)}" y="${phaseY}" width="${w.toFixed(1)}" height="22"/>${fits ? `<text x="${(xa + 8).toFixed(1)}" y="${phaseY + 15}">${esc(txt)}</text>` : ""}</g>`);
  }
  out.push(`</g>`);
  // phase guides down to the axis
  for (const t of [M.t0, M.detect_ms, M.mitigate_ms, M.resolve_ms].filter(v => v != null)) {
    out.push(`<line x1="${x(t).toFixed(1)}" x2="${x(t).toFixed(1)}" y1="${phaseY + 22}" y2="${axisY}" stroke="var(--border)" stroke-dasharray="2 3"/>`);
  }

  // axis and ticks
  out.push(`<line class="axis" x1="${x0}" x2="${x1}" y1="${axisY}" y2="${axisY}"/>`);
  const step = niceStep((fb - fa) / 1000);
  out.push(`<g class="tick">`);
  for (let t = Math.ceil(fa / step) * step; t <= fb; t += step) {
    const xx = x(t);
    if (xx < x0 + 18 || xx > x1 - 18) continue;
    out.push(`<line x1="${xx.toFixed(1)}" x2="${xx.toFixed(1)}" y1="${axisY - 4}" y2="${axisY + 4}"/><text x="${xx.toFixed(1)}" y="${axisY + 19}" text-anchor="middle">${iso(t).slice(11, step < 60000 ? 19 : 16)}</text>`);
  }
  out.push(`</g>`);
  out.push(`<text class="t" x="${x(M.t0).toFixed(1)}" y="${axisY - 10}" text-anchor="middle" style="fill:var(--bad);font-weight:600">T+0</text>`);
  if (before.length) {
    out.push(`<line class="axis" x1="${L}" x2="${L + SEG}" y1="${axisY}" y2="${axisY}" stroke-dasharray="4 4"/>`);
    out.push(`<path class="break" d="M${L + SEG + 5},${axisY + 7}l5,-14M${L + SEG + 12},${axisY + 7}l5,-14"/>`);
    out.push(`<text class="seglabel" x="${L}" y="${axisY + 19}">BEFORE</text>`);
  }
  if (after.length) {
    out.push(`<line class="axis" x1="${W - R - SEG}" x2="${W - R}" y1="${axisY}" y2="${axisY}" stroke-dasharray="4 4"/>`);
    out.push(`<path class="break" d="M${W - R - SEG - 17},${axisY + 7}l5,-14M${W - R - SEG - 10},${axisY + 7}l5,-14"/>`);
    out.push(`<text class="seglabel" x="${W - R}" y="${axisY + 19}" text-anchor="end">AFTER</text>`);
  }

  // events: markers on the axis, labels in lanes below
  const laneTop = axisY + 50, laneH = 40, lanes = [];
  // labels on the left half run right, on the right half run left. Each takes the first lane where it
  // overlaps no label, no lead line running down through that lane, and its own lead line crosses no label.
  const lane_ = () => ({ spans: [], lines: [] });
  const hit = (spans, a, b) => spans.some(([c, d]) => !(b < c || a > d));
  const items = EVENTS.map(e => {
    const xx = x(e._ms), label = e.label.length > 52 ? e.label.slice(0, 50) + "…" : e.label;
    const w = Math.max(label.length * 6.9, 120) + 10;

  for (const it of items) {

      <text class="t" x="${it.lx.toFixed(1)}" y="${ly - 1}" text-anchor="${it.anchor}">${esc(clock(it.e))} · ${esc(rel_)}</text>
      <text class="lbl" x="${it.lx.toFixed(1)}" y="${ly + 15}" text-anchor="${it.anchor}">${esc(it.label)}</text></g>`);
  }

  out.push(`<g class="playhead" style="--span:${usable}px"><line x1="${L}" x2="${L}" y1="${phaseY - 6}" y2="${axisY + 8}"/><circle cx="${L}" cy="${axisY}" r="3.5"/></g>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Incident timeline from trigger to resolution" style="--total:${TOTAL}s">${out.join("")}</svg>`;
}

function timelineSection() {
  const phases = [
    ["undetected", "Undetected", M.ttd],

    const [kl, tone] = KIND[e.kind] || [e.kind, "muted"];
    return `<li class="k-${esc(e.kind)}"><span class="time">${esc(clock(e))}</span><span class="rel">${e._rel != null ? esc(rel(e._rel)) : ""}</span><span><span class="chip sm ${tone}">${esc(kl)}</span></span>
      <div class="what"><b>${md(e.label)}</b>${e.link ? ` <a href="${esc(e.link)}" target="_blank" rel="noopener">link</a>` : ""}${e.detail ? `<p>${md(e.detail)}</p>` : ""}</div></li>`;
  }).join("");
  return `<section id="timeline"><header><h2>Timeline</h2><span class="hint">UTC. T+ counts from the trigger.</span><span class="spacer"></span>${REDUCED ? "" : `<button class="btn" type="button" id="replay-tl">${ICON.replay}Replay</button>`}</header>
    <div class="box replay"><div class="scroll" id="tl-svg">${timelineSvg()}</div>
    <div class="legend">${phases.map(([c, l, s]) => `<span class="l-${c}"><i></i>${l} <b>${dur(s)}</b></span>`).join("")}</div></div>
    <div class="box"><ol class="events">${list}</ol></div></section>`;
}

/* ------------------------------------------------------------ five whys */

function whyTree(children) {
  if (!children?.length) return "";
  return `<ul>${children.map(n => {
    const impact = n.lens === "impact";
    const fixes = n.root ? (D.actions || []).filter(a => (a.fixes || []).includes(n._id)) : [];
    return `<li class="${n.root ? "is-root" : ""}${n.open ? " is-open" : ""}"><div class="why">
      <span class="q${impact ? " impact" : ""}">${impact ? "Why so bad?" : "Why?"}</span>
      ${n.root ? `<span class="rid">${esc(n._id)}</span> ` : ""}<span class="txt">${md(n.text)}</span>
      ${n.evidence ? `<div class="ev">Evidence: ${md(n.evidence)}</div>` : ""}
      ${n.root ? `<div class="ev">Fixed by ${fixes.map(a => `<span class="aid">${esc(a.id)}</span>`).join(" ") || "nothing yet"}</div>` : ""}
      ${n.open ? `<div class="ev">Open: still investigating</div>` : ""}
    </div>${whyTree(n.because)}</li>`;
  }).join("")}</ul>`;
}

function collectRoots(children, acc = []) {
  for (const n of children || []) { if (n.root) acc.push(n); collectRoots(n.because, acc); }
  return acc;
}

function whysSection() {
  const w = D.whys || {};
  const roots = collectRoots(w.because);
  const cards = roots.map(r => {
    const acts = (D.actions || []).filter(a => (a.fixes || []).includes(r._id));
    return `<div class="box root-card" data-root="${esc(r._id)}"><div class="head"><span class="rid">${esc(r._id)}</span><p>${md(r.text)}</p></div>
      <ul>${acts.map(a => `<li><span class="aid">${esc(a.id)}</span><span class="w">${md(a.what)}</span><span class="chip sm ${ASTATUS[a.status || "open"] || "muted"}">${esc(a.status || "open")}</span></li>`).join("") || "<li>No action yet</li>"}</ul></div>`;
  }).join("");
  return `<section id="whys"><header><h2>Five whys</h2><span class="spacer"></span>${REDUCED ? "" : `<button class="btn" type="button" id="replay-whys">${ICON.replay}Replay</button>`}</header>
    <p class="how">Start at the impact and keep asking why until the answer is something the team can change. <b>Solid</b> edges ask why it happened; <b>dashed</b> edges ask why the impact was as large as it was. Five is a guide: a branch stops at its root cause, sooner or later.</p>
    <div class="box diagram" id="whys-diagram"><pre class="mermaid">${esc(D._mermaid_html || D._mermaid || "")}</pre></div>
    <div class="whys-grid">
      <div class="box tree-box"><div class="kicker" style="padding:0 0 8px 10px">The chain, as text</div><div class="tree"><div class="problem">${md(w.problem)}</div>${whyTree(w.because)}</div></div>
      <div class="roots"><div class="kicker">Root causes and what fixes them</div>${cards}</div>
    </div></section>`;
}

/* ------------------------------------------------------------ the rest */

function summarySection() {
  const im = D.impact || {};
  return `<section id="summary"><header><h2>Summary</h2></header><p class="lead">${md(D.summary)}</p>
    <div class="box impact"><div class="prose" style="display:grid;gap:6px"><div class="kicker">Impact</div><p>${md(im.text)}</p></div>
    ${(im.numbers || []).length ? `<div class="numbers">${im.numbers.map(n => `<div><b>${esc(n.value)}</b><span>${md(n.label)}</span></div>`).join("")}</div>` : ""}</div></section>`;
}

function responseSection() {
  const c = (k, t) => D[k] ? `<div class="box card"><h3>${t}</h3><p>${md(D[k])}</p></div>` : "";
  return `<section id="response"><header><h2>Trigger, detection, resolution</h2></header>
    <div class="cols3">${c("trigger", "Trigger")}${c("detection", "Detection")}${c("resolution", "Resolution")}</div>
    ${(D.contributing || []).length ? `<div style="display:grid;gap:8px"><div class="kicker">Contributing factors</div><ul class="factors">${D.contributing.map(x => `<li>${md(x)}</li>`).join("")}</ul></div>` : ""}</section>`;
}

function lessonsSection() {
  const l = D.lessons || {};
  const col = (k, t) => `<div class="box card c-${k}"><h3><span class="sw"></span>${t}</h3><ul>${(l[k] || []).map(x => `<li>${md(x)}</li>`).join("") || "<li>Nothing recorded.</li>"}</ul></div>`;
  return `<section id="lessons"><header><h2>Lessons learned</h2></header><div class="cols3">${col("well", "What went well")}${col("wrong", "What went wrong")}${col("lucky", "Where we got lucky")}</div></section>`;
}

function actionsSection() {
  const rows = (D.actions || []).map(a => {
    const t = a.ticket || {};
    const ticket = t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.label || "link")}</a>` : esc(t.label || "");
    const st = a.status || "open";
    return `<tr class="${st === "done" ? "done" : ""}"><td class="nowrap"><span class="aid">${esc(a.id)}</span></td><td class="what">${md(a.what)}</td>
      <td><span class="chip sm ${ATYPE[a.type] || "muted"}">${esc(a.type)}</span></td><td data-l="Owner">${esc(a.owner)}</td>
      <td class="nowrap mono num" data-l="Due">${esc(a.due || "")}</td><td><span class="chip sm dot ${ASTATUS[st] || "muted"}">${esc(st)}</span></td>
      <td class="nowrap">${ticket}</td><td class="nowrap">${(a.fixes || []).map(r => `<span class="rid">${esc(r)}</span>`).join(" ")}</td></tr>`;
  }).join("");
  return `<section id="actions"><header><h2>Action items</h2><span class="hint">Every root cause has at least one. Types: prevent, detect, mitigate, process.</span></header>
    <div class="box table"><table><thead><tr><th>ID</th><th>Action</th><th>Type</th><th>Owner</th><th>Due</th><th>Status</th><th>Ticket</th><th>Fixes</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

function peopleSection() {
  const msg = D.messaging || {};
  const block = (k, t) => msg[k] ? `<div class="box card msg"><div class="top"><span class="kicker">${t}</span><button class="btn" type="button" data-copy="${k}">${ICON.copy}Copy</button></div><blockquote>${md(msg[k])}</blockquote></div>` : "";
  if (!(D.responders || []).length && !msg.internal && !msg.external) return "";
  return `<section id="people"><header><h2>Responders and messaging</h2></header><div class="people">
    <div class="box card"><div class="kicker">Responders</div><ul class="responders">${(D.responders || []).map(r => `<li><b>${esc(r.name)}</b><small>${esc(r.role)}</small></li>`).join("")}</ul></div>
    <div style="display:grid;gap:16px">${block("internal", "Internal update")}${block("external", "Customer update")}</div></div></section>`;
}

function linksSection() {
  if (!(D.links || []).length) return "";
  return `<section id="links"><header><h2>Supporting information</h2></header><ul class="links">${D.links.map(x => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)}</a></li>`).join("")}</ul></section>`;
}

/* ------------------------------------------------------------ behaviour */

function toast(text) {
  const t = $("#toast"); t.textContent = text; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 1800);
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch {
    const box = $("#copybox"); box.value = text; box.hidden = false; box.focus(); box.select();
    toast("Press Cmd+C or Ctrl+C, then Esc");
  }
}

// The class runs the animation, then comes off: a finished animation then leaves nothing behind, and
// Chrome repaints mermaid's HTML labels, which it can leave unpainted after an opacity animation.
function replay(el, cls, seconds) {
  clearTimeout(el._replay);
  el.classList.remove(cls);
  void el.getBoundingClientRect();
  el.classList.add(cls);
  el._replay = setTimeout(() => el.classList.remove(cls), seconds * 1000 + 600);
}

function onView(el, fn) {
  if (REDUCED || !el || !("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver(entries => {
    if (entries.some(e => e.isIntersecting)) { io.disconnect(); fn(); }
  }, { threshold: 0.3 });
  io.observe(el);
}

/* mermaid: rendered by the host (artifacts render pre.mermaid natively) or by the script --standalone loads */
const NODE_ID = /flowchart-([A-Za-z0-9]+)-\d+$/;
const EDGE_ID = /L[_-]([A-Za-z0-9]+)[_-]([A-Za-z0-9]+)[_-]\d+$/;
const svgNodes = {};

function themeVars() {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  return { fontFamily: '"Public Sans", system-ui, sans-serif', fontSize: "13.5px", primaryColor: v("--surface"), primaryTextColor: v("--text"),
    primaryBorderColor: v("--line"), lineColor: v("--line"), secondaryColor: v("--subtle"), tertiaryColor: v("--subtle"),
    background: v("--surface"), mainBkg: v("--surface"), edgeLabelBackground: v("--surface") };
}

function decorate(host) {
  const svg = $("svg", host);
  const vb = svg.viewBox?.baseVal;
  if (vb && vb.width) { svg.style.maxWidth = "none"; svg.style.width = Math.round(vb.width) + "px"; }
  const depth = D._depth || {};
  const delay = d => (0.15 + d * 0.55).toFixed(2) + "s";
  for (const g of $$("g.node", svg)) {
    const m = (g.id || "").match(NODE_ID);
    if (!m) continue;
    svgNodes[m[1]] = g;
    g.style.setProperty("--d", delay(depth[m[1]] ?? 0));
  }
  const edgeDepth = id => { const m = (id || "").match(EDGE_ID); return m ? (depth[m[2]] ?? 1) : 1; };
  for (const p of $$("path.flowchart-link, path[data-edge='true']", svg)) {
    if (!p.classList.contains("edge-pattern-dotted")) p.setAttribute("pathLength", "1");
    p.style.setProperty("--d", (0.15 + edgeDepth(p.id || p.dataset.id) * 0.55 - 0.4).toFixed(2) + "s");
  }
  for (const l of $$(".edgeLabel", svg)) {
    const id = l.querySelector("[data-id]")?.dataset.id || l.dataset.id;
    if (/so bad/i.test(l.textContent)) l.classList.add("impact");
    l.style.setProperty("--d", (0.15 + edgeDepth(id) * 0.55 - 0.2).toFixed(2) + "s");
  }
  const grow = () => replay(host, "growing", 0.15 + Math.max(0, ...Object.values(depth)) * 0.55 + 0.5);
  onView(host, grow);
  const btn = $("#replay-whys");
  if (btn) btn.onclick = grow;
  for (const card of $$("[data-root]")) {
    const g = () => svgNodes[card.dataset.root];
    card.onmouseenter = () => g()?.classList.add("hl");
    card.onmouseleave = () => g()?.classList.remove("hl");
  }
}

function fallback(host) {
  host.innerHTML = `<div class="fallback"><p>The diagram did not render here. The chain as text below holds the same tree, and this is its Mermaid source:</p><pre>${esc(D._mermaid || "")}</pre></div>`;
}

const MERMAID_SRC = "https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js";

function renderWhys() {
  const host = $("#whys-diagram");
  if (!host) return;
  const pre = $("pre.mermaid", host);
  let done = false;
  const ready = () => { if (done || !$("svg", host)) return false; done = true; decorate(host); return true; };
  const run = () => {
    if (done || !window.mermaid || !pre?.isConnected || pre.dataset.processed) return;
    try {
      mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "base", themeVariables: themeVars(),
        flowchart: { htmlLabels: true, curve: "basis", nodeSpacing: 22, rankSpacing: 46, wrappingWidth: 210, padding: 12 } });
      mermaid.run({ nodes: [pre] }).then(ready).catch(() => fallback(host));
    } catch { fallback(host); }
  };
  if (ready()) return;
  new MutationObserver((_, mo) => { if (ready()) mo.disconnect(); }).observe(host, { childList: true, subtree: true });
  if (window.mermaid) run();
  // A host that renders pre.mermaid natively has drawn it by now; otherwise load mermaid and draw it here.
  setTimeout(() => {
    if (done || $("svg", host) || window.mermaid) return run();
    const s = document.createElement("script");
    s.src = MERMAID_SRC; s.onload = run; s.onerror = () => fallback(host);
    document.head.appendChild(s);
  }, 1200);
  setTimeout(() => { if (!done && !$("svg", host)) fallback(host); }, 9000);
}

function boot() {
  if (!DATA) { $("#main").innerHTML = "<p>No postmortem data. Build this page with scripts/build.py.</p>"; return; }
  document.title = D.short || D.title || "Postmortem";
  hero();
  $("#main").innerHTML = [summarySection(), timelineSection(), whysSection(), responseSection(), lessonsSection(), actionsSection(), peopleSection(), linksSection()].join("");
  $("#nav").innerHTML = $$("main section").map(s => `<a href="#${s.id}">${esc($("h2", s).textContent.replace("Trigger, detection, resolution", "Response").replace("Responders and messaging", "People").replace("Supporting information", "Links"))}</a>`).join("");

  $("#copy-md").onclick = () => copy(D._markdown || "");
  for (const b of $$("[data-copy]")) b.onclick = () => copy((D.messaging || {})[b.dataset.copy] || "");
  $("#copybox").addEventListener("keydown", e => { if (e.key === "Escape") e.target.hidden = true; });
  $("#copybox").addEventListener("blur", e => { e.target.hidden = true; });

  const tl = $("#tl-svg");
  const play = () => replay(tl, "playing", TOTAL + 1.2);
  onView(tl, play);
  const rb = $("#replay-tl");
  if (rb) rb.onclick = play;
  renderWhys();
}
boot();
</script>

</body></html>
