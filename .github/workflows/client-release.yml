name: Client Release

# This workflow triggers on commits to main that modify the OpenAPI spec or client code.
# It does NOT trigger on tag pushes. Documentation-only changes are excluded.
on:
  push:
    branches:
      - main
    paths:
      - "apps/anchor/cmd/http/openapi.yaml"
      - "clients/go/**"
      - "!clients/go/README.md"
      - "!clients/go/**/*.md"

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest client tag
        id: latest_tag
        run: |
          LATEST=$(git tag -l "clients/go/v*" | sort -V | tail -n1)
          if [ -z "$LATEST" ]; then
            LATEST="clients/go/v0.1.0"
          fi
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

      - name: Bump patch version
        id: bump
        run: |
          CURRENT="${{ steps.latest_tag.outputs.latest }}"
          VERSION=$(echo $CURRENT | sed 's/clients\/go\/v//')
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)

          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="clients/go/v${MAJOR}.${MINOR}.${NEW_PATCH}"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.bump.outputs.new_version }}
          git push origin ${{ steps.bump.outputs.new_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.bump.outputs.new_version }}
          name: Anchor Client ${{ steps.bump.outputs.new_version }}
          body: |
            Auto-generated Anchor Go client release.

            ## Installation
            ```bash
            go get github.com/nanostack-dev/anchor/clients/go@${{ steps.bump.outputs.new_version }}
            ```
          draft: false
          prerelease: false
