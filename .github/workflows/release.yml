name: Release

on:
  workflow_run:
    workflows:
      - Go Build and Test
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      sha:
        description: Main branch commit SHA to deploy (defaults to current main)
        required: false
        type: string
      image_tag:
        description: Override the container tag to deploy (defaults to the tag published by the triggering build)
        required: false
        type: string

jobs:
  prepare:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      image_tag: ${{ steps.resolve_image.outputs.resolved_image_tag }}
      enforce_latest_main: ${{ steps.resolve_image.outputs.enforce_latest_main }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve Deployment Image
        id: resolve_image
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          requested_image_tag='${{ inputs.image_tag }}'
          resolved_image_tag=''
          metadata_run_id=''

          if [[ "$GITHUB_EVENT_NAME" == 'workflow_run' ]]; then
            lookup_sha='${{ github.event.workflow_run.head_sha }}'
            enforce_latest_main='true'
            metadata_run_id='${{ github.event.workflow_run.id }}'
          else
            git fetch origin main --depth=1
            lookup_sha='${{ inputs.sha }}'
            if [[ -z "$lookup_sha" ]]; then
              lookup_sha="$(git rev-parse origin/main)"
            fi
            if ! git cat-file -e "${lookup_sha}^{commit}" 2>/dev/null; then
              echo "Provided SHA '$lookup_sha' is not a valid commit" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$lookup_sha" origin/main; then
              echo "Provided SHA '$lookup_sha' is not reachable from origin/main" >&2
              exit 1
            fi
            enforce_latest_main='false'
          fi

          if [[ -n "$requested_image_tag" ]]; then
            resolved_image_tag="$requested_image_tag"
          else
            if [[ -z "$metadata_run_id" ]]; then
              metadata_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/go.yml/runs?head_sha=${lookup_sha}&status=completed&branch=main&per_page=20" --jq '.workflow_runs[] | select(.conclusion == "success") | .id' | sed -n '1p')"
            fi

            if [[ -z "$metadata_run_id" ]]; then
              echo "No successful Go Build and Test run was found for ${lookup_sha}. Build and publish the container first, or provide image_tag." >&2
              exit 1
            fi

            rm -rf .deploy-metadata
            mkdir -p .deploy-metadata
            if ! gh run download "$metadata_run_id" --repo "$GITHUB_REPOSITORY" -n deploy-metadata -D .deploy-metadata; then
              echo "No deploy-metadata artifact was found for build run ${metadata_run_id}. Build and publish the container first, or provide image_tag." >&2
              exit 1
            fi

            resolved_image_tag="$(sed -n 's/^image_tag=//p' .deploy-metadata/deploy-metadata.env | sed -n '1p')"
            if [[ -z "$resolved_image_tag" ]]; then
              echo "deploy-metadata artifact from run ${metadata_run_id} did not contain image_tag." >&2
              exit 1
            fi
          fi

          echo "lookup_sha=$lookup_sha" >> "$GITHUB_OUTPUT"
          echo "resolved_image_tag=$resolved_image_tag" >> "$GITHUB_OUTPUT"
          echo "enforce_latest_main=$enforce_latest_main" >> "$GITHUB_OUTPUT"

  deploy_dev:
    needs: prepare
    if: |
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
      image_tag: ${{ needs.prepare.outputs.image_tag }}
      enforce_latest_main: ${{ needs.prepare.outputs.enforce_latest_main == 'true' }}
    secrets: inherit

  deploy_frontend_dev:
    needs: prepare
    if: |
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: anchor-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd anchor-ui
          pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://anchorapidev.nanostack.dev
          VITE_ENVIRONMENT: development
        run: |
          cd anchor-ui
          pnpm vite build

      - name: Deploy to Workers (dev)
        uses: cloudflare/wrangler-action@v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: anchor-ui
          command: deploy --env dev

  deploy_prod:
    needs: [prepare, deploy_dev]
    if: |
      always() && (
        (github.event_name == 'workflow_run' && needs.deploy_dev.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' && needs.prepare.result == 'success')
      )
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
      image_tag: ${{ needs.prepare.outputs.image_tag }}
      enforce_latest_main: ${{ needs.prepare.outputs.enforce_latest_main == 'true' }}
    secrets: inherit

  deploy_frontend_prod:
    needs: [prepare, deploy_frontend_dev]
    if: |
      always() && (
        (github.event_name == 'workflow_run' && needs.deploy_frontend_dev.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' && needs.prepare.result == 'success')
      )
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: anchor-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd anchor-ui
          pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://anchorapi.nanostack.dev
          VITE_ENVIRONMENT: production
        run: |
          cd anchor-ui
          pnpm vite build

      - name: Deploy to Workers (production)
        uses: cloudflare/wrangler-action@v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: anchor-ui
          command: deploy --env production
