name: Go Build and Test

on:
  push:
    branches: [ main ]
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'Dockerfile'
      - 'apps/anchor/migrations/**'
      - 'apps/anchor/application.yaml'
      - 'apps/anchor/**/application.yaml'
      - 'apps/anchor/*codegen*.yaml'
      - '.golangci.yml'
      - 'anchor-ui/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/anchor/cmd/http/openapi.yaml'
      - '.github/workflows/go.yml'
  # No `paths:` filter on pull_request, on purpose: a filter that matches nothing
  # starts no run and so creates no ci-ok check, which would block a docs-only PR
  # forever once ci-ok is required. detect_changes is the only gate here.
  # Parent branches of stacked PRs need the same required ci-ok checks.
  # Preview dispatch remains restricted to PRs whose base is main.
  pull_request:
  workflow_dispatch:

# One run per PR. Superseded runs are cancelled rather than left to finish: 4 of
# 46 PR runs sampled on 2026-08-18 kept burning a runner after a newer push had
# already started.
#
# Pushes to main share one group and run one at a time, in merge order, so their
# deploys reach the infra Deploy Router in merge order. queue: max keeps every
# waiting run; the default keeps only the newest and cancels the rest. Without
# the queue, the build that finished first deployed first: on 2026-10-01 anchor
# da83546 deployed after its child b38937a and dev served code that was not main.
#
# Anything else (workflow_dispatch) groups on run_id and never waits.
# GITHUB_TOKEN starts with nothing. Every job states what it needs, so a new job
# cannot quietly inherit repo-wide write access. Recommended by GitHub's secure-use
# reference, and the blast-radius limiter in the tj-actions/changed-files
# compromise, where a moved tag dumped runner memory into public build logs.
permissions: {}

concurrency:
  group: go-${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

jobs:
  detect_changes:
    uses: nanostack-dev/ci-workflows/.github/workflows/detect-changes.yml@main
    permissions:
      contents: read
    with:
      # Backend and frontend are two surfaces. go-build-test is gated on the
      # backend surface for pull requests only. On a push to main it always runs,
      # because infra's anchor-deploy.yml runs its wrangler frontend deploy
      # downstream of backend, so skipping the backend track on a frontend-only
      # push would also skip the deploy dispatch and the frontend never ships.
      # Gating that needs a separate frontend deploy event first, the way
      # echopoint has one.
      #
      # Keep backend_patterns and frontend_patterns in step with the `push`
      # `paths:` filter above: together they are the whole list, and the one that
      # disagrees loses silently.
      backend_patterns: |
        **.go
        **/go.mod
        **/go.sum
        Dockerfile
        apps/anchor/migrations/**
        apps/anchor/application.yaml
        apps/anchor/**/application.yaml
        apps/anchor/*codegen*.yaml
        .golangci.yml
        apps/anchor/cmd/http/openapi.yaml
        .github/workflows/go.yml
      frontend_patterns: |
        anchor-ui/**
        pnpm-lock.yaml
        pnpm-workspace.yaml
        apps/anchor/cmd/http/openapi.yaml
        .github/workflows/go.yml

  frontend-verify:
    needs: detect_changes
    if: needs.detect_changes.outputs.frontend_changed == 'true'
    uses: nanostack-dev/ci-workflows/.github/workflows/frontend-verify.yml@main
    permissions:
      contents: read
    with:
      app_name: Anchor
      working_directory: anchor-ui
      # The workspace root lockfile, which is the one pnpm actually reads: the
      # root pnpm-workspace.yaml makes anchor-ui a package, so `pnpm install` in
      # anchor-ui resolves upward. anchor-ui/pnpm-lock.yaml was a pre-workspace
      # leftover that never changed again, which froze this cache key at one
      # value for the repo's whole life and redownloaded 14-81 packages a run.
      cache_dependency_path: pnpm-lock.yaml
      pnpm_version: '11.1.0'
      # anchor-ui/src/client is generated from the backend spec and committed, so
      # a spec change could merge against a stale client with CI green.
      # Regenerating and diffing closes that, and running before typecheck means
      # a spec change that breaks a caller fails on the type error.
      generate_command: pnpm openapi-ts
      verify_generated_path: anchor-ui/src/client
      lint_command: pnpm check
      typecheck_command: pnpm typecheck
      test_command: pnpm test
      build_command: pnpm build
      # Story tests run on every PR; real dev login smoke is a separate manual
      # workflow so normal PR verification does not require dev credentials.
      storybook_test_command: pnpm test-storybook
      # The production Storybook build is push-only. Story tests already exercise
      # the stories through Vite in dev mode, so this only adds coverage of
      # production bundling and autodocs generation — the way a Storybook or
      # addon upgrade breaks. Running it on push catches that within one merge at
      # a fraction of the minutes. Same split echopoint uses.
      #
      # Phrased as "not a PR" rather than "is a push" so a manual
      # workflow_dispatch — when you most want full verification — also runs it.
      storybook_build_command: ${{ github.event_name != 'pull_request' && 'pnpm build-storybook' || '' }}
      build_env: |
        VITE_API_BASE_URL=https://apidev.tryanchor.dev

  go-build-test:
    # Backend build/test has no dependency on the frontend — run it in parallel
    # with frontend-verify rather than after it. Gating them in series meant a
    # flaky Storybook/Playwright step skipped the backend build, and with it the
    # deploy dispatch, silently leaving prod behind. The dispatch jobs below
    # still read frontend-verify's result; go-build-test success is the gate.
    needs: [detect_changes, preview-flag]
    # A pull request builds when it touches the backend, or when its author asked
    # for a preview of a frontend change: the preview deploys this job's image.
    # Every other event builds unconditionally, so a push to main keeps its
    # deploy dispatch. !cancelled() because preview-flag is skipped off pull
    # requests and a skipped need would otherwise skip this job too.
    if: |
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.detect_changes.outputs.backend_changed == 'true' ||
        (needs.preview-flag.outputs.enabled == 'true' && needs.detect_changes.outputs.frontend_changed == 'true')
      )
    uses: nanostack-dev/ci-workflows/.github/workflows/go-build-test.yml@main
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      app_name: anchor
      # 1.27.0 matches the toolchain go.mod pins. It is not in the
      # actions/go-versions manifest yet, but setup-go falls back to the
      # official Go distribution site when the manifest misses.
      #
      # It cannot stay on 1.26.5 and rely on the toolchain directive: setup-go
      # exports GOTOOLCHAIN=local, so Go refuses to fetch a newer toolchain and
      # fails with "go.mod requires go >= 1.27 (running go 1.26.5)".
      go_version: '1.27.0'
      cache_dependency_path: apps/anchor/go.sum
      download_dependencies_dir: apps/anchor
      lint_working_directory: ./apps/anchor
      lint_args: --timeout 5m --path-mode=abs
      lint_skip_cache: true
      lint_skip_save_cache: true
      test_suites_json: >-
        [{"name":"Component Tests","working_directory":"./apps/anchor/cmd/it/ct","command":"gotestsum --format github-actions -- ./..."},{"name":"Service Tests","working_directory":"./apps/anchor/cmd/it/service","command":"gotestsum --format github-actions -- ./..."},{"name":"Unit Tests","working_directory":"./apps/anchor/internal","command":"gotestsum --format github-actions -- ./..."}]
      image_repository: ghcr.io/${{ github.repository_owner }}/anchor
      image_title: anchor
      image_description: Multi-tenant service platform
      docker_context: .
      dockerfile_path: ./Dockerfile
      build_platforms: linux/amd64,linux/arm64
      sha_tag_format: short
      publish_image: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  # One status summarizing the run. A context that lives under a skipped job
  # never materializes, so reading "frontend-verify / ..." directly would say
  # nothing on a backend-only PR. This passes when each verification job either
  # succeeded or was legitimately skipped, and fails if any failed or was
  # cancelled.
  #
  # Safe as a *required* check. pull_request has no `paths:` filter, so every PR
  # starts a run and creates this check, and detect_changes decides
  # which verification jobs a PR needs. A docs-only PR runs detect_changes and
  # this job only; the others are skipped, which counts as passing here.
  ci-ok:
    name: ci-ok
    needs: [detect_changes, frontend-verify, go-build-test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Two pull requests that each add a migration pick the next free number in
      # isolation, so both can claim it and both can merge green. golang-migrate
      # then refuses the whole source and every integration suite fails at setup.
      # Catch the collision on the pull request, where the fix is a rename.
      - uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: apps/anchor/migrations
      - name: Reject duplicate migration versions
        shell: bash
        run: |
          set -euo pipefail
          duplicates=$(
            find apps/anchor/migrations -type f -name '*.sql' -exec basename {} \; \
              | sed -nE 's/^([0-9]{6})_(.*)\.(up|down)\.sql$/\1 \2/p' \
              | sort -u \
              | awk '{ print $1 }' \
              | uniq -d
          )
          if [ -n "$duplicates" ]; then
            echo "Two migrations share a version number:"
            printf '%s\n' "$duplicates" | while read -r version; do
              find apps/anchor/migrations -type f -name "${version}_*" -exec basename {} \;
            done
            echo "Renumber the one that merged last, then rerun."
            exit 1
          fi
          echo "No duplicate migration version."
      - name: Verify required jobs
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect_changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend-verify.result }}
          GO_RESULT: ${{ needs.go-build-test.result }}
        run: |
          set -euo pipefail
          echo "detect_changes=$DETECT_RESULT frontend-verify=$FRONTEND_RESULT go-build-test=$GO_RESULT"
          for result in "$DETECT_RESULT" "$FRONTEND_RESULT" "$GO_RESULT"; do
            [[ "$result" == 'success' || "$result" == 'skipped' ]] || exit 1
          done

  dispatch-deploy-dev:
    needs: [frontend-verify, go-build-test]
    # always() so a failed or skipped frontend-verify does not skip the backend
    # deploy dispatch; go-build-test success is the real gate.
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.go-build-test.result == 'success'
    uses: nanostack-dev/ci-workflows/.github/workflows/dispatch-deploy-event.yml@main
    permissions:
      contents: read
    with:
      deploy_repository: nanostack-dev/infra
      event_type: deploy-service
      payload: >-
        {"service":"anchor","environment":"dev","promote_to_prod":true,"source_repository":"${{ github.repository }}","source_ref":"${{ github.sha }}","image_repository":"ghcr.io/${{ github.repository_owner }}/anchor","image_tag":"${{ needs.go-build-test.outputs.deploy_image_tag }}","git_sha":"${{ github.sha }}"}
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

  # The preview checkbox in .github/pull_request_template.md is read here, from
  # the API, never from github.event.pull_request.body. The event payload is a
  # snapshot: a re-run replays the description the run started with, so a
  # checkbox selected after the build would stay invisible. The API answers with
  # the description as it is now, which is also what lets preview-toggle.yml
  # raise a preview with a plain re-run.
  preview-flag:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      enabled: ${{ steps.flag.outputs.enabled }}
    steps:
      - name: Read the preview checkbox
        id: flag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          body="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""')"
          # The HTML comment is the anchor, not the label. The author can
          # rewrite the wording of the line and the match still holds.
          marker='-[[:space:]]*\[[xX]\].*<!--[[:space:]]*preview-deploy[[:space:]]*-->'
          if printf '%s\n' "$body" | grep -qE -e "$marker"; then
            enabled=true
          else
            enabled=false
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          {
            echo '## Preview environment'
            echo
            echo "- Checkbox selected: $enabled"
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch-preview-upsert:
    needs: [frontend-verify, go-build-test, preview-flag]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      needs.preview-flag.outputs.enabled == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.go-build-test.result == 'success' &&
      needs.frontend-verify.result != 'failure'
    uses: nanostack-dev/ci-workflows/.github/workflows/dispatch-deploy-event.yml@main
    permissions:
      contents: read
    with:
      deploy_repository: nanostack-dev/infra
      event_type: preview-upsert
      payload: >-
        {"service":"anchor","source_repository":"${{ github.repository }}","source_ref":"${{ github.event.pull_request.head.sha }}","image_repository":"ghcr.io/${{ github.repository_owner }}/anchor","image_tag":"${{ needs.go-build-test.outputs.deploy_image_tag }}","pr_number":${{ github.event.pull_request.number }},"branch_ref":"${{ github.event.pull_request.head.ref }}","git_sha":"${{ github.event.pull_request.head.sha }}"}
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
