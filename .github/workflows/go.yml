name: Go Build and Test

on:
  push:
    branches: [ main ]
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'Dockerfile'
      - 'apps/anchor/migrations/**'
      - 'apps/anchor/**/nanogen.sum'
      - 'apps/anchor/application.yaml'
      - 'apps/anchor/**/application.yaml'
      - 'apps/anchor/*codegen*.yaml'
      - '.golangci.yml'
      - 'scripts/lint.sh'
      - 'scripts/test_lint.py'
      - 'scripts/go-test-part.sh'
      - 'scripts/go-test-times.txt'
      - '.github/actions/install-go/**'
      - 'scripts/check-generated.sh'
      - 'scripts/date-by-content.py'
      - 'scripts/build-anchor.sh'
      - '.dockerignore'
      - '.github/actions/build-image/**'
      - 'lint-fix.sh'
      - 'anchor-ui/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/anchor/cmd/http/openapi.yaml'
      - '.github/workflows/go.yml'
      - '.dagger/**'
      - 'dagger.toml'
      - 'dagger.lock'
      - 'scripts/ci/**'
  # No `paths:` filter on pull_request, on purpose: a filter that matches nothing
  # starts no run and so creates no ci-ok check, which would block a docs-only PR
  # forever once ci-ok is required. detect_changes is the only gate here.
  # Parent branches of stacked PRs need the same required ci-ok checks.
  # Preview dispatch remains restricted to PRs whose base is main.
  pull_request:
  workflow_dispatch:

# One run per PR. Superseded runs are cancelled rather than left to finish: 4 of
# 46 PR runs sampled on 2026-08-18 kept burning a runner after a newer push had
# already started.
#
# Pushes to main share one group and run one at a time, in merge order, so their
# deploys reach the infra Deploy Router in merge order. queue: max keeps every
# waiting run; the default keeps only the newest and cancels the rest. Without
# the queue, the build that finished first deployed first: on 2026-10-01 anchor
# da83546 deployed after its child b38937a and dev served code that was not main.
#
# Anything else (workflow_dispatch) groups on run_id and never waits.
# GITHUB_TOKEN starts with nothing. Every job states what it needs, so a new job
# cannot quietly inherit repo-wide write access. Recommended by GitHub's secure-use
# reference, and the blast-radius limiter in the tj-actions/changed-files
# compromise, where a moved tag dumped runner memory into public build logs.
permissions: {}

concurrency:
  group: go-${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

jobs:
  detect_changes:
    uses: nanostack-dev/ci-workflows/.github/workflows/detect-changes.yml@main
    permissions:
      contents: read
    with:
      # Backend and frontend are two surfaces. publish is gated on the
      # backend surface for pull requests only. On a push to main it always runs,
      # because infra's anchor-deploy.yml runs its wrangler frontend deploy
      # downstream of backend, so skipping the backend track on a frontend-only
      # push would also skip the deploy dispatch and the frontend never ships.
      # Gating that needs a separate frontend deploy event first, the way
      # echopoint has one.
      #
      # Keep backend_patterns and frontend_patterns in step with the `push`
      # `paths:` filter above: together they are the whole list, and the one that
      # disagrees loses silently.
      backend_patterns: |
        **.go
        **/go.mod
        **/go.sum
        Dockerfile
        apps/anchor/migrations/**
        apps/anchor/**/nanogen.sum
        apps/anchor/application.yaml
        apps/anchor/**/application.yaml
        apps/anchor/*codegen*.yaml
        .golangci.yml
        scripts/lint.sh
        scripts/test_lint.py
        scripts/go-test-part.sh
        scripts/go-test-times.txt
        .github/actions/install-go/**
        scripts/check-generated.sh
        scripts/date-by-content.py
        scripts/build-anchor.sh
        .dockerignore
        .github/actions/build-image/**
        lint-fix.sh
        apps/anchor/cmd/http/openapi.yaml
        .github/workflows/go.yml
        .dagger/**
        dagger.toml
        dagger.lock
        scripts/ci/**
      frontend_patterns: |
        anchor-ui/**
        pnpm-lock.yaml
        pnpm-workspace.yaml
        apps/anchor/cmd/http/openapi.yaml
        .github/workflows/go.yml

  # The frontend checks, natively, in parallel parts that keep pnpm's store
  # and Playwright's browser between runs: a cold Dagger engine took 136-145 s,
  # Storybook alone 2 min. The same checks run in Dagger for `dagger check`
  # on a laptop. A job of its own, so a flaky Storybook or Playwright step
  # never holds the backend deploy.
  frontend:
    name: frontend (${{ matrix.part }})
    # A pull request that changes no frontend file skips these jobs (ci-ok
    # accepts skipped): on a Go-only change the Storybook shards were the
    # slowest jobs of the run (51-69 s, 2026-11-12). A push to main runs them
    # all, because the deploy dispatch follows this job.
    needs: detect_changes
    if: github.event_name != 'pull_request' || needs.detect_changes.outputs.frontend_changed == 'true'
    # Playwright 1.60 cannot install Chromium's system deps on Ubuntu 26.04
    # (ubuntu-latest), as in e2e-app.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: lint, types and API client
            run: pnpm check && pnpm typecheck && pnpm openapi-ts && git diff --exit-code -- src/client
          - part: unit tests and build
            run: pnpm test && pnpm build
          # Four shards: two took 69-108 s each, three 67-81 s (2026-11-11). Six
          # gave no gain (53-65 s jobs, 2026-11-12): each spends ~25 s on setup.
          - part: storybook 1/4
            run: pnpm test-storybook --shard=1/4
            browser: true
          - part: storybook 2/4
            run: pnpm test-storybook --shard=2/4
            browser: true
          - part: storybook 3/4
            run: pnpm test-storybook --shard=3/4
            browser: true
          - part: storybook 4/4
            run: pnpm test-storybook --shard=4/4
            browser: true
    defaults:
      run:
        working-directory: anchor-ui
    env:
      CI: 'true'
      VITE_API_BASE_URL: https://apidev.tryanchor.dev
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          version: 11.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The browser download is cached per Playwright version. Its system
      # libraries are on the runner image already (it ships Chrome); apt runs
      # only when one is missing (14 s otherwise).
      - if: matrix.browser
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - if: matrix.browser
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: matrix.browser && steps.browser.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - if: matrix.browser
        run: |
          shopt -s nullglob
          shell=(~/.cache/ms-playwright/chromium_headless_shell-*/*/chrome-headless-shell)
          if [[ ${#shell[@]} -eq 0 ]] || ldd "${shell[0]}" | grep 'not found'; then
            pnpm exec playwright install-deps chromium
          fi
      - name: Run ${{ matrix.part }}
        env:
          RUN: ${{ matrix.run }}
        run: bash -c "$RUN"

  # The backend checks, spread over parallel runners (one Go suite, the lint,
  # the generated code or the image build per runner). On one 4 vCPU runner
  # they took 12 min (2026-11-11). Hosted runners are free for this public
  # repository, so each group gets its own, and each keeps its caches between
  # runs (below): a hosted runner starts empty. needs.backend is the result of
  # every group.
  backend:
    name: backend (${{ matrix.group }})
    # Arm runners (free for public repositories) compile faster than the x64
    # ones: after a change to a package 26 others import, component parts
    # 86-104 s against 84-122 s, lint 55 s against 83 s, the run 114 s
    # against 131 s (2026-11-12). image-builds builds the amd64 image, so it
    # stays on x64.
    runs-on: ${{ matrix.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lint and the Go tests run natively, as on a laptop, so they keep
          # Go's build and test caches and golangci-lint's cache between runs
          # (each group its own cache, below). In Dagger every hosted run was
          # cold: lint 225-282 s (2 s warm), each test group 205-268 s.
          # scripts/lint.sh and scripts/go-test-part.sh are what the Dagger
          # checks run too, for `dagger check` on a laptop.
          - group: lint
            native: scripts/lint.sh backend
          # The component suite is the longest: sixteen parts, a runner each.
          # Parts are balanced by the tests' measured CI times
          # (scripts/go-test-times.txt, GO_TEST_TIMES below): at most 85 s of
          # test work each (twelve parts held 100 s and ran 58-71 s jobs),
          # where eight parts by laptop times ran 26-48 s of tests after a
          # 24 s compile. More parts shorten only the test time:
          # each part compiles the same test binary.
          # -parallel 8 (GO_TEST_FLAGS below): the tests mostly wait on the
          # database, and Go's default of one per CPU left a part at 45 s
          # where 16 took 32 s (part 4 of 5 on a laptop, 2026-11-11).
          - group: component-tests-a
            native: scripts/go-test-part.sh apps/anchor/cmd/it/ct 0 16
            containers: true
          - group: component-tests-b
            native: scripts/go-test-part.sh apps/anchor/cmd/it/ct 1 16
            containers: true
          - group: component-tests-c
            native: scripts/go-test-part.sh apps/anchor/cmd/it/ct 2 16
            containers: true
          - group: component-tests-d
            native: scripts/go-test-part.sh apps/anchor/cmd/it/ct 3 16
            containers: true
          - group: component-tests-e
            native: scripts/go-test-part.sh apps/anchor/cmd/it/ct 4 16
            containers: true
          - group: component-tests-f
            native: scripts/go-test-part.sh apps/anchor/cmd/it/ct 5 16
            containers: true
          - group: component-tests-g
            native: scripts/go-test-part.sh apps/anchor/cmd/it/ct 6 16
            containers: true
          - group: component-tests-h
            native: scripts/go-test-part.sh apps/anchor/cmd/it/ct 7 16
            containers: true
          - group: component-tests-i
            native: scripts/go-test-part.sh apps/anchor/cmd/it/ct 8 16
            containers: true
          - group: component-tests-j
            native: scripts/go-test-part.sh apps/anchor/cmd/it/ct 9 16
            containers: true
          - group: component-tests-k
            native: scripts/go-test-part.sh apps/anchor/cmd/it/ct 10 16
            containers: true
          - group: component-tests-l
            native: scripts/go-test-part.sh apps/anchor/cmd/it/ct 11 16
            containers: true
          - group: component-tests-m
            native: scripts/go-test-part.sh apps/anchor/cmd/it/ct 12 16
            containers: true
          - group: component-tests-n
            native: scripts/go-test-part.sh apps/anchor/cmd/it/ct 13 16
            containers: true
          - group: component-tests-o
            native: scripts/go-test-part.sh apps/anchor/cmd/it/ct 14 16
            containers: true
          - group: component-tests-p
            native: scripts/go-test-part.sh apps/anchor/cmd/it/ct 15 16
            containers: true
          # The service suite in two parts, balanced like the component parts:
          # 30 s of tests in one.
          - group: service-tests-a
            native: scripts/go-test-part.sh apps/anchor/cmd/it/service 0 2
            containers: true
          - group: service-tests-b
            native: scripts/go-test-part.sh apps/anchor/cmd/it/service 1 2
            containers: true
          - group: unit-and-wiring-tests
            native: cd apps/anchor && go run gotest.tools/gotestsum@v1.13.0 --format pkgname-and-test-fails ./internal/... ./cmd/app/...
          # The generated-code and lint-tooling Dagger checks, natively: a
          # fresh database, `nanostack gen -check`, and the lint script tests.
          - group: generated-code
            native: scripts/check-generated.sh && python3 scripts/test_lint.py
          # The Dockerfile's build from source. publish packages a binary it
          # built natively, so this leg checks the builder stage: for pull
          # requests from forks (no publish), and when a file only that stage
          # reads changed (below).
          - group: image-builds
            image: true
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The suite's Postgres and Redis start while Go compiles, and the
      # suite uses them (ANCHOR_IT_*_ADDR, cmd/it/shared/test_setup.go): it
      # took 5 s to start its own after a 22 s compile. Mailpit's image is
      # pulled for the tests that start it. Keep the images and settings equal
      # to test_setup.go and the Mailpit helper.
      - if: matrix.containers
        name: Start the test containers in the background
        run: |
          nohup docker run -d --name anchor-it-postgres -p 127.0.0.1:55432:5432 \
            -e POSTGRES_DB=anchor -e POSTGRES_USER=anchor -e POSTGRES_PASSWORD=anchor -e NO_TS_TUNE=true \
            timescale/timescaledb:2.23.0-pg18 > /dev/null 2>&1 &
          nohup docker run -d --name anchor-it-redis -p 127.0.0.1:56379:6379 redis:7-alpine > /dev/null 2>&1 &
          nohup docker pull -q axllent/mailpit:v1.20 > /dev/null 2>&1 &
          echo "ANCHOR_IT_POSTGRES_ADDR=127.0.0.1:55432" >> "$GITHUB_ENV"
          echo "ANCHOR_IT_REDIS_ADDR=127.0.0.1:56379" >> "$GITHUB_ENV"
      - if: matrix.native
        uses: ./.github/actions/install-go
      # One cache per group: a shared key keeps whichever group saved first.
      # Go's caches key on file contents, so a restored cache rebuilds and
      # re-runs only what changed. main saves under its commit; a pull request
      # restores the newest and saves only when there was none (each save
      # costs about 12 s and the repository has 10 GB of cache).
      - if: matrix.native
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: anchor-${{ matrix.group }}-${{ runner.os }}-${{ runner.arch }}-nol-${{ hashFiles('apps/anchor/go.sum', 'apps/anchor/tools/golangci-lint/go.sum') }}-${{ github.sha }}
          restore-keys: |
            anchor-${{ matrix.group }}-${{ runner.os }}-${{ runner.arch }}-nol-${{ hashFiles('apps/anchor/go.sum', 'apps/anchor/tools/golangci-lint/go.sum') }}-
            anchor-${{ matrix.group }}-${{ runner.os }}-${{ runner.arch }}-nol-
      # Go's test cache knows a file a test opens (the migrations, the OpenAPI
      # spec) by size and modification time, and a checkout gives every file a
      # new time: those results never came from the cache. The time now comes
      # from the file's git blob hash, so it changes exactly when the content
      # does.
      - if: matrix.native
        name: Date each file by its content
        run: python3 scripts/date-by-content.py
      # Go moves an entry's time to now when it uses one older than an hour,
      # so the entries still dated 2000 at the end went unused (Trim the cache).
      - if: matrix.native && (github.ref == 'refs/heads/main' || steps.cache.outputs.cache-matched-key == '')
        name: Date the build cache as unused
        run: find ~/.cache/go-build -type f -name '*-[ad]' -exec touch -d @946684800 {} + 2> /dev/null || true
      - if: matrix.native
        name: Run ${{ matrix.group }}
        env:
          CGO_ENABLED: '0'
          GO_TEST_FLAGS: -parallel 8
          # Everything builds without optimizations. After a change to a
          # package 26 others import: the tests compiled about 27 % faster
          # (laptop) and ran no slower (they wait on the database); lint's
          # export data loading went 44 -> 27 s; and the go/packages loads in
          # cmd/app's generated-files test and check-generated.sh no longer
          # compile optimized copies (cmd/app took 29.5 s, 2.3 s on a laptop).
          # As GOFLAGS, it reaches every go command a job runs. GOFLAGS splits
          # on spaces, so the pair is quoted.
          GOFLAGS: "'-gcflags=all=-N -l'"
          GO_TEST_TIMES: scripts/go-test-times.txt
          RUN: ${{ matrix.native }}
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          mkdir -p ~/.cache/golangci-lint
          rc=0
          bash -c "$RUN" || rc=$?
          if [[ $rc != 0 ]] && compgen -G "$RUNNER_TEMP/anchor-lint.*/lint.log" > /dev/null; then
            cat "$RUNNER_TEMP"/anchor-lint.*/lint.log
          fi
          exit "$rc"
      # Go builds from the extracted modules, so the module zips (about 175 of
      # a cache's 490 MB) stay out. A `!` pattern in the cache paths left them
      # in (2026-11-12).
      - if: matrix.native && (github.ref == 'refs/heads/main' || steps.cache.outputs.cache-matched-key == '')
        name: Trim the cache
        run: |
          find ~/go/pkg/mod/cache/download -name '*.zip' -delete
          # The build cache keeps what this run used (below), not what every
          # commit of the last five days built.
          find ~/.cache/go-build -type f -name '*-[ad]' ! -newermt @946684801 -delete 2> /dev/null || true
      - if: matrix.native && (github.ref == 'refs/heads/main' || steps.cache.outputs.cache-matched-key == '')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - if: matrix.image
        id: image
        name: Decide whether to build from source
        env:
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository && github.event_name == 'pull_request' }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          build=true
          if [[ $FORK != true && -n $BASE && $BASE != 0000000000000000000000000000000000000000 ]] &&
            git fetch -q --depth=1 origin "$BASE"; then
            # The inputs of the builder stage that the native build does not share.
            if ! git diff --name-only "$BASE" HEAD -- Dockerfile .dockerignore \
              scripts/build-anchor.sh apps/anchor/go.mod apps/anchor/go.sum clients/go/go.mod | grep -q .; then
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - if: steps.image.outputs.build == 'true'
        uses: ./.github/actions/build-image

  # Pushes the image while the checks run, as go-build-test did. The deploy and
  # preview dispatches gate on backend. A pull request builds when it
  # touches the backend, or when its author asked for a preview of a frontend
  # change. !cancelled() because preview-flag is skipped off pull requests.
  publish:
    name: publish
    needs: [detect_changes, preview-flag]
    if: |
      !cancelled() && (
        github.event_name != 'pull_request' ||
        needs.detect_changes.outputs.backend_changed == 'true' ||
        (needs.preview-flag.outputs.enabled == 'true' && needs.detect_changes.outputs.frontend_changed == 'true')
      ) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      deploy_image_tag: ${{ steps.publish.outputs.deploy_image_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        id: publish
        env:
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/anchor
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          # The tags docker/metadata-action gave: the branch or pr-N, sha-<7>,
          # and latest on the default branch.
          short="sha-${GITHUB_SHA:0:7}"
          if [ "$EVENT_NAME" = pull_request ]; then
            tags="pr-${PR_NUMBER},${short}"; version="pr-${PR_NUMBER}"
          else
            ref_tag="$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-')"
            tags="${ref_tag},${short}"; version="$ref_tag"
            [ "$REF_NAME" = "$DEFAULT_BRANCH" ] && tags="${tags},latest"
          fi
          {
            echo "version=${version}"
            echo "refs<<EOF"
            tr ',' '\n' <<< "$tags" | sed "s#^#${REPOSITORY}:#"
            echo "EOF"
            echo "deploy_image_tag=${short}"
          } >> "$GITHUB_OUTPUT"
      # The binary is built natively, with Go's caches restored as in the
      # backend jobs, and the image only packages it (the Dockerfile's binary
      # stage, replaced). Inside Buildx the same build waited 27 s for its
      # cache to be copied in and 12 s for the modules (2026-11-11); the
      # Dagger publish took 125-162 s from a cold engine.
      - uses: ./.github/actions/install-go
      - name: Check the Dockerfile builds with the same Go
        run: |
          docker_go=$(sed -nE 's/^FROM .*golang:([0-9.]+)-alpine.*/\1/p' Dockerfile)
          mod_go=$(sed -nE 's/^toolchain go([0-9.]+)$/\1/p' apps/anchor/go.mod)
          if [[ $docker_go != "$mod_go" ]]; then
            echo "::error::The Dockerfile builds with Go $docker_go, apps/anchor/go.mod pins $mod_go"
            exit 1
          fi
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: anchor-publish-${{ runner.os }}-${{ hashFiles('apps/anchor/go.sum') }}-${{ github.sha }}
          restore-keys: |
            anchor-publish-${{ runner.os }}-${{ hashFiles('apps/anchor/go.sum') }}-
            anchor-publish-${{ runner.os }}-
      - name: Build the binary
        working-directory: apps/anchor
        env:
          GOOS: linux
          GOARCH: amd64
          VERSION: ${{ steps.publish.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: ../../scripts/build-anchor.sh "$RUNNER_TEMP/binary/anchor"
      - if: github.ref == 'refs/heads/main' || steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: ./.github/actions/build-image
        with:
          binary-dir: ${{ runner.temp }}/binary
          push: 'true'
          tags: ${{ steps.publish.outputs.refs }}
          version: ${{ steps.publish.outputs.version }}
          commit-sha: ${{ github.sha }}
          build-date: ${{ github.event.head_commit.timestamp }}

  migration-lint:
    needs: detect_changes
    if: github.event_name == 'pull_request' && needs.detect_changes.outputs.backend_changed == 'true'
    uses: nanostack-dev/ci-workflows/.github/workflows/migration-lint.yml@main
    permissions:
      contents: read
    with:
      migrations_dir: apps/anchor/migrations
      pg_version: '18'

  # One status summarizing the run. A context that lives under a skipped job
  # never materializes, so reading "publish" directly would say
  # nothing on a backend-only PR. This passes when each verification job either
  # succeeded or was legitimately skipped, and fails if any failed or was
  # cancelled.
  #
  # Safe as a *required* check. pull_request has no `paths:` filter, so every PR
  # starts a run and creates this check, and detect_changes decides
  # which verification jobs a PR needs. A docs-only PR runs detect_changes and
  # this job only; the others are skipped, which counts as passing here.
  ci-ok:
    name: ci-ok
    needs: [detect_changes, frontend, backend, publish, migration-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Two pull requests that each add a migration pick the next free number in
      # isolation, so both can claim it and both can merge green. golang-migrate
      # then refuses the whole source and every integration suite fails at setup.
      # Catch the collision on the pull request, where the fix is a rename.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            apps/anchor/migrations
            scripts
      - name: Reject duplicate migration versions
        shell: bash
        run: |
          set -euo pipefail
          duplicates=$(
            find apps/anchor/migrations -type f -name '*.sql' -exec basename {} \; \
              | sed -nE 's/^([0-9]{6})_(.*)\.(up|down)\.sql$/\1 \2/p' \
              | sort -u \
              | awk '{ print $1 }' \
              | uniq -d
          )
          if [ -n "$duplicates" ]; then
            echo "Two migrations share a version number:"
            printf '%s\n' "$duplicates" | while read -r version; do
              find apps/anchor/migrations -type f -name "${version}_*" -exec basename {} \;
            done
            echo "Renumber the one that merged last, then rerun."
            exit 1
          fi
          echo "No duplicate migration version."
      - name: Verify required jobs
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect_changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          MIGRATION_LINT_RESULT: ${{ needs.migration-lint.result }}
        run: |
          set -euo pipefail
          echo "detect_changes=$DETECT_RESULT frontend=$FRONTEND_RESULT backend=$BACKEND_RESULT publish=$PUBLISH_RESULT migration-lint=$MIGRATION_LINT_RESULT"
          for result in "$DETECT_RESULT" "$FRONTEND_RESULT" "$BACKEND_RESULT" "$PUBLISH_RESULT" "$MIGRATION_LINT_RESULT"; do
            [[ "$result" == 'success' || "$result" == 'skipped' ]] || exit 1
          done

  dispatch-deploy-dev:
    needs: [frontend, backend, publish]
    # always() so a failed or skipped frontend does not skip the backend
    # deploy dispatch; backend and publish success is the gate.
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.publish.result == 'success' &&
      needs.backend.result == 'success'
    uses: nanostack-dev/ci-workflows/.github/workflows/dispatch-deploy-event.yml@main
    permissions:
      contents: read
    with:
      deploy_repository: nanostack-dev/infra
      event_type: deploy-service
      payload: >-
        {"service":"anchor","environment":"dev","promote_to_prod":true,"source_repository":"${{ github.repository }}","source_ref":"${{ github.sha }}","image_repository":"ghcr.io/${{ github.repository_owner }}/anchor","image_tag":"${{ needs.publish.outputs.deploy_image_tag }}","git_sha":"${{ github.sha }}"}
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

  # The preview checkbox in .github/pull_request_template.md is read here, from
  # the API, never from github.event.pull_request.body. The event payload is a
  # snapshot: a re-run replays the description the run started with, so a
  # checkbox selected after the build would stay invisible. The API answers with
  # the description as it is now, which is also what lets preview-toggle.yml
  # raise a preview with a plain re-run.
  preview-flag:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: read
    outputs:
      enabled: ${{ steps.flag.outputs.enabled }}
    steps:
      - name: Read the preview checkbox
        id: flag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          body="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""')"
          # The HTML comment is the anchor, not the label. The author can
          # rewrite the wording of the line and the match still holds.
          marker='-[[:space:]]*\[[xX]\].*<!--[[:space:]]*preview-deploy[[:space:]]*-->'
          if printf '%s\n' "$body" | grep -qE -e "$marker"; then
            enabled=true
          else
            enabled=false
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          {
            echo '## Preview environment'
            echo
            echo "- Checkbox selected: $enabled"
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch-preview-upsert:
    needs: [frontend, backend, publish, preview-flag]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      needs.preview-flag.outputs.enabled == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.publish.result == 'success' &&
      needs.backend.result == 'success' &&
      needs.frontend.result != 'failure'
    uses: nanostack-dev/ci-workflows/.github/workflows/dispatch-deploy-event.yml@main
    permissions:
      contents: read
    with:
      deploy_repository: nanostack-dev/infra
      event_type: preview-upsert
      payload: >-
        {"service":"anchor","source_repository":"${{ github.repository }}","source_ref":"${{ github.event.pull_request.head.sha }}","image_repository":"ghcr.io/${{ github.repository_owner }}/anchor","image_tag":"${{ needs.publish.outputs.deploy_image_tag }}","pr_number":${{ github.event.pull_request.number }},"branch_ref":"${{ github.event.pull_request.head.ref }}","git_sha":"${{ github.event.pull_request.head.sha }}"}
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
