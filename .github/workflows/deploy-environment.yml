name: Deploy Environment

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment name
        required: true
        type: string
      image_tag:
        description: Image tag to deploy
        required: true
        type: string
      enforce_latest_main:
        description: Skip stale queued deployments when main moved ahead
        required: false
        default: false
        type: boolean
    secrets:
      NANOSTACK_ENV_FILE:
        required: true
      CI_PAT:
        required: true
      DEPLOY_SSH_PRIVATE_KEY_DEV:
        required: true
      DEPLOY_SSH_PRIVATE_KEY_PROD:
        required: true
      GHCR_USERNAME:
        required: true
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_OAUTH_SECRET:
        required: true
      CI_CD_DISCORD_WEBHOOK_URL:
        required: false

jobs:
  deploy:
    uses: nanostack-dev/github-actions/.github/workflows/deploy-go-app.yml@main
    with:
      app_name: anchor
      deploy_host: ${{ inputs.environment == 'prod' && vars.DEPLOY_HOST_PROD || vars.DEPLOY_HOST_DEV }}
      deploy_user: ${{ inputs.environment == 'prod' && vars.DEPLOY_USER_PROD || vars.DEPLOY_USER_DEV }}
      environment: ${{ inputs.environment }}
      image_repository: ghcr.io/${{ github.repository_owner }}/anchor
      image_tag: ${{ inputs.image_tag }}
      enforce_latest_main: ${{ inputs.enforce_latest_main }}
      sentry_release_env_key: SENTRY_RELEASE_NANOSTACK
      service_name: anchor
      required_env_keys: |
        NANOSTACK_HOST
        NANOSTACK_ADMIN_JWT_SECRET
        DB_HOST
        DB_USER
        DB_PASSWORD
        REDIS_ADDRESS
        REDIS_PASSWORD
        APP_ENCRYPTION_KEY
    secrets:
      APP_ENV_FILE: ${{ secrets.NANOSTACK_ENV_FILE }}
      READ_PAT_GITHUB: ${{ secrets.CI_PAT }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ inputs.environment == 'prod' && secrets.DEPLOY_SSH_PRIVATE_KEY_PROD || secrets.DEPLOY_SSH_PRIVATE_KEY_DEV }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_PAT: ${{ secrets.CI_PAT }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      CI_CD_DISCORD_WEBHOOK_URL: ${{ secrets.CI_CD_DISCORD_WEBHOOK_URL }}
