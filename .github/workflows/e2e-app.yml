name: Browser app (isolated)

on:
  pull_request:
    paths:
      - 'anchor-ui/**'
      - 'apps/anchor/**'
      - 'clients/go/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anchor-browser-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: anchor-ui
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.6
        with:
          version: 11.1.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.27.0'
          cache-dependency-path: |
            apps/anchor/go.sum
            clients/go/go.sum
      - name: Check Docker and Compose
        run: |
          docker info --format '{{.ServerVersion}}'
          docker compose version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check browser feature inventory
        run: pnpm check:e2e
      - name: Test the isolated app
        run: GOCACHE="$(go env GOCACHE)" pnpm test:e2e:app
      - name: Upload results and failure screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: anchor-browser-app-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            anchor-ui/test-results/app/results.json
            anchor-ui/test-results/app/**/test-failed-*.png
