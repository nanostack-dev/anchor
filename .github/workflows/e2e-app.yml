name: Browser app (isolated)

on:
  pull_request:
    paths:
      - 'anchor-ui/**'
      - 'apps/anchor/**'
      - 'clients/go/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e-app.yml'
  workflow_dispatch:
    inputs:
      trace:
        description: 'Record traces and retain failures (adds recording overhead)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: anchor-browser-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: app shard ${{ matrix.shard }}/2
    # Two shards on two runners: each runner keeps 2 Playwright workers, the
    # most its 4 vCPU run without the timeouts below, and the suite takes half
    # the time. The `app` job then proves the shards together ran every
    # scenario once.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Pinned: ubuntu-latest is Ubuntu 26.04, where Playwright 1.60 cannot
    # install Chromium's system deps. Return to ubuntu-latest once Playwright
    # supports 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: anchor-ui
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          version: 11.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            apps/anchor/go.sum
            clients/go/go.sum
      - name: Check Docker and Compose
        run: |
          docker info --format '{{.ServerVersion}}'
          docker compose version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # The checks that need no app run once, in shard 1.
      - name: Check browser feature inventory
        if: matrix.shard == 1
        run: pnpm check:e2e
      - name: Test browser tooling checks
        if: matrix.shard == 1
        run: pnpm test:e2e:tooling
      - name: Verify failure report packaging
        if: matrix.shard == 1
        run: pnpm test:e2e:artifacts
      - name: Test the isolated app
        env:
          # 2 workers on the 4 vCPU runner. Measured 2026-11-11 (70 tests): 3
          # workers cut the tests from a median 3.4 to 2.8 min (job about 30 s
          # faster), 4 workers to 2.7 min, but both made templates.e2e.ts time
          # out on an 8 s action (1 run in 8 at 3 workers, 1 in 5 at 4), which
          # never happened at 2 workers. Speed that adds a flake is a loss.
          E2E_WORKERS: '2'
          E2E_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          E2E_TRACE: ${{ inputs.trace && '1' || '0' }}
          SHARD: ${{ matrix.shard }}/2
        run: GOCACHE="$(go env GOCACHE)" pnpm test:e2e:verify --base "$E2E_BASE_REF" --shard "$SHARD"
      - name: Verify disposable runtime cleanup
        if: always()
        run: node scripts/e2e-runtime.mjs verify-stopped
      - name: Upload reports and failure evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: anchor-browser-app-${{ matrix.shard }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            anchor-ui/test-results/app/results.json
            anchor-ui/test-results/selection.json
            anchor-ui/test-results/completion.json
            anchor-ui/test-results/report/
            anchor-ui/test-results/app/**/test-failed-*.png
            anchor-ui/test-results/app/**/error-context.md
            anchor-ui/test-results/app/**/trace.zip

  app:
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both shards
        env:
          SHARDS: ${{ needs.shard.result }}
        run: test "$SHARDS" = success
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: anchor-ui/scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: anchor-browser-app-*-${{ github.run_attempt }}
          path: proofs
      - name: Verify the shards ran every scenario once
        run: node anchor-ui/scripts/e2e-shards.mjs proofs/*/completion.json
