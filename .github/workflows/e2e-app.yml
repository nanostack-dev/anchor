name: Browser app (isolated)

on:
  pull_request:
    paths:
      - 'anchor-ui/**'
      - 'apps/anchor/**'
      - 'clients/go/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e-app.yml'
  workflow_dispatch:
    inputs:
      trace:
        description: 'Record traces and retain failures (adds recording overhead)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: anchor-browser-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: anchor-ui
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.6
        with:
          version: 11.1.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.27.0'
          cache-dependency-path: |
            apps/anchor/go.sum
            clients/go/go.sum
      - name: Check Docker and Compose
        run: |
          docker info --format '{{.ServerVersion}}'
          docker compose version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check browser feature inventory
        run: pnpm check:e2e
      - name: Test browser tooling checks
        run: pnpm test:e2e:tooling
      - name: Verify failure report packaging
        run: pnpm test:e2e:artifacts
      - name: Test the isolated app
        env:
          E2E_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          E2E_TRACE: ${{ inputs.trace && '1' || '0' }}
        run: GOCACHE="$(go env GOCACHE)" pnpm test:e2e:verify --base "$E2E_BASE_REF"
      - name: Verify disposable runtime cleanup
        if: always()
        run: node scripts/e2e-runtime.mjs verify-stopped
      - name: Upload reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: anchor-browser-app-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            anchor-ui/test-results/app/results.json
            anchor-ui/test-results/selection.json
            anchor-ui/test-results/completion.json
            anchor-ui/test-results/report/
            anchor-ui/test-results/app/**/test-failed-*.png
            anchor-ui/test-results/app/**/error-context.md
            anchor-ui/test-results/app/**/trace.zip
