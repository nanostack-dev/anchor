openapi: 3.0.3
info:
  title: Anchor Stripe sandbox prototype
  version: 0.1.0
  description: >-
    A local-only sandbox integration using Anchor's public product APIs and Stripe test mode.
    The launcher binds to loopback. Management requests require the local UI origin;
    signed Stripe webhook delivery is the only unauthenticated external action.
servers:
  - url: http://127.0.0.1:18081
security: []
paths:
  /api/state:
    get:
      operationId: getState
      summary: Read billing and Anchor license state
      responses:
        '200':
          description: Current sandbox state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '502':
          $ref: '#/components/responses/Error'
  /api/prices:
    post:
      operationId: createPrice
      summary: Create a recurring sandbox price for an Anchor template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePriceRequest'
      responses:
        '201':
          $ref: '#/components/responses/Price'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/prices/{priceId}/archive:
    parameters:
      - $ref: '#/components/parameters/PriceID'
    post:
      operationId: archivePrice
      summary: Withdraw a price from new sales while keeping existing subscriptions
      responses:
        '200':
          $ref: '#/components/responses/Price'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/settings:
    put:
      operationId: updateSettings
      summary: Choose the Anchor license template used after a subscription ends
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsRequest'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/organizations/{organizationId}/checkout:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: createCheckout
      summary: Open hosted Stripe Checkout for a recurring sandbox subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          $ref: '#/components/responses/URL'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/organizations/{organizationId}/subscription:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: changeSubscription
      summary: Change a subscription price and reconcile its Anchor license
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '200':
          $ref: '#/components/responses/Organization'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/organizations/{organizationId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: cancelSubscription
      summary: Cancel the subscription at the end of its current period
      responses:
        '200':
          $ref: '#/components/responses/Organization'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/organizations/{organizationId}/resume:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: resumeSubscription
      summary: Resume a subscription scheduled to cancel
      responses:
        '200':
          $ref: '#/components/responses/Organization'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/organizations/{organizationId}/portal:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: createPortal
      summary: Open the hosted Stripe customer portal
      responses:
        '200':
          $ref: '#/components/responses/URL'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/organizations/{organizationId}/sync:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: reconcileOrganization
      summary: Reconcile the latest Stripe subscription into Anchor licensing
      responses:
        '200':
          $ref: '#/components/responses/Organization'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /webhooks/stripe:
    post:
      operationId: ingestStripeWebhook
      summary: Receive signed Stripe sandbox webhook events
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 2048
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event acknowledged after durable receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
components:
  parameters:
    PriceID:
      name: priceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    OrganizationID:
      name: organizationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
  responses:
    Error:
      description: A scrubbed validation, state, or upstream error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Price:
      description: Recurring sandbox price
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Price'
    Organization:
      description: Organization license and billing state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Organization'
    URL:
      description: Hosted Stripe sandbox page
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/URLResponse'
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
    Account:
      type: object
      additionalProperties: false
      required: [id, name, mode]
      properties:
        id:
          type: string
        name:
          type: string
        mode:
          type: string
          enum: [sandbox]
    Product:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
    Template:
      type: object
      additionalProperties: false
      required: [id, name, values, archived]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
        values:
          type: object
          additionalProperties: true
        archived:
          type: boolean
    Price:
      type: object
      additionalProperties: false
      required: [id, name, template_id, amount, currency, interval, stripe_product_id, stripe_price_id, active]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
        template_id:
          $ref: '#/components/schemas/Identifier'
        amount:
          type: integer
          x-go-type: int64
          minimum: 1
          maximum: 99999999
          description: Recurring amount in the smallest unit of the currency
        currency:
          type: string
          enum: [usd, cad, eur]
        interval:
          type: string
          enum: [month, year]
        stripe_product_id:
          type: string
        stripe_price_id:
          type: string
        active:
          type: boolean
    Organization:
      type: object
      additionalProperties: false
      required: [id, name, template_id, license_values, customer_id, subscription_id, price_id, status, cancel_at_period_end, current_period_end, sync_state, last_synced_at, sync_error, pending_update]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
        template_id:
          type: string
        license_values:
          type: object
          additionalProperties: true
        customer_id:
          type: string
        subscription_id:
          type: string
        price_id:
          type: string
        status:
          type: string
        cancel_at_period_end:
          type: boolean
        current_period_end:
          type: string
          format: date-time
          nullable: true
        sync_state:
          type: string
        last_synced_at:
          type: string
          format: date-time
          nullable: true
        sync_error:
          type: string
        pending_update:
          type: boolean
    Settings:
      type: object
      additionalProperties: false
      required: [fallback_template_id]
      properties:
        fallback_template_id:
          $ref: '#/components/schemas/Identifier'
    BillingEvent:
      type: object
      additionalProperties: false
      required: [id, type, organization_id, status, received_at, last_error]
      properties:
        id:
          type: string
        type:
          type: string
        organization_id:
          type: string
        status:
          type: string
        received_at:
          type: string
          format: date-time
        last_error:
          type: string
    State:
      type: object
      additionalProperties: false
      required: [account, product, templates, prices, organizations, settings, events]
      properties:
        account:
          $ref: '#/components/schemas/Account'
        product:
          $ref: '#/components/schemas/Product'
        templates:
          type: array
          items:
            $ref: '#/components/schemas/Template'
        prices:
          type: array
          items:
            $ref: '#/components/schemas/Price'
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        settings:
          $ref: '#/components/schemas/Settings'
        events:
          type: array
          items:
            $ref: '#/components/schemas/BillingEvent'
    CreatePriceRequest:
      type: object
      additionalProperties: false
      required: [name, template_id, amount, currency, interval]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        template_id:
          $ref: '#/components/schemas/Identifier'
        amount:
          type: integer
          x-go-type: int64
          minimum: 1
          maximum: 99999999
        currency:
          type: string
          enum: [usd, cad, eur]
        interval:
          type: string
          enum: [month, year]
    CheckoutRequest:
      type: object
      additionalProperties: false
      required: [price_id, trial_days]
      properties:
        price_id:
          $ref: '#/components/schemas/Identifier'
        trial_days:
          type: integer
          minimum: 0
          maximum: 30
    SubscriptionRequest:
      type: object
      additionalProperties: false
      required: [price_id]
      properties:
        price_id:
          $ref: '#/components/schemas/Identifier'
    UpdateSettingsRequest:
      type: object
      additionalProperties: false
      required: [fallback_template_id]
      properties:
        fallback_template_id:
          $ref: '#/components/schemas/Identifier'
    URLResponse:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
    WebhookResponse:
      type: object
      additionalProperties: false
      required: [received]
      properties:
        received:
          type: boolean
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
