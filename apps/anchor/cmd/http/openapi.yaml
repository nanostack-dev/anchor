  /v1/products/{product_id}/access/v1/evaluation:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    post:
      summary: Evaluate Access
      description: >-
        Decides whether a subject may perform one action on a resource, following the OpenID AuthZEN Authorization API 1.0
        Access Evaluation shape. The subject is a product user, named by its external user ID, or a raw organization API key.
        The resource is an organization, a workspace, or a resource of any type the product declares, named by the
        product's own ID. A registered resource is checked under its stored parent; one the product has not registered
        names its parent in `properties.parent`. A role held on the resource or on any of its ancestors grants the
        permissions it holds, the organization role included. The action name is a resource permission name such as
        `flows:read`. A denial is a 200 with `decision` false and a `context.reason`; an allow returns the resolved
        identity in `context`, and, with `options.explain` true, what granted it in `context.granted_by`. A membership,
        role, role assignment, resource, workspace or API key change made through the API usually applies to the next
        call, and otherwise within seconds; one made outside a request, such as a Clerk ingest, applies within seconds.
        Evaluating an organization API key updates its last_used_at as introspection does.
      operationId: evaluateAccess
      tags: [Access]
      security:
      - productApiKeyAuth: ["product_user:read", "organization_api_key:read"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessEvaluationRequest"
            examples:
              registered:
                summary: A registered document, checked under its stored parent, with an explanation
                value:
                  subject: { type: user, id: user_2NNEqL2nrIRdJ194ndJqow38MB1 }
                  action: { name: "document:view" }
                  resource:
                    type: document
                    id: e8a2f6c1-7d3b-4a9e-b5f0-1c6d2e8a4b97
                    properties: { organization_id: org_2qL9aC3mE8xP1rT6vN4bK2sJ }
                  options: { explain: true }
              unregistered:
                summary: A document the product never registered, named by its parent folder
                value:
                  subject: { type: user, id: user_2NNEqL2nrIRdJ194ndJqow38MB1 }
                  action: { name: "document:view" }
                  resource:
                    type: document
                    id: 5d0b3c9a-e261-4f8d-a7c4-92b1e6f0d384
                    properties:
                      organization_id: org_2qL9aC3mE8xP1rT6vN4bK2sJ
                      parent: { type: folder, id: 3b7e91d2-0c4a-4f6e-9d21-8a5c7e4b2f60 }
      responses:
        "200":
          description: The access decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessEvaluationResponse"
              examples:
                explained:
                  summary: Allowed by a folder role and by the organization role, nearest first
                  value:
                    decision: true
                    context:
                      organization: { id: org_2qL9aC3mE8xP1rT6vN4bK2sJ, name: Acme Corp }
                      role: { id: role_2qLBmb0rTk3vN8xQ1pK6wZ, name: member }
                      permissions: []
                      granted_by:
                      - role: { id: role_2qLBfv7hTn2kR9xQ4pW1vM, name: folder-viewer }
                        resource: { type: folder, id: 3b7e91d2-0c4a-4f6e-9d21-8a5c7e4b2f60 }
                typeNotFound:
                  summary: A resource type the product has not declared
                  value: { decision: false, context: { reason: RESOURCE_TYPE_NOT_FOUND } }
                notFound:
                  summary: An unregistered resource that names no parent
                  value: { decision: false, context: { reason: RESOURCE_NOT_FOUND } }
                notInOrganization:
                  summary: A parent registered in another organization of the product
                  value: { decision: false, context: { reason: RESOURCE_NOT_IN_ORGANIZATION } }
                parentTypeNotAllowed:
                  summary: A parent of a type the resource's type can't sit under
                  value: { decision: false, context: { reason: PARENT_TYPE_NOT_ALLOWED } }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/AccessDecisionsUnavailable"
  /v1/products/{product_id}/access/v1/evaluations:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    post:
      summary: Evaluate Access For Several Actions
      description: >-
        Decides several actions for one subject and one resource in a single call, following the AuthZEN batch
        evaluations shape. A top-level `action` is the default for items without one, and with no items it is evaluated
        alone, as AuthZEN specifies. Per-item `subject` and `resource` overrides are refused with 400 rather than ignored.
        The top-level `decision` is true only when the subject can reach the resource and every evaluation is allowed.
        With no items and no top-level action, the call asks only whether the subject can reach the resource (an Anchor
        extension). `options.evaluations_semantic` controls short-circuiting; items that are not evaluated are denied
        with reason `NOT_EVALUATED`. The resource is resolved once for every item, as on the single evaluation: a
        resource the subject can't reach denies every item with the same reason. With `options.explain` true, each
        allowed item carries `granted_by` in its own `context`.
      operationId: evaluateAccessBatch
      tags: [Access]
      security:
      - productApiKeyAuth: ["product_user:read", "organization_api_key:read"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessEvaluationsRequest"
      responses:
        "200":
          description: The access decisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessEvaluationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/AccessDecisionsUnavailable"
