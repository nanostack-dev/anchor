        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  x-go-type: string
                  description: User's email address. Must be unique within the 
                    Product.
                  examples: ["new.user@company.com"]
                name:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 100
                  description: User's display name.
                  examples: ["New User"]
                status:
                  $ref: "#/components/schemas/ProductUserStatus"
                  description: Initial status (e.g., 'active' or 'invited'). 
                    Defaults might apply.
              required:
              - email
      responses:
        "201":
          description: Product user created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest" # Validation errors
        "401":
          $ref: "#/components/responses/Unauthorized" # Invalid/missing API Key
        "403":
          $ref: "#/components/responses/Forbidden" # API Key lacks permission
        '409':
          $ref: '#/components/responses/Conflict'
