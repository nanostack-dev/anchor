            with `NOT_A_MEMBER`.
        parent:
          $ref: "#/components/schemas/ResourceParentRef"
          description: >-
            The parent of a resource the product has not registered: a resource registered in the organization, or
            the organization itself as `{ "type": "organization", "id": "<organization_id>" }`. Its type must be one
            the resource's type may sit under, or the decision is denied with `PARENT_TYPE_NOT_ALLOWED`. A registered
            resource's stored parent wins over this one, and Anchor logs the mismatch. Organization and workspace
            resources take none (400 `INVALID_ACCESS_RESOURCE`).
    AccessResource:
      type: object
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/AccessResourceType"
        id:
          type: string
          description: >-
            The organization or workspace ID, or the product's own ID of a resource. Required except for an
            organization resource with an organization API key subject, where an absent ID means the key's own
