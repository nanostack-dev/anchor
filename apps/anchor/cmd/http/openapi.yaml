              schema:
                $ref: "#/components/schemas/ProductResourcePermissionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Delete Product Resource Permission
      description: Deletes a resource permission, and removes it from every
        role and product API key that holds it. Each role that held it emits
