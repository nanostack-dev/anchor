      oneOf:
      - $ref: "#/components/schemas/ClerkIntegrationConfig"
      - $ref: "#/components/schemas/SmtpIntegrationConfig"
      description: Provider-specific configuration payload.
    SmtpIntegrationPublicConfig:
      type: object
      description: Non-sensitive SMTP configuration fields returned in API responses. Password is never included.
      properties:
        host:
          type: string
          description: SMTP server hostname.
        port:
          type: integer
          description: SMTP port.
          default: 587
        encryption:
          type: string
          enum: [STARTTLS, TLS, NONE]
        auth_method:
          type: string
          enum: [PLAIN, LOGIN]
        username:
          type: string
          description: SMTP authentication username.
        from_address:
          type: string
          description: From email address for outgoing mail.
        from_name:
          type: string
          description: Display name for the From field.
        reply_to:
          type: string
          description: Optional Reply-To address.
      additionalProperties: false
    IntegrationProviderPublicConfig:
      oneOf:
      - $ref: "#/components/schemas/SmtpIntegrationPublicConfig"
      description: Non-sensitive provider configuration returned in API responses.
    SmtpIntegrationInstanceCreateRequest:
      type: object
      required: [provider_type, config]
      additionalProperties: false
      properties:
        provider_type:
          # Deliberately an inline single-value enum rather than a $ref to
          # IntegrationProviderType. This is the oneOf discriminator, so it has
          # to narrow to one value. OpenAPI 3.1 lets `const`/`enum` sit beside a
          # `$ref`, and oapi-codegen and kin-openapi both honour that, but
          # @hey-api/openapi-ts (0.83 and 0.88 both checked) resolves the $ref
          # and discards the narrowing sibling. Both branches then generate
          # `provider_type: IntegrationProviderType`, the TS union stops
          # discriminating, and `config` collapses to `never` at every call
          # site. Keep the copy until hey-api honours the sibling.
          type: string
          enum: [SMTP]
        config:
          $ref: "#/components/schemas/SmtpIntegrationConfig"
    ClerkIntegrationInstanceCreateRequest:
      type: object
      properties:
        provider_type:
          # Inline by necessity — see SmtpIntegrationInstanceCreateRequest.provider_type.
          type: string
          enum: [CLERK]
        config:
          $ref: "#/components/schemas/ClerkIntegrationConfig"
      required:
      - provider_type
      additionalProperties: false
    IntegrationInstanceCreateRequest:
      oneOf:
      - $ref: "#/components/schemas/ClerkIntegrationInstanceCreateRequest"
      - $ref: "#/components/schemas/SmtpIntegrationInstanceCreateRequest"
      discriminator:
        propertyName: provider_type
        mapping:
          CLERK: "#/components/schemas/ClerkIntegrationInstanceCreateRequest"
          SMTP: "#/components/schemas/SmtpIntegrationInstanceCreateRequest"
      description: Create request for a provider integration instance.
