  /v1/products/{product_id}/product-users/{product_user_id}/organizations/search:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    - $ref: "#/components/parameters/ProductUserIdParameter"
    post:
      summary: Search User Organizations
      description: >-
        Searches the organizations that the specified product user belongs to,
        including their role and membership details in each organization.
        Filter by `organization_ids` and `role_ids`. Pass
        `include=role_permissions` to read the permissions of every role in the
        page. Requires an API Key with `product_user:read` permission.

        Default order is `joined_at` ascending, then `organization_id`.
        Page with a cursor: send the `next_cursor` of the previous response as `pagination.cursor`; an absent `next_cursor` marks the last page.
      operationId: searchUserOrganizations
      tags: [ProductUser]
      security:
      - productApiKeyAuth: ["product_user:read"]
      parameters:
      - name: include
        in: query
        required: false
        description: Comma-separated list of additional fields to include.
        schema:
          type: array
          items:
            $ref: "#/components/schemas/UserOrganizationInclude"
        style: form
        explode: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserOrganizationSearchRequest"
      responses:
        "200":
          description: A page of the organizations the user belongs to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOrganizationSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
