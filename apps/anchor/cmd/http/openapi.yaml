          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/products/{product_id}/organizations/{organization_id}/license/usage:
    parameters:
    - $ref: '#/components/parameters/ProductIdParameter'
    - $ref: '#/components/parameters/OrganizationIdParameter'
    post:
      summary: Report Organization Usage
      description: >-
        Records what an organization has used, as an absolute snapshot. Every
        report is kept as an immutable observation, and Anchor never adds them
        together, so reporting the same value twice changes nothing.

        The report is checked for four things: the product's license schema
        declares the key, the field is a limit, the value is a finite
        non-negative number, and the window is coherent and no longer than a
        year. The license field's own rules are deliberately not applied. Rules
        bound what a limit may be set to, never what usage turns out to be, so a
        value past the organization's limit is stored as reported.

        The organization does not need a license. Usage is what happened, and it
        stays true whether or not a limit was granted.
      operationId: reportOrganizationUsage
      tags:
      - Licensing
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - license_usage:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageReportRequest'
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageObservationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/products/{product_id}/organizations/{organization_id}/license/usage/series:
    parameters:
    - $ref: '#/components/parameters/ProductIdParameter'
    - $ref: '#/components/parameters/OrganizationIdParameter'
    get:
      summary: Get Organization Usage Series
      description: >-
        Reads an organization's usage history for one license field: filtered
        by key and time range, and paginated. Granularity selects a level of
        the continuous-aggregate cascade — MINUTE, HOUR or DAY — each
        reporting the last observation per bucket, never a sum or an average,
        because the values are snapshots.

        This is a deliberately separate read from the license state: a large
        paginated series and a small hot cacheable read want different
        shapes. This endpoint is not cached, and reading it never touches the
        license state read's cache.

        Interpreting the series against a limit — deciding whether an
        organization is within or past it — is not this endpoint's job. It
        returns the series as stored; that judgment stays in the license
        state read.

        Not a search. This is an aggregate time series computed per request from the continuous aggregates, not a stored collection. It pages by `limit` and `offset` over time buckets in ascending order, and never returns a `next_cursor`.
      operationId: getOrganizationUsageSeries
      tags:
      - Licensing
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - license_usage:read
      parameters:
      - name: key
        in: query
        required: true
        description: The license field this series was measured against.
        schema:
          type: string
          maxLength: 120
      - name: granularity
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/UsageGranularity'
      - name: from
        in: query
        required: true
        description: Inclusive start of the range.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Exclusive end of the range. Omit to mean now.
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSeriesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
