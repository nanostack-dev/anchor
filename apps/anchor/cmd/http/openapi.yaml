    AccessDecisionContext:
      type: object
      description: Anchor's extension of the AuthZEN decision context.
      properties:
        reason:
          $ref: "#/components/schemas/AccessDenyReason"
        missing_permissions:
          type: array
          items:
            type: string
        organization:
          $ref: "#/components/schemas/AccessIdentityRef"
        role:
          $ref: "#/components/schemas/AccessIdentityRef"
        product_user:
          $ref: "#/components/schemas/AccessIdentityRef"
        api_key:
          $ref: "#/components/schemas/AccessIdentityRef"
        permissions:
          type: array
          description: Every permission the organization role or API key holds in the organization.
          items:
            type: string
        granted_by:
          type: array
          description: >-
            Set only on an allowed decision of a request with `options.explain` true (an Anchor extension that AuthZEN
            clients ignore): the roles, or the API key, that granted the action, nearest first, from the resource up
            through its registered ancestors to the organization. Absent when the caller did not ask for it, or when
            Anchor's tables can't be read; the decision stands either way. It is read from Anchor's tables after the
            decision, not from the relationship store that made it, so right after a write it can briefly be empty or
            differ from the grant the store used.
          items:
            $ref: "#/components/schemas/AccessGrant"
    AccessEvaluationOptions:
      type: object
      properties:
        explain:
          type: boolean
          default: false
          description: >-
            `true` adds `granted_by` to the context of each allowed decision (an Anchor extension of AuthZEN). It
            costs at most two more reads per call, whatever the number of actions; without it a decision costs no more.
    AccessEvaluationRequest:
      type: object
      required: [subject, action, resource]
      properties:
        subject:
          $ref: "#/components/schemas/AccessSubject"
        action:
          $ref: "#/components/schemas/AccessAction"
        resource:
          $ref: "#/components/schemas/AccessResource"
        context:
