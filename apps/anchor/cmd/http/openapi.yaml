  # --- Product Resource Permission Management ---
  # ProductResourcePermissions are domain-specific permissions defined by the
  # product owner for their own application resources. For example, if you are
  # building a Google Drive-like product you would define permissions such as
  # "document:read", "file:delete", "workspace:invite". These are distinct from
  # the built-in ProductPermissions that govern access to the product within
  # Anchor. Resource permissions are assigned to ProductRoles, which are
  # then attached to end-user organization memberships to control what those
  # users can do inside your product.
  /v1/products/{product_id}/resource-types:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    post:
      summary: Create Product Resource Type
      description: >-
        Adds a resource type to the product's tree. Roles and permissions are
        scoped to a resource type, and a role held on a resource covers that
        resource and every resource below it. A duplicate slug answers 409
        RESOURCE_TYPE_SLUG_DUPLICATE; an unknown parent type answers 400
        RESOURCE_TYPE_NOT_FOUND; more than 50 types besides `organization`
        answers 409 RESOURCE_TYPE_LIMIT_REACHED. Emits
        `product.resource_type.created`. Requires Platform Bearer token or
        Product API Key with resource_type:create.
      operationId: createProductResourceType
      tags: [ProductResourceType]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["resource_type:create"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductResourceTypeCreateRequest"
      responses:
        "201":
          description: Resource type created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResourceTypeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    put:
      summary: Replace Product Resource Type Tree
      description: >-
        Replaces every resource type of the product except `organization` in
        one transaction: the admin UI publishes a draft tree with this call.
        A type in the body is created or updated by slug; a type left out is
        deleted, under the same rules as the delete route. A type that loses a
        parent type, or stops nesting in itself, is refused as on the update
        route while registered resources use it that way. Emits one
        `product.resource_type.*` event per type created, updated or deleted.
        Requires Platform Bearer token or Product API Key with
        resource_type:create, resource_type:update and resource_type:delete.
      operationId: replaceProductResourceTypes
      tags: [ProductResourceType]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["resource_type:create", "resource_type:update", "resource_type:delete"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductResourceTypeTreeRequest"
      responses:
        "200":
          description: The product's resource types after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResourceTypeTreeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/products/{product_id}/resource-types/search:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    post:
      summary: Search Product Resource Types
      description: >-
        Searches the product's resource types, `organization` included.
        Requires Platform Bearer token or Product API Key with
        resource_type:read.

        Default order is `created_at` ascending, then `id`. Page with a cursor: send the `next_cursor` of the previous response as `pagination.cursor`; an absent `next_cursor` marks the last page.
      operationId: searchProductResourceTypes
      tags: [ProductResourceType]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["resource_type:read"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductResourceTypeSearchRequest"
      responses:
        "200":
          description: Matching resource types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResourceTypeListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/products/{product_id}/resource-types/{resource_type_id}:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    - $ref: "#/components/parameters/ResourceTypeIdParameter"
    get:
      summary: Get Product Resource Type
      description: Requires Platform Bearer token or Product API Key with resource_type:read.
      operationId: getProductResourceType
      tags: [ProductResourceType]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["resource_type:read"]
      responses:
        "200":
          description: The resource type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResourceTypeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update Product Resource Type
      description: >-
        Renames a resource type, changes its description or its allowed parent
        types, or turns `nests_in_itself` on or off. Emits
        `product.resource_type.updated` when something changed. Requires
        Platform Bearer token or Product API Key with resource_type:update.
      operationId: updateProductResourceType
      tags: [ProductResourceType]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["resource_type:update"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductResourceTypeUpdateRequest"
      responses:
        "200":
          description: The resource type after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResourceTypeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: Delete Product Resource Type
      description: >-
        Deletes a resource type that nothing uses. A type that is the parent of
        another type, that managed roles or permissions are scoped to, or that
        registered resources use, answers 409 RESOURCE_TYPE_IN_USE with the
        blocking counts in `metadata.blocked_by`; `resources` is present only
        when resources block it. Custom roles of the type that nobody holds are
        deleted with it, with organization.role.deleted: its permissions are
        gone by then, so they grant nothing. A custom role that a membership,
        an assignment or a pending invitation names blocks the delete,
        counted in `metadata.blocked_by.custom_roles_held`.
        The built-in `organization` type answers 409 BUILT_IN_RESOURCE_TYPE.
        Emits `product.resource_type.deleted`. Requires Platform Bearer token
        or Product API Key with resource_type:delete.
      operationId: deleteProductResourceType
      tags: [ProductResourceType]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["resource_type:delete"]
      responses:
        "204":
          description: Resource type deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/products/{product_id}/resource-permissions:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    post:
