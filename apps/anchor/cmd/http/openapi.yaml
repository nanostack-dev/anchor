          examples: ["product_role_3A0Yy5f38miFJl65gf4ldxVmWKh"]
        name:
          type: string
          description: Display name of the role.
          examples: ["Admin"]
        permissions:
          type: array
          items:
            type: string
          description: >-
            Product resource permission names assigned to this role
            (for example "document:read", "file:delete"). Present only when
            the caller sends `include=role_permissions`. Absent means the
            caller did not ask for the permissions. Absent never means the
            role has no permissions.
          examples: [["org:read", "org:write"]]
      required:
      - id
      - name
    OrganizationMemberListResponse:
      type: object
      description: Paginated list of organization members.
      allOf:
      - $ref: "#/components/schemas/PagedListResponse"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/OrganizationMemberResponse"
        required:
        - items
    OrganizationMemberRequest:
      type: object
      description: Request body for adding a member to an organization.
      properties:
        product_user_id:
          $ref: "#/components/schemas/ksuid"
          description: The product user to add to the organization.
          examples: ["pusr_3iXYZ..."]
        role_id:
          $ref: "#/components/schemas/ksuid"
          description: >-
            The role to assign to the member. It must be a role the Product
            manages or a custom role of this Organization; any other role
            answers 400 ROLE_NOT_FOUND_IN_REQUEST. Omit it to add a member with
            no role: they belong to the Organization and hold no permission
            there until they get one.
          examples: ["product_role_3A0Yy5f38miFJl65gf4ldxVmWKh"]
      required:
      - product_user_id
    OrganizationMemberRoleRequest:
      type: object
      description: Request body for updating a member's role within an 
        organization.
      properties:
        role_id:
          type: [string, "null"]
          pattern: "^[a-z_]{2,20}_[0-9a-zA-Z]{27}$"
          # Server only: a Nullable tells an omitted role_id (400) from null
          # (no role). generate_anchor.sh drops these three hints from the
          # client spec, where a nil pointer sends null.
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          description: >-
            The new role to assign to the member. It must be a role the Product
            manages or a custom role of this Organization; any other role
            answers 400 ROLE_NOT_FOUND_IN_REQUEST. Send null to remove the
            member's role: they stay a member and hold no permission. The field
            is required, so leaving it out answers 400.
          examples: ["product_role_3A0Yy5f38miFJl65gf4ldxVmWKh"]
      required:
      - role_id
