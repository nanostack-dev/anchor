  /v1/products/{product_id}/organizations/{organization_id}/license/history:
    parameters:
    - $ref: '#/components/parameters/ProductIdParameter'
    - $ref: '#/components/parameters/OrganizationIdParameter'
    get:
      summary: Get Organization License History
      description: >-
        Reads every change ever made to an organization's license, newest
        first and paginated: the template it was instantiated from, and each
        later adjustment naming the license field, the value it held and the
        value it was given.

        The history is append-only and immutable. There is no route that edits
        or removes an entry, so "what was this customer given, and when" keeps
        the same answer for the lifetime of the organization. Deleting the
        organization takes its history with it.

        An organization that has never been licensed reads as an empty history
        rather than as a 404 — nothing has happened to it yet, which is a fact
        rather than an absence. A 404 means no such organization.

        Deprecated: use `searchOrganizationLicenseHistory`, which pages with a cursor.
      operationId: getOrganizationLicenseHistory
      deprecated: true
      tags:
      - Licensing
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - organization_license:read
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationLicenseHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/products/{product_id}/organizations/{organization_id}/license/history/search:
    parameters:
    - $ref: '#/components/parameters/ProductIdParameter'
    - $ref: '#/components/parameters/OrganizationIdParameter'
    post:
      summary: Search Organization License History
      description: >-
        Searches every change ever made to an organization's license: the
        template it was instantiated from, and each later adjustment naming
        the license field, the value it held and the value it was given.
        Filter by `types` and by a `changed_after` and `changed_before` range.

        The history is append-only and immutable. There is no route that edits
        or removes an entry, so "what was this customer given, and when" keeps
        the same answer for the lifetime of the organization. An organization
        that has never been licensed has an empty history rather than a 404. A
        404 means no such organization.

        Default order is `changed_at` descending, then `id` descending, newest
        first. Page with a cursor: send the `next_cursor` of the previous response as `pagination.cursor`; an absent `next_cursor` marks the last page.
      operationId: searchOrganizationLicenseHistory
      tags:
      - Licensing
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - organization_license:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationLicenseHistorySearchRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationLicenseHistoryResponse'
