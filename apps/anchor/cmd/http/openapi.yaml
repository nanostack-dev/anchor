        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # What a license template sets, keyed by license field name. A value is
    # whatever its declared field type admits — a number, a boolean, or a
    # string — so the map is deliberately untyped here and every entry is
    # checked against the product's license schema on write.
    LicenseTemplateValues:
      type: object
      additionalProperties: true
      x-go-type: license.TemplateValues
      x-go-type-import:
        path: anchor/internal/domain/license
      example:
        flows: 500
        sso: true
        support_tier: priority

    LicenseTemplateStatus:
      type: string
      description: >-
        Whether a template is still on sale. Not a workflow — there is no draft
        to publish, and no route back from `ARCHIVED`. A tier is offered or it is
        withdrawn, and withdrawing it is what deleting a template means here.
      enum: [ACTIVE, ARCHIVED]
      x-go-type: license.TemplateStatus
      x-go-type-import:
        path: anchor/internal/domain/license

    LicenseTemplateCreateRequest:
      type: object
      required: [name, values]
      properties:
        name:
          type: string
          maxLength: 120
          description: Operator-facing name, unique within the product.
        description:
          type: string
        values:
          $ref: '#/components/schemas/LicenseTemplateValues'

    # Values are replaced wholesale rather than patched: a template is a single
    # statement of what a tier grants, and a partial edit has no unambiguous
    # meaning for a license field the caller dropped. A value update is
    # propagated onto every license instantiated from this template, except on
    # each license's adjusted fields. See
    # docs/adr/0018-license-follows-its-template.md.
    LicenseTemplateUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
        values:
          $ref: '#/components/schemas/LicenseTemplateValues'

    # A template carries no version and no lifecycle state beyond archival.
    # Its values are copied at instantiation and followed thereafter: an edit
    # is propagated onto the licenses naming it, except on adjusted fields.
    LicenseTemplateResponse:
      type: object
      required: [id, product_id, name, status, values, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/ksuid'
        product_id:
          $ref: '#/components/schemas/ksuid'
        name:
          type: string
          description: >-
            Unique among the product's active templates. Archiving a template
            frees its name, so a withdrawn tier does not block its replacement.
        description:
          type: string
        status:
          $ref: '#/components/schemas/LicenseTemplateStatus'
        values:
          $ref: '#/components/schemas/LicenseTemplateValues'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LicenseTemplateListResponse:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LicenseTemplateResponse'
        count:
          type: integer

    LicenseTemplateFilter:
      type: object
      description: Narrows a search over a product's license templates.
      properties:
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/LicenseTemplateStatus'
          description: >-
            Keep only templates with one of these statuses. Omit for every
            template the product has ever offered.
          x-go-type-skip-optional-pointer: true
    LicenseTemplateSearchRequest:
      allOf:
      - $ref: '#/components/schemas/SearchRequest'
      - type: object
        properties:
          filter:
            $ref: '#/components/schemas/LicenseTemplateFilter'
          sort_by:
            type: string
            enum:
            - name
            - status
            - created_at
            - updated_at
            default: name
            description: Field to sort by.
            x-go-type: license.SortFieldTemplate
            x-go-type-import:
              path: anchor/internal/domain/license
    LicenseTemplateSearchResponse:
      allOf:
      - $ref: '#/components/schemas/PagedListResponse'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/LicenseTemplateResponse'
        required:
        - items
    OrganizationLicenseInstantiateRequest:
      type: object
      required: [template_id]
      properties:
        template_id:
          allOf:
          - $ref: '#/components/schemas/ksuid'
          description: >-
            The license template to copy. The organization keeps its own copy
            of the values, and the copy follows the template: a later edit to
            this template's values is propagated onto the license, except on
            the fields adjusted for this organization.

    OrganizationLicenseAdjustRequest:
      type: object
      description: >-
        An adjustment to one organization's license. Use it for a bespoke
        arrangement that does not deserve a new tier.
      required: [values]
      properties:
        values:
          allOf:
          - $ref: '#/components/schemas/LicenseTemplateValues'
          description: >-
            Merged into the license, not substituted for it. A license field
            present replaces the value held. A license field absent keeps its
            value, which is the opposite of a template write — a template is
            authored whole, a license is adjusted one field at a time. No
            license field can be removed this way, because every field the
            schema declares must stay set. The merged result is validated
            against the schema exactly as a template write is. Every field an
            adjustment moves is recorded in `adjusted_fields`, which pins it:
            a later template update no longer overwrites it.

    OrganizationLicenseResponse:
      type: object
      description: >-
        An organization's license: its own copy of a template's values, kept
        in step with that template except on its adjusted fields. Every
        license field the schema declares carries a value, so a consumer can
        read it at face value.
      required:
      - id
      - product_id
      - organization_id
      - template_id
      - instantiated_at
      - values
      - adjusted_fields
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ksuid'
        product_id:
          $ref: '#/components/schemas/ksuid'
        organization_id:
          $ref: '#/components/schemas/ksuid'
        template_id:
          allOf:
          - $ref: '#/components/schemas/ksuid'
          description: >-
            Which template this organization was sold, and the template this
            license follows: an edit to that template's values is propagated
            onto `values`, except on the fields in `adjusted_fields`.
        instantiated_at:
          type: string
          format: date-time
          description: >-
            When the copy was taken. Neither an adjustment nor a propagated
            template update moves it; only a migration restamps it.
        values:
          allOf:
          - $ref: '#/components/schemas/LicenseTemplateValues'
          description: >-
            What this organization is allowed, keyed by license field name. A
            value that differs from the template is a deviation — read the diff
            route to find them.
        adjusted_fields:
          type: array
          items:
            type: string
          description: >-
            The license fields adjusted for this organization, ordered by
            name. A propagated template update leaves these fields alone, so
            a bespoke arrangement survives every later edit to the tier.
            Empty on a fresh copy: instantiating sets it empty, adjusting adds
            every field the adjustment moved, and migrating keeps it under
            `CARRY_FORWARD` (dropping fields the target does not declare) and
            clears it under `DISCARD`.
        usage:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LicenseFieldUsageResponse'
          description: >-
            One entry per limit field the product's license schema declares,
            keyed by license field name — every declared field that is not a
            limit never appears here. Present on the license read, where it is
            computed fresh on every call; absent from the response to
            instantiating or adjusting a license, which does not compute it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LicenseUsageStatus:
      type: string
      description: >-
        A limit field's derived state against its latest reported usage.
        Computed on every license read and never stored. `stale` means the
        field has never been reported against, so there is no current number
        to trust. Anchor advises with this value; it never gates on it.
      enum: [within_limit, at_limit, exceeded, stale]
      x-go-type: license.UsageStatus
      x-go-type-import:
        path: anchor/internal/domain/license

    LicenseFieldUsageResponse:
      type: object
      description: >-
        One limit field's latest reported usage and derived status, as read
        from an organization's license.
      required: [limit, status]
      properties:
        limit:
          type: number
          format: double
          description: >-
            This organization's current value for the field, mirroring
            `values` on the enclosing license.
        usage:
          type: number
          format: double
          nullable: true
          description: The latest reported value, or null if never reported.
        status:
          $ref: '#/components/schemas/LicenseUsageStatus'
        last_reported_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the latest usage observation was recorded. Null exactly when
            `usage` is null.

    LicenseDifferenceKind:
      type: string
      description: >-
        Why a license field appears in a diff. `changed` means the two sides
        hold different values — usually a field adjusted for this
        organization, since a template edit is otherwise propagated onto the
        license; a propagation still in flight, or one refused because the
        merged values no longer satisfy the schema, also reads as `changed`.
        `only_in_license` and `only_in_template` mean the template changed
        shape and the license has not (yet) followed.
      enum: [changed, only_in_license, only_in_template]
      x-go-type: license.DifferenceKind
      x-go-type-import:
        path: anchor/internal/domain/license

    LicenseFieldDifference:
      type: object
      required: [field, kind, license_value, template_value]
      properties:
        field:
          type: string
          description: The license field the two sides disagree on.
        kind:
          $ref: '#/components/schemas/LicenseDifferenceKind'
        license_value:
          description: >-
            The value the organization's license holds. Null when the kind is
            `only_in_template`, because the template gained this license field
            after the copy was taken.
        template_value:
          description: >-
            The value the template holds today. Null when the kind is
            `only_in_license`, because the template dropped this license field
            after the copy was taken.

    OrganizationLicenseDiffResponse:
      type: object
      description: >-
        How an organization's license differs from its template today. Templates
        carry no version, so this names which license fields differ rather than
        which revision they came from.
      required: [organization_id, template_id, differences, count]
      properties:
        organization_id:
          $ref: '#/components/schemas/ksuid'
        template_id:
          $ref: '#/components/schemas/ksuid'
        differences:
          type: array
          description: Ordered by license field name.
          items:
            $ref: '#/components/schemas/LicenseFieldDifference'
        count:
          type: integer

    LicenseChangeType:
      type: string
      description: >-
        What happened to an organization's license. `INSTANTIATED` is a
        template being stamped onto the organization through the
        single-organization license route: `template_id` names it and
        `new_value` carries the whole set of values copied. `ADJUSTED` is
        one license field moved for this organization alone: `field` names it,
        and `old_value` and `new_value` are that field's values on either side
        of the change. `SET` is the organization's license set through the
        batch migrate route — moved from another template, or granted its
        first, whichever it held before the run: `template_id` names the
        template it now holds, `previous_template_id` the one it came from
        (absent for a first license), and `old_value` and `new_value` carry
        the whole set of values on either side (`old_value` absent to match).
        `TEMPLATE_SYNCED` is the license following its own template after that
        template's values were updated — an automatic propagation, not an
        operator's migrate: `template_id` names the template followed, and
        `old_value` and `new_value` carry the whole set of values on either
        side. Adjusted fields keep their values through it.
      enum: [INSTANTIATED, ADJUSTED, SET, TEMPLATE_SYNCED]
      x-go-type: license.ChangeType
      x-go-type-import:
        path: anchor/internal/domain/license

    OrganizationLicenseChangeResponse:
      type: object
      description: >-
        One entry in an organization's license history. Entries are immutable
        and append-only: nothing edits one, and a correction is a later entry.
      required:
      - id
      - product_id
      - organization_id
      - license_id
      - type
      - changed_at
      properties:
        id:
          $ref: '#/components/schemas/ksuid'
        product_id:
          $ref: '#/components/schemas/ksuid'
        organization_id:
          $ref: '#/components/schemas/ksuid'
        license_id:
          allOf:
          - $ref: '#/components/schemas/ksuid'
          description: >-
            Which license record was changed. Provenance, not a live
            dependency: the entry stays true whatever becomes of that record.
        type:
          $ref: '#/components/schemas/LicenseChangeType'
        template_id:
          allOf:
          - $ref: '#/components/schemas/ksuid'
          description: >-
            The template stamped onto the organization. Present when `type` is
            `INSTANTIATED`, `SET` or `TEMPLATE_SYNCED`, absent otherwise.
        previous_template_id:
          allOf:
          - $ref: '#/components/schemas/ksuid'
          description: >-
            The template the organization held before it was moved. Present
            when `type` is `SET` and the organization held a license before
            this run, absent otherwise — including a `SET` entry that granted
            a first license.
        field:
          type: string
          description: >-
            The license field that moved. Present when `type` is `ADJUSTED`,
            absent otherwise.
        old_value:
          description: >-
            The value held before the change: that license field's value for
            an adjustment, and the whole set held before for a
            `TEMPLATE_SYNCED` entry or a `SET` entry that moved an existing
            license. Absent when `type` is `INSTANTIATED`, when an adjustment
            set a license field the license did not carry, and when a `SET`
            entry granted a first license.
        new_value:
          description: >-
            The value held after the change: that license field's value for an
            adjustment, and the whole set of values for an instantiation, a
            `SET` entry, or a `TEMPLATE_SYNCED` entry.
        changed_at:
          type: string
          format: date-time
          description: >-
            When the change was recorded. Anchor sets it. Every entry of one
            adjustment shares it, so an adjustment that touched several license
            fields reads back as one moment. Every organization set by one
            migration run shares it too, which together with `template_id` is
            what identifies a run.

    LicenseMigrationDifferencePolicy:
      type: string
      description: >-
        What to do with a license field whose value differs from the template
        the organization currently holds. `CARRY_FORWARD`, the default, keeps
        that value on the migrated license, so a bespoke arrangement survives a
        tier change. `DISCARD` takes the target template whole and clears all
        recorded adjustments, including fields already equal to the template.

        A difference is either someone adjusting that customer or the template
        moving after the copy was taken, and the difference alone does not say
        which. `CARRY_FORWARD` therefore preserves a stale copy as readily as a
        bespoke deal. Read the diff between the two templates before choosing.
      enum: [CARRY_FORWARD, DISCARD]
      x-go-type: license.DifferencePolicy
      x-go-type-import:
        path: anchor/internal/domain/license

    LicenseMigrationOutcome:
      type: string
      description: >-
        What happened to one organization in a migration run. `CHANGED` means
        its license was written and its provenance stamped onto the target —
        moved from another tier, or granted its first, whichever it held
        before the run; `previous_template_id` on the history entry says
        which. Clearing recorded adjustments also counts as `CHANGED` even
        when no value moves. `UNCHANGED` means it already held exactly those
        values and adjustment records from that same template, so nothing
        was written. `FAILED` means the write
        was attempted and refused; `error` says why, and the rest of the batch
        was unaffected.
      enum: [CHANGED, UNCHANGED, FAILED]
      x-go-type: license.MigrationOutcome
      x-go-type-import:
        path: anchor/internal/domain/license

    OrganizationLicenseMigrationRequest:
      type: object
      description: >-
        Moves a set of organizations onto one license template. Each license
        takes the target template's values and its provenance is restamped, so
        the record says which tier the customer is on now. This is not an
        adjustment: adjusting cannot move provenance, by design.

        By default a value that differs from the template the organization
        currently holds is carried forward onto the new license, so a bespoke
        arrangement survives the move. See `on_difference`.

        Supply exactly one selection — `organization_ids` or
        `from_template_id`. Supplying both, or neither, is refused.
      required: [template_id]
      properties:
        template_id:
          allOf:
          - $ref: '#/components/schemas/ksuid'
          description: >-
            The template to move onto. It must be active: a withdrawn tier
            cannot be sold to anyone, which is the same rule instantiation
            follows.
        organization_ids:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ksuid'
          description: >-
            The organizations to move, named explicitly. An identifier naming
            no organization in this product is reported as a failed result
            rather than failing the batch.
        from_template_id:
          allOf:
          - $ref: '#/components/schemas/ksuid'
          description: >-
            Move every organization in this product whose license names this
            template. Archived is accepted and is the common case: this is how
            a withdrawn tier is emptied. Resolved inside the request, so an
            organization instantiated a moment ago cannot be missed by a
            client that listed first.
        on_difference:
          allOf:
          - $ref: '#/components/schemas/LicenseMigrationDifferencePolicy'
          default: CARRY_FORWARD

    OrganizationLicenseMigrationResult:
      type: object
      description: What one migration did to one organization.
      required: [organization_id, outcome, changes, count]
      properties:
        organization_id:
          $ref: '#/components/schemas/ksuid'
        outcome:
          $ref: '#/components/schemas/LicenseMigrationOutcome'
        previous_template_id:
          allOf:
          - $ref: '#/components/schemas/ksuid'
          description: >-
            The template the organization held before this run. Absent when it
            held no license — this run granted its first, rather than moving
            it.
        changes:
          type: array
          description: >-
            What the run actually did to this organization's license, one
            field at a time, ordered by name. `license_value` is the value held
            before, `template_value` the value held after. A field carried
            forward under `CARRY_FORWARD` does not appear, because it did not
            move. An organization granted a first license reports every field
            the target names, since none was held before. Empty when nothing
            changed.
          items:
            $ref: '#/components/schemas/LicenseFieldDifference'
        count:
          type: integer
          description: The number of entries in `changes`.
        error:
          allOf:
          - $ref: '#/components/schemas/ApiError'
          description: Present when `outcome` is `FAILED`, absent otherwise.

    OrganizationLicenseMigrationResponse:
      type: object
      description: >-
        The receipt for one migration run: every organization it considered and
        what happened to each. Results are ordered by organization identifier.
      required:
      - template_id
      - migrated_at
      - results
      - count
      - changed
      - unchanged
      - failed
      properties:
        template_id:
          allOf:
          - $ref: '#/components/schemas/ksuid'
          description: The template every changed organization now holds.
        migrated_at:
          type: string
          format: date-time
          description: >-
            The single moment stamped on every organization this run set, and
            recorded as `changed_at` on every history entry it appended.
            Together with `template_id` it identifies the run.
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationLicenseMigrationResult'
        count:
          type: integer
          description: The number of organizations considered.
        changed:
          type: integer
        unchanged:
          type: integer
        failed:
          type: integer

    OrganizationLicenseFilter:
      type: object
      description: >-
        Narrows a search over a product's organizations and the licenses they
        hold.
      properties:
        organization_ids:
          type: array
          items:
            $ref: '#/components/schemas/ksuid'
          x-go-type-skip-optional-pointer: true
        license_template_ids:
          type: array
          items:
            $ref: '#/components/schemas/ksuid'
          description: >-
            Keep only organizations whose license names one of these templates.
            An archived template is accepted, and asking for one is how an
            operator finds the customers still on a withdrawn tier.
          x-go-type-skip-optional-pointer: true
        licensed:
          type: boolean
          nullable: true
          description: >-
            `true` keeps only organizations that hold a license, `false` only
            those that hold none. Omit for both.

    OrganizationLicenseSortField:
      type: string
      enum: [organization_name, instantiated_at]
      default: organization_name
      description: >-
        Field to sort by. `instantiated_at` puts organizations holding no
        license last, because they were never stamped, in both directions.
      x-go-type: license.SortFieldOrganizationLicense
      x-go-type-import:
        path: anchor/internal/domain/license

    OrganizationLicenseSearchRequest:
      allOf:
      - $ref: '#/components/schemas/SearchRequest'
      - type: object
        properties:
          filter:
            $ref: '#/components/schemas/OrganizationLicenseFilter'
          sort_by:
            $ref: '#/components/schemas/OrganizationLicenseSortField'

    OrganizationLicenseSummaryResponse:
      type: object
      description: >-
        One of the product's organizations and the license it holds, if any.
        The organization is the subject: one that has never been licensed is
        listed with `license` absent rather than omitted from the results,
        because an unlicensed customer is exactly what an operator is looking
        for half the time.
      required: [organization_id, organization_name]
      properties:
        organization_id:
          $ref: '#/components/schemas/ksuid'
        organization_name:
          type: string
        license:
          allOf:
          - $ref: '#/components/schemas/OrganizationLicenseResponse'
          nullable: true
          description: >-
            Absent when the organization holds no license. `usage` is never
            populated here — deriving it per row would make a page of results
            as expensive as a page of license reads.

    OrganizationLicenseSearchResponse:
      allOf:
      - $ref: '#/components/schemas/PagedListResponse'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/OrganizationLicenseSummaryResponse'
        required:
        - items

    OrganizationLicenseHistoryResponse:
      allOf:
      - $ref: '#/components/schemas/PagedListResponse'
      - type: object
        properties:
          items:
            type: array
            description: Newest first.
            items:
              $ref: '#/components/schemas/OrganizationLicenseChangeResponse'
        required:
        - items

    OrganizationLicenseHistoryFilter:
      type: object
      description: Narrows the history of one organization's license.
      properties:
        types:
          type: array
          items:
            $ref: '#/components/schemas/LicenseChangeType'
          description: Keep only entries of one of these types.
          x-go-type-skip-optional-pointer: true
        changed_after:
          type: string
          format: date-time
          description: Keep only entries made at or after this instant.
        changed_before:
          type: string
          format: date-time
          description: Keep only entries made before this instant.
    OrganizationLicenseHistorySearchRequest:
      allOf:
      - $ref: '#/components/schemas/SearchRequest'
      - type: object
        properties:
          filter:
            $ref: '#/components/schemas/OrganizationLicenseHistoryFilter'
          sort_by:
            type: string
            enum:
            - changed_at
            default: changed_at
            description: Field to sort by.
            x-go-type: license.SortFieldChange
            x-go-type-import:
              path: anchor/internal/domain/license
    UsageReportRequest:
      type: object
      description: >-
        One absolute snapshot of what an organization has used. Report as often
        as you like — the cadence is your decision, not a contract shared with
        Anchor. Anchor stores every report and never adds them together, so a
        retry cannot double-count, and a report that never arrived corrects
        itself on the next one.
      required: [key, value]
      properties:
        key:
          type: string
          maxLength: 120
          description: >-
            The license field this value is measured against. The product's
            license schema must declare it, and it must be a limit. A boolean
            feature toggle carries no usage. The field also declares a usage
            shape — GAUGE or WINDOWED_COUNTER — and this report must carry a
            window if and only if the field is WINDOWED_COUNTER.
        value:
          type: number
          format: double
          minimum: 0
          # A pointer on the server only, so an omitted or null value is told
          # apart from a reported 0. Zero is a real observation, so no validate
          # tag can catch the omission. The client spec drops this hint and
          # keeps a plain float64.
          x-go-type: '*float64'
          description: >-
            The total right now, not the change since the last report. It must
            be a finite, non-negative number. That is the only bound. A value
            past the organization's limit is accepted and stored, because
            refusing it would hide the fact that the limit was passed.
        from:
          type: string
          format: date-time
          description: >-
            Send no window at all to report a gauge: "37 flows exist right
            now", a number that rises and falls. Send `from` to report a counter
            over the half-open period [from, to): "412 runs between August 14
            and September 14". Start a new window to reset the counter.

            The period is two timestamps rather than a formatted string,
            because real billing periods follow the subscription anniversary
            rather than the calendar.
        to:
          type: string
          format: date-time
          description: >-
            The exclusive end of the period. It must come after `from`, and no
            more than one year after it.

            Omit it to mean now. "412 runs since August 14" is a complete
            statement, and sending a timestamp that means "now" only invites
            clock skew. Anchor fills the value in and returns it.

            Sending `to` without `from` is refused. There is nothing to run
            from.

    UsageObservationResponse:
      type: object
      description: >-
        One stored usage report. An observation is immutable. A correction is a
        new observation, never an edit of this one.
      required:
      - id
      - product_id
      - organization_id
      - key
      - value
      - observed_at
      properties:
        id:
          $ref: '#/components/schemas/ksuid'
        product_id:
          $ref: '#/components/schemas/ksuid'
        organization_id:
          $ref: '#/components/schemas/ksuid'
        key:
          type: string
          description: The license field this value was measured against.
        value:
          type: number
          format: double
        from:
          type: string
          format: date-time
          description: >-
            Both `from` and `to` are absent on a gauge, and both are present on
            a windowed counter. A report that sent `from` alone reads back with
            the `to` Anchor filled in, so a reader never meets half a window.
        to:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
          description: >-
            When Anchor accepted the report. Anchor sets it, so a consumer
            cannot backdate a report or write into the future.

    UsageGranularity:
      type: string
      enum: [MINUTE, HOUR, DAY]
      description: >-
        Which level of the continuous-aggregate cascade to read. Every level
        reports the last observation per bucket — never a sum or an average,
        because the underlying values are snapshots and the last one in a
        bucket already is the bucket's value. Finer levels are retained for a
        shorter time than coarser ones; see
        docs/adr/0005-timescaledb-for-usage-history.md.
      x-go-type: license.UsageGranularity
      x-go-type-import:
        path: anchor/internal/domain/license

    UsageSeriesPointResponse:
      type: object
      description: One bucket of an organization's usage series.
      required: [bucket, value]
      properties:
        bucket:
          type: string
          format: date-time
          description: The start of this bucket, at the requested granularity.
        value:
          type: number
          format: double
          description: The last observation's value in this bucket.
        from:
          type: string
          format: date-time
          description: >-
            Present when the observation the bucket was built from was a
            windowed counter, absent for a gauge — carried through the
            aggregate unchanged from the underlying report.
        to:
          type: string
          format: date-time

    UsageSeriesResponse:
      allOf:
      - $ref: '#/components/schemas/PagedListResponse'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/UsageSeriesPointResponse'
        required:
        - items

  responses:
    BadRequest:
      description: >-
        The request is well-formed HTTP but the server will not process it. An
        entity named in the request body or the query string does not resolve, a
        field failed validation, or a non-credential header is absent or
        malformed. The `code` field says which.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Unauthorized:
      description: >-
        The request carried no credential, or one that failed to authenticate:
        absent, malformed, expired, revoked, or wrong. Authentication is the
        subject. Permissions are not consulted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Forbidden:
      description: >-
        The request authenticated, and the principal is not permitted to perform
        it. A resource outside the caller's tenant answers 404 rather than 403,
        so this status never confirms that an identifier names a real
        resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NotFound:
      description: >-
        A resource named in the URI path does not resolve. Every path segment
        counts: on a nested path, either identifier being absent answers this.
        The method does not enter the decision, so a custom action answers it
        exactly as the read does.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Conflict:
      description: >-
        The request is well-formed and the target exists, and current state
        refuses it. A later or different request can succeed — after a refresh,
        after capacity is freed, or after a licensed limit is raised.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    LicensingWriteConflict:
      description: >-
        Current state refuses this write. When another licensing write or template
        sync is running for this product, returns LICENSING_WRITE_IN_PROGRESS:
        "Another licensing update is in progress for this product. Please try again shortly."
        The competing request is rejected without changing state; retry after the
        current operation finishes. Other products, reads and usage reports are
        unaffected. A migration holds the lock for its entire run while keeping
        each organization's write in its own transaction. Instantiating a license,
        including creating an organization with one, does not take this lock: it
        holds the template it copies until it commits, so a write to that template
        waits for it instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    TooManyRequests:
      description: >-
        The caller sent more requests than the window allows. Retrying later
        succeeds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    AccessDecisionsUnavailable:
      description: >-
        `ACCESS_DECISIONS_UNAVAILABLE`: the relationship store could not answer
        right now, so no decision was made. Retrying later succeeds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    InternalServerError:
      description: >-
        The server failed for a reason the caller could not have influenced.
        The `code` is `UNEXPECTED_ERROR` unless the failure is a modelled
        operational outcome that carries its own stable code.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

paths:
  # --- Auth API for platform ---
  /v1/auth/logout:
    post:
      security:
      - {}
      - platformBearerAuth: []
      summary: User logout
      description: |
        Ends the session the bearer access token belongs to. Every refresh token
        of that session is refused from then on, so a later `POST /v1/auth/refresh`
        with one of them answers 401. The user's other sessions, on other devices,
        stay signed in.

        The access token may be expired: its signature is checked, its expiry is
        not, so a client whose access token has lapsed can still end its session.
        The access token itself stays valid until it expires.

        Authentication is optional. Without a bearer token, or with one that does
        not verify, nothing is revoked and the response is still 204, so a client
        can always clear its state.
      operationId: logout
      tags:
      - Authentication
      responses:
        "204":
          description: |
            Successfully logged out.
            The refresh token cookie is removed.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: |
                Header used to remove the refresh token cookie
                by setting an expired value for the cookie.
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/auth/login:
    post:
      security: []
      summary: User login
      description: Allows users to login to the system and receive an 
        authentication token.
      operationId: login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/refresh:
    post:
      security: []
      summary: Refresh token
      description: |
        Exchanges a refresh token for a new access token and a new refresh token.
        The presented refresh token is rotated: use the new one for the next refresh.

        A rotated refresh token is accepted again only within a short grace period
        after its rotation, so concurrent refreshes from several tabs all succeed.
        Presented after the grace period, it is treated as stolen: the whole
        session is revoked and every refresh token of it answers 401.

        A refresh token answers 401 once it is expired, rotated past the grace
        period, or belongs to a session ended by logout or by deleting the
        platform user.

        By default, a refresh token expires after 7 days without a refresh, and
        a session lasts at most 30 days from the password login that started it, however
        often it refreshes. The `refresh_token` cookie expires with the token.
      operationId: refresh-token
      tags:
      - Authentication
      parameters:
      - in: cookie
        name: refresh_token
        schema:
          type: string
        description: Refresh token cookie to refresh the authentication token.
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized
          headers:
            Set-Cookie:
              schema:
                type: string
  /v1/auth/register:
    post:
      security: []
      summary: User registration
      description: Allows new users to register and receive an authentication 
        token.
      operationId: register
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/me:
    get:
      security:
      - platformBearerAuth: []
      summary: Get current user
      description: Retrieves the current logged-in user.
      operationId: get-current-user
      tags:
      - User
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  # PLATFORM RELATED API
  # --- Product Management (Platform Admin Auth) ---
  /v1/products:
    post:
      summary: Create Product
      description: Creates a new product within the PlatformTenant (single 
        tenantservice in OS V1). Requires Platform Bearer token.
      operationId: createProduct
      tags: [Product]
      security:
      - platformBearerAuth: []
      requestBody:
        description: Product details.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "201":
          description: Product created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/products/search:
    post:
      summary: Search Products
      description: >-
        Searches for products based on criteria. Requires Platform  Bearer token.

        Default order is `created_at` ascending, then `id`. Every order ends with `id`, so a page never skips or repeats a row. Page with a cursor: send the `next_cursor` of the previous response as `pagination.cursor`; an absent `next_cursor` marks the last page.
      operationId: searchProducts
      tags: [Product]
      security:
      - platformBearerAuth: []
      requestBody:
        description: Search criteria.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductSearchRequest"
      responses:
        "200":
          description: List of matching products.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/products/{product_id}:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"

    get:
      summary: Get Product
      description: Retrieves details of a specific product. Requires Platform 
        Bearer token.
      operationId: getProduct
      tags: [Product]
      security:
      - platformBearerAuth: []
      responses:
        "200":
          description: Product details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update Product
      description: Updates a product with a full representation. Requires
        Platform Bearer token.
      operationId: updateProduct
      tags: [Product]
      security:
      - platformBearerAuth: []
      requestBody:
        description: Full product representation (name required).
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "200":
          description: Product updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Delete Product
      description: >-
        Deletes a product. This is a destructive operation. Requires Platform
        Bearer token. Protected products return 409 with PRODUCT_PROTECTED;
        disable config.protected before deleting.
      operationId: deleteProduct
      tags: [Product]
      security:
      - platformBearerAuth: []
      responses:
        "204":
          description: Product deleted successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/products/{product_id}/events/catalog:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    get:
      summary: Get Product Events Catalog
      description: >-
        Returns all registered internal and integration events available for
        webhook subscriptions. Internal events are grouped by Anchor area;
        integration events are grouped by provider.

        Not a search. This is a static catalog compiled into the binary, not a stored collection, so it returns every event at once.
      operationId: getProductEventsCatalog
      tags: [Product]
      security:
      - platformBearerAuth: []
      responses:
        "200":
          description: Available events catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEventsCatalogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  # --- Integration Instance Management (Platform Admin Auth) ---
  /v1/products/{product_id}/integrations:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"

    post:
      summary: Create Integration Instance
      description: |-
        Creates a new integration instance for the specified product and provider type.
        Only one instance per provider type is allowed per product.
        Requires Platform Bearer token.
      operationId: createIntegrationInstance
      tags: [Integration]
      security:
      - platformBearerAuth: []
      requestBody:
        description: Integration instance details (provider type, optional 
          config).
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationInstanceCreateRequest"
      responses:
        "201":
          description: Integration instance created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationInstanceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      summary: List Integration Instances
      description: |-
        Lists all integration instances for the specified product.
        Requires Platform Bearer token.
        Not a search. A product has at most one integration instance per provider, so the list is bounded by the number of providers and returns every instance.
