          type: string
          description: SMTP server hostname (e.g. smtp.protonmail.ch)
        port:
          type: integer
          description: SMTP port (587 for STARTTLS, 465 for TLS)
          default: 587
        encryption:
          type: string
          enum: [STARTTLS, TLS, NONE]
          default: STARTTLS
        auth_method:
          type: string
          enum: [PLAIN, LOGIN]
          default: PLAIN
        username:
          type: string
          description: SMTP authentication username (usually your email address)
        password:
          type: string
          description: SMTP password or app token. Write-only — leave blank to keep existing value.
        from_address:
          type: string
          description: From email address for outgoing mail
        from_name:
          type: string
          description: Display name for the From field
        reply_to:
          type: string
          description: Optional Reply-To address
      additionalProperties: false
