          $ref: "#/components/schemas/ksuid"
          description: Unique identifier for the organization (e.g., prefix 
            'org_').
          examples: ["org_3iXYZ..."]
        product_id:
          $ref: "#/components/schemas/ksuid"
          description: ID of the Product this organization belongs to.
          examples: ["prod_2iABC..."]
        name:
          type: string
          description: Name of the organization.
          examples: ["Acme Corporation"]
        description:
          type: [string, "null"]
          description: Description of the organization.
          examples: ["Leading provider of innovative solutions."]
        metadata:
          $ref: "#/components/schemas/Metadata"
          description: Key-value metadata for the organization.
