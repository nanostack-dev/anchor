      type: object
      properties:
        product_user_id:
          $ref: "#/components/schemas/ksuid"
          description: ID of the product user to assign as founding member.
          examples: ["pusr_3iXYZ..."]
        role_id:
          $ref: "#/components/schemas/ksuid"
          description: >-
            Role to assign to the founding member. It must be a role the Product
            manages: a new Organization has no custom role yet. Any other role
            answers 400 ROLE_NOT_FOUND_IN_REQUEST. Omit it to make the founding
            member a member with no role and no permission.
          examples: ["product_role_3A0Yy5f38miFJl65gf4ldxVmWKh"]
      required:
