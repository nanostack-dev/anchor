    AccessResourceType:
      type: string
      description: >-
        `organization`, the built-in `workspace`, or any resource type slug the product declares, such as `document`.
        A type the product has not declared is denied with `RESOURCE_TYPE_NOT_FOUND`. Until workspaces move into the
        generic resource model, `workspace` always names the built-in workspace, even when the product declares a
