  # --- ProductUser Management ---
  /v1/products/{product_id}/product-users:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"

    post:
      summary: Create Product User
      description: |-
        Creates a new user record associated with the specified Product.
        This only creates the user profile; Anchor never authenticates the user.
        A product that is its own identity provider sends `external_id`, its own ID for the user,
        and then names the user by that ID in access evaluation.
        A 409 is `PRODUCT_USER_EMAIL_ALREADY_EXISTS` when another user of the product has the email,
        or `PRODUCT_USER_EXTERNAL_ID_ALREADY_EXISTS` when another user of the product has the external ID.
        Requires an API Key with `product_user:create` permission.
      operationId: createProductUser
      tags: [ProductUser]
      security:
      - productApiKeyAuth: ["product_user:create"]
      requestBody:
        description: Product user details (email required, name/status/external_id 
          optional).
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  x-go-type: string
                  description: User's email address. Must be unique within the 
                    Product.
                  examples: ["new.user@company.com"]
                name:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 100
                  description: User's display name.
                  examples: ["New User"]
                status:
                  $ref: "#/components/schemas/ProductUserStatus"
                  description: Initial status (e.g., 'active' or 'invited'). 
                    Defaults might apply.
                external_id:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: "^[ -~]+$"
                  description: |-
                    The user's ID in the product's own identity provider. Access evaluation names the user by this ID (`subject.type: user`).
                    Optional. Without it the user has no external ID until an identity provider integration (Clerk) syncs one, and access evaluation cannot name the user.
                    Printable ASCII only (space to `~`). Unique within the product and compared exactly: letter case and spaces count. A blank value, a value longer than 255 characters, or a value with another character is refused with 400 `VALIDATION_ERROR`. An ID that another user of the product holds is refused with 409 `PRODUCT_USER_EXTERNAL_ID_ALREADY_EXISTS`.
                    Set on create only. No operation changes it later, because a new ID would point every access decision made for the old ID at another person. To change it, delete the user and create it again.
                    A Clerk integration of the same product uses the same IDs. A user created with a Clerk user ID is the user that Clerk ingest then updates and deletes: each Clerk event replaces the email and name with Clerk's values (an empty Clerk name clears it) and sets the user active.
                  examples: ["usr_01JB7Z3K9Q"]
              required:
              - email
      responses:
        "201":
          description: Product user created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest" # Validation errors
        "401":
          $ref: "#/components/responses/Unauthorized" # Invalid/missing API Key
        "403":
          $ref: "#/components/responses/Forbidden" # API Key lacks permission
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/products/{product_id}/product-users/search:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"

    post:
      summary: Search Product Users
      description: |-
        Retrieves a list of users associated with the specified Product,
        allowing filtering and pagination. Requires API Key with `product_user:read` permission or Platform Bearer token.
        Default order is `created_at` ascending, then `id`. A user without a `name` sorts after every named user when ascending and before them when descending. Page with a cursor: send the `next_cursor` of the previous response as `pagination.cursor`; an absent `next_cursor` marks the last page.
      operationId: searchProductUsers
      tags: [ProductUser]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["product_user:read"]
      requestBody:
        description: Search criteria.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUserSearchRequest"
      responses:
        "200":
          description: A list of product users for the product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductUserListResponse"
        "400":
          $ref: "#/components/responses/BadRequest" # Invalid search/pagination params
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/products/{product_id}/product-users/{product_user_id}:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    - $ref: "#/components/parameters/ProductUserIdParameter"
    get:
      summary: Get Product User
      description: |-
        Retrieves details of a specific product user within the specified Product.
        Requires API Key with `product_user:read` permission.
      operationId: getProductUser
      tags: [ProductUser]
      security:
      - productApiKeyAuth: ["product_user:read"]
      responses:
        "200":
          description: Product Product User details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden" # Includes case where User doesn't belong to API Key's Product
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete Product User
      description: |-
        Deletes a product user record. This may cascade to remove memberships.
        Requires API Key with `product_user:delete` permission.
      operationId: deleteProductUser
      tags: [ProductUser]
      security:
      - productApiKeyAuth: ["product_user:delete"]
      responses:
        "204":
          description: Product user deleted successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
