      responses:
        "200":
          description: Matching resources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/products/{product_id}/organizations/{organization_id}/resources/{resource_type}/{resource_id}:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    - $ref: "#/components/parameters/OrganizationIdParameter"
    - $ref: "#/components/parameters/ResourceTypePathParameter"
    - $ref: "#/components/parameters/ResourceIdParameter"
    put:
      summary: Register Resource
      description: >-
        Registers a resource of the product under its parent, renames it or
        moves it. The call is idempotent: the same body twice leaves one
        resource and changes nothing the second time. Register a resource only
        when a role is held on it, together with the ancestors it hangs from;
        any other item is checked by naming its parent. Parents register before
        their children.

        The parent must be one of the type's parent types, or the type itself
        when it nests in itself, and must be registered in the same
        Organization. A resource can't move under itself or under one of its
        descendants. A chain is at most 15 levels deep, counting the
        Organization. A move carries the resource's whole subtree, and the
        depth rule applies to its deepest descendant.

        Emits `resource.created` or `resource.updated`, which stay inside
        Anchor and are never delivered to the product's event endpoint.
        Requires Product API Key with resource:write.
      operationId: putResource
      tags: [Resource]
      security:
      - productApiKeyAuth: ["resource:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourcePutRequest"
            examples:
              topLevel:
                summary: A project directly under its Organization
                value: { "name": "Website redesign", "parent": { "type": "organization", "id": "org_2qL9aC3mE8xP1rT6vN4bK2sJ" } }
              nested:
                summary: A folder inside a project
                value: { "name": "Design", "parent": { "type": "project", "id": "9f1c2a4e-6b3d-4c8e-a1f0-2d7e5b9c3a11" } }
      responses:
        "200":
          description: The resource after the call, whether it was created, renamed, moved or left as it was.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceResponse"
              example:
                type: folder
                id: 3b7e91d2-0c4a-4f6e-9d21-8a5c7e4b2f60
                organization_id: org_2qL9aC3mE8xP1rT6vN4bK2sJ
                name: Design
                parent: { type: project, id: 9f1c2a4e-6b3d-4c8e-a1f0-2d7e5b9c3a11 }
                created_at: "2026-10-24T09:20:02Z"
                updated_at: "2026-10-24T09:20:02Z"
        "400":
          description: >-
            The body or the identifier is refused. `INVALID_RESOURCE_PARENT`:
            the parent's type is not one this type may sit under.
            `INVALID_RESOURCE_ID`: the identifier holds a character outside the
            allowed set. `VALIDATION_ERROR`: a field is missing or too long.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                invalidParent:
                  summary: A document can't sit directly in the Organization
                  value:
                    errors:
                    - code: INVALID_RESOURCE_PARENT
                      message: "A resource of type document can't sit under one of type organization. Its parent is of type folder or project."
                      metadata: { resource_type: document, parent_type: organization, allowed_parent_types: [folder, project] }
                invalidId:
                  summary: The identifier holds a slash
                  value:
                    errors:
                    - code: INVALID_RESOURCE_ID
                      message: "A resource ID holds 1 to 200 letters, digits, '.', '_', '~' or '-', and is not '.' or '..'."
                      metadata: { id: "a b" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            `RESOURCE_TYPE_NOT_FOUND`: the product has not declared the type in
            the path. `RESOURCE_TYPE_NOT_REGISTRABLE`: the path names
            `organization`. `ORGANIZATION_NOT_FOUND`: the product has no such
            Organization, or it was deleted while the call ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                unknownType:
                  summary: The type in the path is not declared
                  value:
                    errors:
                    - code: RESOURCE_TYPE_NOT_FOUND
                      message: This product has no resource type with that slug.
                      metadata: { resource_type: spreadsheet }
                notRegistrable:
                  summary: The path names the organization type
                  value:
                    errors:
                    - code: RESOURCE_TYPE_NOT_REGISTRABLE
                      message: "Organizations are managed through the organization routes and are never registered as resources."
        "409":
          description: >-
            The registry refuses the change in its current state.
            `PARENT_NOT_REGISTERED`: register the parent first.
            `RESOURCE_CYCLE`: the resource would sit under itself.
            `RESOURCE_TOO_DEEP`: the chain would pass 15 levels, counting the
            Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                parentNotRegistered:
                  summary: The parent is not registered in this Organization
                  value:
                    errors:
                    - code: PARENT_NOT_REGISTERED
                      message: Register the parent before its children.
                      metadata: { parent: { type: project, id: 9f1c2a4e-6b3d-4c8e-a1f0-2d7e5b9c3a11 } }
                cycle:
                  summary: A folder can't move into its own subfolder
                  value:
                    errors:
                    - code: RESOURCE_CYCLE
                      message: "The new parent is inside this resource, so the resource can't move under it."
                      metadata: { chain: ["folder:c41d8e07-52b9-4a3f-bc18-6e0f9d2a7c45", "folder:3b7e91d2-0c4a-4f6e-9d21-8a5c7e4b2f60"] }
                tooDeep:
                  summary: A sixteenth level
                  value:
                    errors:
                    - code: RESOURCE_TOO_DEEP
                      message: "A resource chain may be at most 15 levels deep, counting the organization. This one would be 16."
                      metadata: { max_depth: 15, depth: 16 }
    get:
      summary: Get Resource
      description: >-
        Reads a registered resource by its type and the product's identifier.
        Requires Platform Bearer token or Product API Key with resource:read.
      operationId: getResource
      tags: [Resource]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["resource:read"]
      responses:
        "200":
          description: The resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            `RESOURCE_NOT_FOUND`: no resource of that type and identifier is
            registered in the Organization. `RESOURCE_TYPE_NOT_FOUND`,
            `RESOURCE_TYPE_NOT_REGISTRABLE` and `ORGANIZATION_NOT_FOUND` as on
            the registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                notRegistered:
                  summary: Nothing registered under that identity
                  value:
                    errors:
                    - code: RESOURCE_NOT_FOUND
                      message: This organization has no registered resource of that type and identifier.
                notRegistrable:
                  summary: The path names the organization type
                  value:
                    errors:
                    - code: RESOURCE_TYPE_NOT_REGISTRABLE
                      message: "Organizations are managed through the organization routes and are never registered as resources."
    delete:
      summary: Delete Resource
      description: >-
        Deletes a registered resource. A resource with registered children or
        role assignments answers 409 RESOURCE_IN_USE with the counts, unless
        `cascade=true`, which deletes the resource, its whole subtree and every
        role assignment held on them in one transaction. Emits one
        `resource.role_assignment.deleted` per role assignment removed, then
        one `resource.deleted` per deleted resource, deepest first. The
        `resource.deleted` events stay inside Anchor and are never delivered to
        the product's event endpoint. Requires Product API Key with
        resource:delete.
      operationId: deleteResource
      tags: [Resource]
      security:
      - productApiKeyAuth: ["resource:delete"]
      parameters:
      - name: cascade
        in: query
        required: false
        description: "`true` also deletes every registered descendant and every role assignment on them. Absent means `false`."
        schema:
          type: boolean
          default: false
      responses:
        "204":
          description: Resource deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            `RESOURCE_NOT_FOUND`, `RESOURCE_TYPE_NOT_FOUND`,
            `RESOURCE_TYPE_NOT_REGISTRABLE` and `ORGANIZATION_NOT_FOUND` as on
            the read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: >-
            `RESOURCE_IN_USE`: the resource still has registered children or
            role assignments. `metadata.children` counts its direct children
            and `metadata.role_assignments` the roles held on it. Send
            `cascade=true` to delete them too.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                inUse:
                  summary: A folder that still holds a subfolder
                  value:
                    errors:
                    - code: RESOURCE_IN_USE
                      message: "This resource still has 1 registered child and 0 role assignments. Send cascade=true to delete them too."
                      metadata: { children: 1, role_assignments: 0 }
  /v1/products/{product_id}/organizations/{organization_id}/resources/{resource_type}/{resource_id}/members/search:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    - $ref: "#/components/parameters/OrganizationIdParameter"
    - $ref: "#/components/parameters/ResourceTypePathParameter"
    - $ref: "#/components/parameters/ResourceIdParameter"
    post:
      summary: Search Resource Members
      description: >-
        Searches the members holding a role on one registered resource. Filter
        by product user or by role. Roles inherited from the Organization or
        from a parent resource are not listed: only the roles held on this
        resource are. Requires Platform Bearer token or Product API Key with
        resource:read.

        Default order is `created_at` ascending, then `product_user_id`. Page with a cursor: send the `next_cursor` of the previous response as `pagination.cursor`; an absent `next_cursor` marks the last page.
      operationId: searchResourceMembers
      tags: [Resource]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["resource:read"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceMemberSearchRequest"
      responses:
        "200":
          description: Matching members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceMemberListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/products/{product_id}/organizations/{organization_id}/resources/{resource_type}/{resource_id}/members/{product_user_id}:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    - $ref: "#/components/parameters/OrganizationIdParameter"
    - $ref: "#/components/parameters/ResourceTypePathParameter"
    - $ref: "#/components/parameters/ResourceIdParameter"
    - name: product_user_id
      in: path
      required: true
      description: A member of the Organization.
      schema:
        $ref: "#/components/schemas/ksuid"
    put:
      summary: Assign Resource Roles
      description: >-
        Sets the roles a member of the Organization holds on one registered
        resource, replacing the ones they held there before. The same body
        twice changes nothing the second time.

        `role_ids` holds exactly one role: a product allows one role per member
        per resource. Each role is one of the Organization's roles, scoped to
        the resource's type; a role template's ID names the Organization's copy
        of it. Removing the member from the Organization removes their roles on
        every resource of it.

        Emits `resource.role_assignment.created` when the member held no role
        on the resource, `resource.role_assignment.updated` when the role
        changed, and nothing when it did not. Requires Product API Key with
        resource_member:write.
      operationId: putResourceMember
      tags: [Resource]
      security:
      - productApiKeyAuth: ["resource_member:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceMemberPutRequest"
            example: { "role_ids": ["role_2qLBedXr4kT9vN2xQ6pK1wAbCdEf"] }
      responses:
        "200":
          description: The member's roles on the resource after the call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceMemberResponse"
              example:
                product_user_id: pusr_2qLAm9yQ4cH7eN1xK8rT3vZAbCd
                roles: [{ id: role_2qLBedXr4kT9vN2xQ6pK1wAbCdEf, name: Folder editor }]
                created_at: "2026-10-24T10:02:44Z"
                updated_at: "2026-10-24T10:02:44Z"
        "400":
          description: >-
            The body is refused. `SINGLE_ROLE_PER_RESOURCE`: more than one role
            ID. `ROLE_NOT_FOUND_IN_REQUEST`: a role ID names no role of the
            Organization nor a role template of the product.
            `ROLE_SCOPE_MISMATCH`: the role is scoped to another type than the
            resource; an Organization role is held through the membership.
            `VALIDATION_ERROR`: `role_ids` is missing, empty or longer than
            10.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                singleRole:
                  summary: Two roles on one resource
                  value:
                    errors:
                    - code: SINGLE_ROLE_PER_RESOURCE
                      message: "This product allows one role per member per resource. Send exactly one role ID."
                      metadata: { max_roles: 1, role_ids: 2 }
                scopeMismatch:
                  summary: A project role on a folder
                  value:
                    errors:
                    - code: ROLE_SCOPE_MISMATCH
                      message: "Role role_2qLBedXr4kT9vN2xQ6pK1wAbCdEf is scoped to project, so it can't be held on a folder."
                      metadata: { role_id: role_2qLBedXr4kT9vN2xQ6pK1wAbCdEf, role_resource_type: project, resource_type: folder }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            `ORGANIZATION_MEMBERSHIP_NOT_FOUND`: the product user is not a
            member of the Organization. `RESOURCE_NOT_FOUND`,
            `RESOURCE_TYPE_NOT_FOUND`, `RESOURCE_TYPE_NOT_REGISTRABLE` and
            `ORGANIZATION_NOT_FOUND` as on the resource routes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                notAMember:
                  summary: The product user is not a member
                  value:
                    errors:
                    - code: ORGANIZATION_MEMBERSHIP_NOT_FOUND
                      message: This organization has no membership for that product user
    get:
      summary: Get Resource Member
      description: >-
        Reads the roles a member holds on one registered resource. Roles
        inherited from the Organization or from a parent resource are not
        listed. Requires Platform Bearer token or Product API Key with
        resource:read.
      operationId: getResourceMember
      tags: [Resource]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["resource:read"]
      responses:
        "200":
          description: The member's roles on the resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceMemberResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            `RESOURCE_MEMBER_NOT_FOUND`: the product user holds no role on the
            resource. `RESOURCE_NOT_FOUND`, `RESOURCE_TYPE_NOT_FOUND` and
            `ORGANIZATION_NOT_FOUND` as on the resource routes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                noRole:
                  summary: No role held on the resource
                  value:
                    errors:
                    - code: RESOURCE_MEMBER_NOT_FOUND
                      message: This resource has no role assignment for that product user.
    delete:
      summary: Remove Resource Member
      description: >-
        Removes every role a member holds on one registered resource. The
        member stays in the Organization, and keeps the roles held on other
        resources. Emits one `resource.role_assignment.deleted` per role
        removed. Requires Product API Key with resource_member:write.
      operationId: deleteResourceMember
      tags: [Resource]
      security:
      - productApiKeyAuth: ["resource_member:write"]
      responses:
        "204":
          description: The member's roles on the resource are removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            `RESOURCE_MEMBER_NOT_FOUND`: the product user holds no role on the
            resource. `RESOURCE_NOT_FOUND`, `RESOURCE_TYPE_NOT_FOUND` and
            `ORGANIZATION_NOT_FOUND` as on the resource routes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /v1/products/{product_id}/organizations/{organization_id}/invitations:
    parameters:
    - $ref: '#/components/parameters/ProductIdParameter'
    - $ref: '#/components/parameters/OrganizationIdParameter'
    post:
      summary: Create Organization Invitation
      description: >-
        Invites an email address to join an organization with a role. Anchor
        sends no email and issues no token: the Product tells the person, and
        later finds the invitation by searching for the verified email address
        of the person who signed in. The invitation expires 7 days from now
        unless `expires_at` is given.
        The create fails with a conflict when a pending invitation exists for the
        same email address in the organization, or when the email address belongs
        to a member of the organization. Email addresses compare without regard
        to letter case. An expired invitation does not block a new one.
      operationId: createOrganizationInvitation
      tags:
      - OrganizationInvitation
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - organization_invitation:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInvitationCreateRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/products/{product_id}/organizations/{organization_id}/invitations/search:
    parameters:
    - $ref: '#/components/parameters/ProductIdParameter'
    - $ref: '#/components/parameters/OrganizationIdParameter'
    post:
      summary: Search Organization Invitations
      description: >-
        Lists the invitations of one organization, optionally filtered by
        status and email address. An invitation whose expiry has passed while it
        was pending reads and filters as `expired`.

        Default order is `created_at` ascending, then `id`. Page with a cursor: send the `next_cursor` of the previous response as `pagination.cursor`; an absent `next_cursor` marks the last page.
      operationId: searchOrganizationInvitations
      tags:
      - OrganizationInvitation
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - organization_invitation:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInvitationSearchRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvitationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/products/{product_id}/organizations/{organization_id}/invitations/{invitation_id}:
    parameters:
    - $ref: '#/components/parameters/ProductIdParameter'
    - $ref: '#/components/parameters/OrganizationIdParameter'
    - $ref: '#/components/parameters/OrganizationInvitationIdParameter'
    get:
      summary: Get Organization Invitation
      description: Reads one invitation by its id.
      operationId: getOrganizationInvitation
      tags:
      - OrganizationInvitation
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - organization_invitation:read
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update Organization Invitation
      description: >-
        Changes the role and the expiry of an invitation. Nothing else changes:
        the email address of an invitation is fixed. To fix a wrong address,
        delete the invitation and create a new one. Update works only on a
        pending invitation that has not expired: it fails with a conflict on an
        accepted invitation and on an expired invitation. For an expired
        invitation, create a new one. To give a pending invitation more time,
        update it with a later `expires_at`.
      operationId: updateOrganizationInvitation
      tags:
      - OrganizationInvitation
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - organization_invitation:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInvitationUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Delete Organization Invitation
      description: >-
        Deletes the invitation for good, so it can no longer be accepted.
        Anchor has no revoke: deleting is how a Product withdraws an
        invitation.
      operationId: deleteOrganizationInvitation
      tags:
      - OrganizationInvitation
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - organization_invitation:delete
      responses:
        '204':
          description: Successfully deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/products/{product_id}/organizations/{organization_id}/invitations/{invitation_id}/accept:
    parameters:
    - $ref: '#/components/parameters/ProductIdParameter'
    - $ref: '#/components/parameters/OrganizationIdParameter'
    - $ref: '#/components/parameters/OrganizationInvitationIdParameter'
    post:
      summary: Accept Organization Invitation
      description: >-
        Turns a pending invitation into a membership of the organization for an
        existing Product User, with the invited role. The membership and the
        accepted mark are written in one transaction. Accept never creates a
        Product User and never compares the email address of the Product User
        with the invitation email: the Product makes that check, against an
        email address it has verified. Accept fails and changes nothing with a
        bad request when the Product User does not exist in the Product. It
        fails with a conflict when the invitation is accepted already, when it
        is expired, or when the Product User is a member of the organization
        already.
      operationId: acceptOrganizationInvitation
      tags:
      - OrganizationInvitation
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - organization_invitation:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInvitationAcceptRequest'
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/products/{product_id}/invitations/search:
    parameters:
    - $ref: '#/components/parameters/ProductIdParameter'
    post:
      summary: Search Product Organization Invitations
      description: >-
        Lists the invitations of every organization of the Product, optionally
        filtered by status and email address. A Product calls it when a person
        signs in, with the verified email addresses of that person and the
        `pending` status, to show the invitations waiting for them. Email
