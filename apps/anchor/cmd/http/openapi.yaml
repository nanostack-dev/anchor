    # Organization Schemas
    ProductOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Name of the organization. Must be unique within the 
            Product.
          examples: ["Acme Corporation"]
        description:
          type: [string, "null"]
          maxLength: 500
          description: Optional description of the organization.
          examples: ["Leading provider of innovative solutions."]
        metadata:
          $ref: "#/components/schemas/Metadata"
          description: Optional key-value metadata for the organization.
        founding_member:
          $ref: "#/components/schemas/FoundingMemberRequest"
          description: >-
            Optional founding member assignment. When provided, organization creation
            and membership assignment happen atomically in one transaction.
        license:
          $ref: "#/components/schemas/OrganizationLicenseInstantiateRequest"
          description: >-
            Optional license to stamp onto the new organization. The template is
            read and then copied in the same transaction as the organization, so
            a template this product does not have is refused as a bad request
            before anything is written, and a template refused later leaves no
            organization behind. The copy is what the organization holds from
            then on, exactly as it is when the license route stamps it. Ignored
            when `founding_member` names a user who already belongs to an
            organization, because that call creates nothing.
      required:
      - name
