          description: Map of variable name to value

    TemplateExampleListRequest:
      type: object
      required: [examples]
      properties:
        examples:
          type: array
          items:
            $ref: '#/components/schemas/TemplateExample'

    TemplateExampleListResponse:
      type: object
      required: [examples]
      properties:
        examples:
          type: array
          items:
            $ref: '#/components/schemas/TemplateExample'

    EmailTemplatePreviewRequest:
      type: object
      properties:
        variables:
          type: object
          additionalProperties: true
        use_published:
          type: boolean
          default: false

    EmailTemplatePreviewResponse:
      type: object
      required: [subject, body_html, body_text, warnings]
      properties:
        subject:
          type: string
        body_html:
          type: string
        body_text:
          type: string
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal render issues (unknown vars, missing values, placeholders used).

    EmailSendRequest:
      type: object
      required: [to_address]
      properties:
        template_id:
          type: string
          nullable: true
        template_slug:
          type: string
          nullable: true
        to_address:
          type: string
          format: email
        to_name:
          type: string
        variables:
          type: object
          additionalProperties: true
        dedupe_key:
          type: string
          nullable: true
        use_draft:
          type: boolean
          default: false

    EmailSendRecordResponse:
      type: object
      required: [id, product_id, to_address, from_address, subject, status, attempts, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/ksuid'
        product_id:
          $ref: '#/components/schemas/ksuid'
        integration_instance_id:
          type: string
        template_id:
          type: string
          nullable: true
        template_version_id:
          type: string
          nullable: true
        dedupe_key:
          type: string
          nullable: true
        to_address:
          type: string
        to_name:
          type: string
        from_address:
          type: string
        from_name:
          type: string
        subject:
          type: string
        status:
          $ref: '#/components/schemas/EmailSendStatus'
        attempts:
          type: integer
        last_error:
          type: string
          nullable: true
        sent_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EmailSendRecordListResponse:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EmailSendRecordResponse'
        count:
          type: integer

  responses:
    BadRequest:
      description: Bad Request (e.g., validation error)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Unauthorized:
      description: Unauthorized (Authentication required or invalid)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Forbidden:
      description: Forbidden (Authenticated Product User lacks permission)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            errors: [{"code": "FORBIDDEN", "message": "Insufficient permissions."}]
    Conflict:
      description: Conflict (e.g., resource already exists)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NotFound:
      description: Resource Not Found

paths:
  # --- Auth API for platform ---
  /v1/auth/logout:
    post:
      security: []
      summary: User logout
      description: |
        Logs out the user and invalidates the refresh token.
        This endpoint does not require authentication to allow logout even with expired tokens.
      operationId: logout
      tags:
      - Authentication
      responses:
        "204":
          description: |
            Successfully logged out.
            The refresh token cookie is removed.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: |
                Header used to remove the refresh token cookie
                by setting an expired value for the cookie.
  /v1/auth/login:
    post:
      security: []
      summary: User login
      description: Allows users to login to the system and receive an 
        authentication token.
      operationId: login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/auth/refresh:
    post:
      security: []
      summary: Refresh token
      description: Refreshes the authentication token for the user.
      operationId: refresh-token
      tags:
      - Authentication
      parameters:
      - in: cookie
        name: refresh_token
        schema:
          type: string
        description: Refresh token cookie to refresh the authentication token.
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized
          headers:
            Set-Cookie:
              schema:
                type: string
  /v1/auth/register:
    post:
      security: []
      summary: User registration
      description: Allows new users to register and receive an authentication 
        token.
      operationId: register
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/me:
    get:
      security:
      - platformBearerAuth: []
      summary: Get current user
      description: Retrieves the current logged-in user.
      operationId: get-current-user
      tags:
      - User
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # PLATFORM RELATED API
  # --- Product Management (Platform Admin Auth) ---
  /v1/products:
    post:
      summary: Create Product
      description: Creates a new product within the PlatformTenant (single 
        tenantservice in OS V1). Requires Platform Bearer token.
      operationId: createProduct
      tags: [Product]
      security:
      - platformBearerAuth: []
      requestBody:
        description: Product details.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "201":
          description: Product created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/products/search:
    post:
      summary: Search Products
      description: Searches for products based on criteria. Requires Platform 
        Bearer token.
      operationId: searchProducts
      tags: [Product]
      security:
      - platformBearerAuth: []
      requestBody:
        description: Search criteria.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductSearchRequest"
      responses:
        "200":
          description: List of matching products.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/products/{product_id}:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"

    get:
      summary: Get Product
      description: Retrieves details of a specific product. Requires Platform 
        Bearer token.
      operationId: getProduct
      tags: [Product]
      security:
      - platformBearerAuth: []
      responses:
        "200":
          description: Product details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      summary: Update Product
      description: Updates a product with a full representation. Requires
        Platform Bearer token.
      operationId: updateProduct
      tags: [Product]
      security:
      - platformBearerAuth: []
      requestBody:
        description: Full product representation (name required).
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "200":
          description: Product updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Delete Product
      description: Deletes a product. This is a destructive operation. Requires 
        Platform Bearer token.
      operationId: deleteProduct
      tags: [Product]
      security:
      - platformBearerAuth: []
      responses:
        "204":
          description: Product deleted successfully.
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # --- Integration Instance Management (Platform Admin Auth) ---
  /v1/products/{product_id}/integrations:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"

    post:
      summary: Create Integration Instance
      description: |-
        Creates a new integration instance for the specified product and provider type.
        Only one instance per provider type is allowed per product.
        Requires Platform Bearer token.
      operationId: createIntegrationInstance
      tags: [Integration]
      security:
      - platformBearerAuth: []
      requestBody:
        description: Integration instance details (provider type, optional 
          config).
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationInstanceCreateRequest"
      responses:
        "201":
          description: Integration instance created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationInstanceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      summary: List Integration Instances
      description: |-
        Lists all integration instances for the specified product.
        Requires Platform Bearer token.
      operationId: listIntegrationInstances
      tags: [Integration]
      security:
      - platformBearerAuth: []
      responses:
        "200":
          description: List of integration instances.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationInstanceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/products/{product_id}/integrations/{integration_instance_id}:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    - $ref: "#/components/parameters/IntegrationInstanceIdParameter"

    get:
      summary: Get Integration Instance
      description: |-
        Retrieves details of a specific integration instance.
        Requires Platform Bearer token.
      operationId: getIntegrationInstance
      tags: [Integration]
      security:
      - platformBearerAuth: []
      responses:
        "200":
          description: Integration instance details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationInstanceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      summary: Update Integration Instance
      description: |-
        Updates an integration instance's webhook secret, config, or status.
        Requires Platform Bearer token.
      operationId: updateIntegrationInstance
      tags: [Integration]
      security:
      - platformBearerAuth: []
      requestBody:
        description: Fields to update.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationInstanceUpdateRequest"
      responses:
        "200":
          description: Integration instance updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationInstanceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Delete Integration Instance
      description: |-
        Deletes an integration instance. This removes the provider configuration
        and stops processing webhooks for this provider.
        Requires Platform Bearer token.
      operationId: deleteIntegrationInstance
      tags: [Integration]
      security:
      - platformBearerAuth: []
      responses:
        "204":
          description: Integration instance deleted successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/products/{product_id}/integrations/{integration_instance_id}/audit-logs:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    - $ref: "#/components/parameters/IntegrationInstanceIdParameter"

    get:
      summary: List Integration Audit Logs
      description: |-
        Lists audit log entries for a specific integration instance.
        Entries are returned in reverse chronological order (newest first).
        Requires Platform Bearer token.
      operationId: listIntegrationAuditLogs
      tags: [Integration]
      security:
      - platformBearerAuth: []
      responses:
        "200":
          description: List of audit log entries for the integration instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationAuditLogListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Webhook Ingress (Public, No Auth) ---
  /v1/products/{product_id}/integrations/webhooks/{provider_type}:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    - $ref: "#/components/parameters/ProviderTypeParameter"

    post:
      summary: Ingest Webhook
      description: |-
        Public endpoint for receiving webhook payloads from integration providers (e.g., Clerk).
        Authentication is handled via webhook signature validation (provider-specific).
        No bearer token or API key is required.
      operationId: ingestWebhook
      tags: [Integration]
      security: []
      requestBody:
        description: Raw webhook payload from the provider.
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: The raw webhook payload (provider-specific format).
      responses:
        "200":
          description: Webhook processed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationWebhookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Webhook signature validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Product Resource Permission Management ---
  # ProductResourcePermissions are domain-specific permissions defined by the
  # product owner for their own application resources. For example, if you are
  # building a Google Drive-like product you would define permissions such as
  # "document:read", "file:delete", "workspace:invite". These are distinct from
  # the built-in ProductPermissions that govern access to the product within
  # Anchor. Resource permissions are assigned to ProductRoles, which are
  # then attached to end-user organization memberships to control what those
  # users can do inside your product.
  /v1/products/{product_id}/resource-permissions:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    post:
      summary: Create Product Resource Permission
      description: >-
        Defines a new domain-resource permission for the product's own
        application resources (e.g. "document:read", "file:delete"). Requires
        Platform Bearer token or Product API Key with
        resources_permissions:create scope.
      operationId: createProductResourcePermission
      tags: [ProductResourcePermission]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["resources_permissions:create"]
      requestBody:
        description: Resource permission details.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductResourcePermissionRequest"
      responses:
        "201":
          description: Resource permission created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResourcePermissionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/products/{product_id}/resource-permissions/search:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    post:
      summary: Search Product Resource Permissions
      description: Searches for resource permissions within a product. Requires 
        Platform Bearer token or Product API Key with permissions:read.
      operationId: searchProductResourcePermissions
      tags: [ProductResourcePermission]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["resources_permissions:read"]
      requestBody:
        description: Search criteria.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductResourcePermissionSearchRequest"
      responses:
        "200":
          description: List of matching resource permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResourcePermissionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/products/{product_id}/resource-permissions/{permission_name}:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    - $ref: "#/components/parameters/ResourcePermissionNameParameter"
    get:
      summary: Get Product Resource Permission
      description: Retrieves details of a specific resource permission. Requires
        Platform Bearer token or Product API Key with permissions:read.
      operationId: getProductResourcePermission
      tags: [ProductResourcePermission]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["resources_permissions:read"]
      responses:
        "200":
          description: Resource permission details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResourcePermissionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      summary: Update Product Resource Permission
      description: Updates a resource permission's details. Requires Platform 
        Bearer token or Product API Key with permissions:update.
      operationId: updateProductResourcePermission
      tags: [ProductResourcePermission]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["resources_permissions:update"]
      requestBody:
        description: Updated resource permission details.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductResourcePermissionRequest"
      responses:
        "200":
          description: Resource permission updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResourcePermissionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Delete Product Resource Permission
      description: Deletes a resource permission. Cannot delete if assigned to 
        roles. Requires Platform Bearer token or Product API Key with 
        permissions:delete.
      operationId: deleteProductResourcePermission
      tags: [ProductResourcePermission]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["resources_permissions:delete"]
      responses:
        "204":
          description: Resource permission deleted successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  # Platform Invitation Management (Authenticated via Platform Bearer Token)
  /v1/platform-invitations:
    post:
      summary: Create Platform Invitation
      description: |-
        Creates a new invitation for a user to register as a Platform User.
        Requires Platform Bearer token and appropriate permissions (e.g., `platform_invitation:create`).
      operationId: createPlatformInvitation
      tags: [PlatformInvitation]
      security:
      - platformBearerAuth: []
      requestBody:
        description: Platform Invitation details (email, optional expiry).
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformInvitationRequest"
      responses:
        "201":
          description: Platform Invitation created successfully. Includes the 
            invitation code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/platform-invitations/search:
    post:
      summary: Search Platform Invitations
      description: |-
        Retrieves a list of platform invitations, allowing filtering and pagination.
        Requires Platform Bearer token and appropriate permissions (e.g., `platform_invitation:read`).
      operationId: searchPlatformInvitations
      tags: [PlatformInvitation]
      security:
      - platformBearerAuth: []
      requestBody:
        description: Search criteria.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformInvitationSearchRequest"
      responses:
        "200":
          description: A list of platform invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformInvitationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest" # Invalid search/pagination params
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/platform-invitations/{invitation_id}:
    parameters:
    - $ref: "#/components/parameters/PlatformInvitationIdParameter"
    delete:
      summary: Delete Platform Invitation
      description: |-
        Deletes a specific platform invitation using its ID. This operation is idempotent -
        it returns 204 No Content regardless of whether the invitation exists or not.
        Requires Platform Bearer token and appropriate permissions (e.g., `platform_invitation:delete`).
      operationId: deletePlatformInvitation
      tags: [PlatformInvitation]
      security:
      - platformBearerAuth: []
      responses:
        "204":
          description: Platform Invitation deleted successfully, or invitation 
            did not exist (idempotent operation).
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      summary: Get Platform Invitation
      description: |-
        Retrieves details of a specific platform invitation.
        Requires Platform Bearer token and appropriate permissions (e.g., `platform_invitation:read`).
      operationId: getPlatformInvitation
      tags: [PlatformInvitation]
      security:
      - platformBearerAuth: []
      responses:
        "200":
          description: Platform Invitation details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformInvitationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # Platform User Management (Authenticated via Platform Bearer Token)
  /v1/platform-users/search:
    post:
      summary: Search Platform Users
      description: |-
        Retrieves a list of platform Users, allowing filtering and pagination.
        Requires Platform Bearer token and appropriate permissions (e.g., `platform_User:read`).
      operationId: searchPlatformUsers
      tags: [PlatformUser]
      security:
      - platformBearerAuth: []
      requestBody:
        description: Search criteria.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformUserSearchRequest"
      responses:
        "200":
          description: A list of platform Users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUserListResponse"
        "400":
          $ref: "#/components/responses/BadRequest" # Invalid search/pagination params
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/platform-users/{platform_user_id}:
    parameters:
    - $ref: "#/components/parameters/PlatformUserIdParameter"
    delete:
      summary: Delete Platform User
      description: |-
        Deletes a specific platform User using its ID. This operation is idempotent -
        it returns 204 No Content regardless of whether the User exists or not.
        Requires Platform Bearer token and appropriate permissions (e.g., `platform_User:delete`).
      operationId: deletePlatformUser
      tags: [PlatformUser]
      security:
      - platformBearerAuth: []
      responses:
        "204":
          description: Platform User deleted successfully, or User did not exist
            (idempotent operation).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      summary: Get Platform User
      description: |-
        Retrieves details of a specific platform User.
        Requires Platform Bearer token and appropriate permissions (e.g., `platform_User:read`).
      operationId: getPlatformUser
      tags: [PlatformUser]
      security:
      - platformBearerAuth: []
      responses:
        "200":
          description: Platform User details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # PRODUCT RELATED API

  # --- ProductPermission Management (Platform Admin Auth) ---
  # ProductPermissions are built-in Anchor permissions that control access
  # to the product itself (e.g. product:settings:read, product:billing:update).
  # They are system-defined and read-only — the API only exposes search/get.
  # To define permissions for your own application resources (e.g. document:read),
  # use the /resource-permissions endpoints instead.
  /v1/products/{product_id}/permissions/search:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"

    post:
      summary: Search built-in Product Permissions
      description: >-
        Searches the built-in Anchor permissions available for a product.
        These permissions govern access to the product itself within Anchor
        (e.g. product:settings:read). They are system-defined and cannot be
        created or deleted via the API. Requires Platform Bearer token.
      operationId: searchProductPermissions
      tags: [ProductPermission]
      security:
      - platformBearerAuth: []
      requestBody:
        description: Search criteria.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPermissionSearchRequest"
      responses:
        "200":
          description: A list of built-in product permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPermissionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/products/{product_id}/permissions/{permission_id}:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    - $ref: "#/components/parameters/ProductPermissionIdParameter"

    get:
      summary: Get built-in Product Permission
      description: >-
        Retrieves a specific built-in Anchor permission for a product by its
        name. These permissions govern access to the product itself within
        Anchor and are system-defined (read-only). Requires Platform Bearer
        token.
      operationId: getProductPermission
      tags: [ProductPermission]
      security:
      - platformBearerAuth: []
      responses:
        "200":
          description: Built-in product permission details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPermissionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- ProductRole Management ---
  /v1/products/{product_id}/roles/search:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"

    post:
      summary: Search ProductRoles for Product
      description: Searches for product roles defined for a specific product 
        based on criteria. Requires Platform Bearer token or Product API Key
        with product_role:read scope.
      operationId: searchProductRoles
      tags: [ProductRole]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["product_role:read"]
      requestBody:
        description: Search criteria.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRoleSearchRequest"
      responses:
        "200":
          description: A list of product roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductRoleListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/products/{product_id}/roles:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"

    post:
      summary: Create ProductRole for Product
      description: Creates a new product role within a specific product. Can 
        optionally assign initial permissions. Requires Platform Bearer token
        or Product API Key with product_role:create scope.
      operationId: createProductRole
      tags: [ProductRole]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["product_role:create"]
      requestBody:
        description: Role details (name, description, initial permissions).
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRoleCreateRequest"
      responses:
        "201":
          description: Application role created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductRoleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/products/{product_id}/roles/{role_id}:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    - $ref: "#/components/parameters/ProductRoleIdParameter"
    get:
      summary: Get ProductRole
      description: Retrieves details of a specific product role. Requires 
        Platform Bearer token or Product API Key with product_role:read scope.
      operationId: getProductRole
      tags: [ProductRole]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["product_role:read"]
      responses:
        "200":
          description: Product role details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductRoleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound" # Product or Role not found

    put:
      summary: Update ProductRole
      description: Updates a product role's details (name, description, 
        permissions). Requires Platform Bearer token or Product API Key with
        product_role:update scope.
      operationId: updateProductRole
      tags: [ProductRole]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["product_role:update"]
      requestBody:
        description: Fields to update.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRoleUpdateRequest"
      responses:
        "200":
          description: Application role updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductRoleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Delete ProductRole
      description: Deletes an application role. Fails if the role is currently 
        assigned to any users via memberships. Requires Platform Bearer token
        or Product API Key with product_role:delete scope.
      operationId: deleteProductRole
      tags: [ProductRole]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["product_role:delete"]
      responses:
        "204":
          description: Application role deleted successfully.
        "400": # Bad Request if role is in use
          description: Bad Request (Role is currently assigned via memberships)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                errors: [{"code": "ROLE_IN_USE", "message": "Cannot delete role as
                      it is currently assigned to users."}]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/products/{product_id}/roles/{role_id}/permissions:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    - $ref: "#/components/parameters/ProductRoleIdParameter"

    post:
      summary: Assign Resource Permission to ProductRole
      description: >-
        Assigns an existing product resource permission to a product role.
        The permission must be a ProductResourcePermission (a domain-specific
        permission defined by the product owner, e.g. "document:read") — not
        a built-in Anchor ProductPermission. Requires Platform Bearer token
        or Product API Key with product_role:update scope.
      operationId: assignPermissionToProductRole
      tags: [ProductRole]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["product_role:update"]
      requestBody:
        description: The name of the product resource permission to assign.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignPermissionRequest"
      responses:
        "204": # Successfully assigned, no content needed
          description: Permission assigned successfully.
        "400":
          $ref: "#/components/responses/BadRequest" # e.g., Permission already assigned
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not Found (Product, Role, or ProductResourcePermission not found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /v1/products/{product_id}/roles/{role_id}/permissions/{permission_id}:
    parameters:
    - $ref: "#/components/parameters/ProductIdParameter"
    - $ref: "#/components/parameters/ProductRoleIdParameter"
    - $ref: "#/components/parameters/ProductPermissionIdParameter"

    delete:
      summary: Unassign Resource Permission from ProductRole
      description: >-
        Removes a product resource permission assignment from a product role.
        The permission_name path parameter must match a ProductResourcePermission
        name (e.g. "document:read"), not a built-in Anchor ProductPermission.
        Requires Platform Bearer token or Product API Key with
        product_role:update scope.
      operationId: unassignPermissionFromProductRole
      tags: [ProductRole]
      security:
      - platformBearerAuth: []
      - productApiKeyAuth: ["product_role:update"]
      responses:
        "204":
          description: Permission unassigned successfully.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          description: Bad Request (e.g., Permission not assigned to this role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

