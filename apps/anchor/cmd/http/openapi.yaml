openapi: 3.0.3
info:
  title: Anchor API (V1) # Renamed title
  version: 1.0.0 # Initial version
  description: |- # Updated description based on our design
    API for managing organizational structures including Products, Organizations,
    Workspaces, Users (Platform & Product), Roles, Permissions, and API Keys.
    V1 focuses on a single-PlatformTenant deployment model (Open Source).
tags:
- name: PlatformAuth
  description: Platform User authentication operations (Login, User Info).
- name: PlatformInvitation
  description: Manage Platform User invitations
  # Product
- name: Product
  description: Manage Products within the PlatformTenant. (Admin operation)
- name: ProductPermission
  description: >-
    View the built-in permissions that control access to the product itself
    (e.g. product:settings:read, product:billing:update). These are
    system-defined and read-only via the API. (Admin operation)
- name: ProductResourcePermission
  description: >-
    Manage domain-resource permissions defined by the product owner for their
    own application resources (e.g. document:read, file:delete for a Google
    Drive-like product). Full CRUD. (Admin + Product API Key operation)
- name: ProductRole
  description: Manage Roles per Product. (Admin operation)
- name: ProductAPIKey
  description: Manage API Keys per Product. (Admin operation)
- name: OrganizationAPIKey
  description: Manage Organization API Keys. (Admin operation)
- name: Organization
  description: Manage Organizations within a Product. (Requires Product API Key)
- name: Workspace
  description: Manage Workspaces within an Organization. (Requires Product API 
    Key)
- name: ProductUser
  description: Manage Product Users (end-users). (Requires Product API Key)
- name: Membership
  description: Manage Product User memberships in Organizations and Workspaces. 
    (Requires Product API Key)
- name: Permissions
  description: Check and list effective permissions for Product Users. (Requires
    Product API Key)
- name: ProductOrganization
  description: Manage Organizations within a Product. (Requires Product API Key)
- name: OrganizationMember
  description: Manage members within an Organization. (Requires Product API Key)
- name: Integration
  description: Manage integration instances and process inbound webhooks for 
    Products. (Admin + public webhook endpoint)
components:
  parameters:
    # --- Define Path Parameters for re-use ---
    PlatformInvitationIdParameter:
      name: invitation_id
      in: path
      description: The KSUID of the platform invitation.
      schema:
        $ref: "#/components/schemas/ksuid"
        example: "pinv_9sTUV..."
      required: true
    PlatformUserIdParameter:
      name: platform_user_id
      in: path
      required: true
      description: The KSUID of the platform invitation.
      schema:
        $ref: "#/components/schemas/ksuid"
        example: "puser_9sTUV..."
    ProductIdParameter:
      name: product_id
      in: path
      required: true
      description: The KSUID of the product.
      schema:
        $ref: "#/components/schemas/ksuid"
        example: "prod_2iABC..."
    OrganizationIdParameter:
      name: organization_id
      in: path
      required: true
      description: The KSUID of the organization.
      schema:
        $ref: "#/components/schemas/ksuid"
      example: "org_6jKLM..."
    WorkspaceIdParameter:
      name: workspace_id
      in: path
      required: true
      description: The KSUID of the workspace.
      schema:
        $ref: "#/components/schemas/ksuid"
      example: "ws_6jKLM..."
    ProductUserIdParameter:
      name: product_user_id
      in: path
      required: true
      description: The KSUID of the product Product User.
      schema:
        $ref: "#/components/schemas/ksuid"
        example: "pusr_8nOPQ..."
    ProductRoleIdParameter:
      name: role_id
      in: path
      required: true
      description: The KSUID of the product role.
      schema:
        $ref: "#/components/schemas/ksuid"
        example: "role_5mNOP..."
    ResourcePermissionNameParameter:
      name: permission_name
      in: path
      required: true
      description: The resource permission name (e.g., file:read, 
        document:edit).
      schema:
        type: string
        minLength: 2
        maxLength: 200
        example: "file:read"
    ProductPermissionIdParameter:
      name: permission_id
      in: path
      required: true
      description: permission name
      schema:
        type: string
        example: "file:read"
    ProductAPIKeyIdParameter:
      name: api_key_id
      in: path
      required: true
      description: The KSUID of the product API key.
      schema:
        $ref: "#/components/schemas/ksuid"
        example: "product_apikey_5mNOP..."
    OrganizationAPIKeyIdParameter:
      name: api_key_id
      in: path
      required: true
      description: The KSUID of the organization API key.
      schema:
        $ref: "#/components/schemas/ksuid"
        example: "organization_apikey_5mNOP..."
    IntegrationInstanceIdParameter:
      name: integration_instance_id
      in: path
      required: true
      description: The KSUID of the integration instance.
      schema:
        $ref: "#/components/schemas/ksuid"
        example: "iin_7pRST..."
    ProviderTypeParameter:
      name: provider_type
      in: path
      required: true
      description: The integration provider type (e.g., CLERK).
      schema:
        $ref: "#/components/schemas/IntegrationProviderType"
    EmailTemplateIdParameter:
      name: email_template_id
      in: path
      required: true
      description: The KSUID of the email template.
      schema:
        $ref: "#/components/schemas/ksuid"
        example: "etpl_2iABC..."
  securitySchemes:
    platformBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT Bearer token obtained via the /auth/login endpoint for Platform User authentication.

    # This API key is issued to the software (product backend) that calls Anchor
    # to manage its product. It carries two distinct permission namespaces:
    #
    # 1. NANOSTACK permissions — built-in scopes that govern what the product
    #    backend can do within Anchor itself (e.g. organization:create,
    #    product_user:read, resources_permissions:write). These are the security
    #    scopes declared on each endpoint below.
    #
    # 2. PRODUCT resource permissions — domain-specific permissions defined by
    #    the product owner for their own application resources (e.g. document:read,
    #    file:delete). These are managed via the /resource-permissions endpoints
    #    and are assigned to ProductRoles, which are then attached to end-user
    #    organization memberships.
    #
    # The key distinction: Anchor permissions control what the product backend
    # can do *in Anchor*; product resource permissions control what end-users
    # can do *inside the product*.
    productApiKeyAuth:
      type: apiKey
      in: header
      name: X-Product-API-Key
  schemas:
    # Generic
    ksuid:
      type: string
      description: Unique identifier using KSUID format with a resource-specific
        prefix.
      example: "prefix_2ikcVW44U7UtqJHCOTqHuwkgrBb"
      pattern: "^[a-z_]{2,20}_[0-9a-zA-Z]{27}$"
    ApiError:
      type: object
      properties:
        code:
          type: string
          description: A machine-readable error code.
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: A human-readable error message.
          example: "Request validation failed"
        field:
          type: string
          description: The specific field that caused the error (optional).
          example: "name"
        details:
          type: object # Allow richer details
          additionalProperties: true
          description: Additional details about the error (optional).
          example: {"minLength": 2}
      required:
      - code
      - message

    ApiErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ApiError"
      required:
      - errors
    PagedListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
          description: Total number of matching items.
        count:
          type: integer
          description: The number of items returned in this response.
      required:
      - total
      - count
    SearchRequest:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/PaginationRequest"
        full_text_search:
          type: string
          description: Full-text search term to match against searchable fields.
        sort_direction:
          $ref: "#/components/schemas/SortDirection"
          description: Sorting direction
      description: Generic search request template

    PaginationRequest:
      type: object
      properties:
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
          description: Maximum number of items per page.
        offset:
          type: integer
          format: int32
          minimum: 0
          default: 0
          description: Number of items to skip.
      x-go-type: search.Pagination
      x-go-type-import:
        path: github.com/nanostack-dev/nanostack-framework/pkg/search
    SortDirection:
      type: string
      enum: [ASC, DESC]
      default: DESC
      x-go-type: search.SortDirection
      x-go-type-import:
        path: github.com/nanostack-dev/nanostack-framework/pkg/search
    Metadata:
      type: object
      additionalProperties: true
      description: Optional key-value metadata. Values can be string, number, 
        boolean.
      example: {"billing_ref": "cust_abc123", "region": "us-east-1", "sla_level": "gold"}
    # Auth
    AuthTokenResponse:
      additionalProperties: false
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
      - accessToken
      - refreshToken
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          x-go-type: string
        password:
          type: string
      required:
      - email
      - password
    RegisterRequest:
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          x-go-type: string
        password:
          type: string
        invitation_code:
          type: string
          description: Optional invitation code for registration.
          example: "INVITE123"
        tenant_name:
          type: string
          minLength: 2
          maxLength: 100
          description: Optional tenantservice name for the initial setup. If not
            provided, defaults to "Default".
          example: "Acme Corporation"
      required:
      - email
      - password
      type: object

    # Platform Invitation Schemas
    PlatformInvitationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          x-go-type: string
          description: The email address of the Product User being invited to 
            the platform.
          example: "new.admin@example.com"
      required:
      - email
    PlatformInvitationResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ksuid"
          description: Unique identifier for the platform invitation (e.g., 
            prefix 'pinv_').
          example: "pinv_9sTUV..."
        code:
          type: string
          description: The unique invitation code that the Product User will use
            to register.
          example: "PLATFORMINVITEABC"
        email:
          type: string
          format: email
          x-go-type: string
          description: The email address the invitation was sent to.
          example: "new.admin@example.com"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the invitation was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the invitation was last updated.
        tenant_id:
          $ref: "#/components/schemas/ksuid"
          description: The ID of the PlatformTenant this invitation is 
            associated with.
          example: "ptnt_1single..."
      required:
      - id
      - code
      - email
      - created_at
      - updated_at
      - tenant_id
    PlatformInvitationListResponse:
      allOf:
      - $ref: "#/components/schemas/PagedListResponse"
      - properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/PlatformInvitationResponse"
        required:
        - items
    PlatformInvitationFilter:
      type: object
      properties:
        emails:
          type: array
          items:
            type: string
            format: email
            x-go-type: string
          description: Filter by email addresses (can specify multiple).
          x-go-type-skip-optional-pointer: true
        ids:
          type: array
          items:
            $ref: "#/components/schemas/ksuid"
          description: Filter by specific invitation IDs (can specify multiple).
          x-go-type-skip-optional-pointer: true
    PlatformInvitationSearchRequest:
      allOf:
      - $ref: "#/components/schemas/SearchRequest"
      - properties:
          filter:
            $ref: "#/components/schemas/PlatformInvitationFilter"
            description: Filter criteria for platform invitations
          sort_by:
            type: string
            enum:
            - email
            - created_at
            - updated_at
            default: created_at
            description: Field to sort by
            x-go-type: invitation.SortFieldPlatformInvitation
            x-go-type-import:
              path: anchor/internal/domain/invitation

    # Platform User Schemas
    PlatformUserRole:
      type: string
      enum: [OWNER, ADMIN]
      description: The role of the platform user.
      x-go-type: platform.TenantRole
      x-go-type-import:
        path: anchor/internal/domain/platform
    PlatformUserResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ksuid"
          description: Unique identifier for the platform Product User (e.g., 
            prefix 'puser_').
          example: "puser_9sTUV..."
        user_id:
          $ref: "#/components/schemas/ksuid"
          description: Unique identifier for the Product User (e.g., prefix 
            'user_').
          example: "user_9sTUV..."
        email:
          type: string
          format: email
          x-go-type: string
          description: The email address the invitation was sent to.
          example: "new.admin@example.com"
        role:
          $ref: "#/components/schemas/PlatformUserRole"
          description: The role of the platform Product User.
          example: "ADMIN"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the invitation was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the invitation was last updated.
        tenant_id:
          $ref: "#/components/schemas/ksuid"
          description: The ID of the PlatformTenant this invitation is 
            associated with.
          example: "tenant_1single..."
      required:
      - id
      - email
      - created_at
      - updated_at
      - role
      - user_id
      - tenant_id
    PlatformUserFilter:
      type: object
      properties:
        emails:
          type: array
          items:
            type: string
            format: email
            x-go-type: string
          description: Filter by email addresses (can specify multiple).
          x-go-type-skip-optional-pointer: true
        roles:
          type: array
          items:
            $ref: "#/components/schemas/PlatformUserRole"
          description: Filter by Product User roles (can select multiple).
          x-go-type-skip-optional-pointer: true
        ids:
          type: array
          items:
            $ref: "#/components/schemas/ksuid"
          description: Filter by specific Product User IDs (can specify 
            multiple).
          x-go-type-skip-optional-pointer: true
    PlatformUserSearchRequest:
      allOf:
      - $ref: "#/components/schemas/SearchRequest"
      - type: object
        properties:
          filter:
            $ref: "#/components/schemas/PlatformUserFilter"
            description: Filter criteria for platform invitations
          sort_by:
            type: string
            enum:
            - email
            - created_at
            - updated_at
            - role
            default: created_at
            description: Field to sort by
            x-go-type: platform.SortFieldPlatformUser
            x-go-type-import:
              path: anchor/internal/domain/platform
    PlatformUserListResponse:
      allOf:
      - $ref: "#/components/schemas/PagedListResponse"
      - properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/PlatformUserResponse"
        required:
        - items

    # Product
    ProductFilter:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
          description: Filter by product names (can specify multiple).
          x-go-type-skip-optional-pointer: true
        ids:
          type: array
          items:
            $ref: "#/components/schemas/ksuid"
          description: Filter by specific product IDs (can specify multiple).
          x-go-type-skip-optional-pointer: true
    ProductSearchRequest:
      allOf:
      - $ref: "#/components/schemas/SearchRequest"
      - properties:
          filter:
            $ref: "#/components/schemas/ProductFilter"
            description: Filter criteria for platform invitations
          sort_by:
            type: string
            enum:
            - name
            - created_at
            - updated_at
            default: created_at
            description: Field to sort by
            x-go-type: product.SortFieldProduct
            x-go-type-import:
              path: anchor/internal/domain/product
    ProductRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Name of the product. Must be unique within the
            PlatformTenant using case-insensitive matching.
          example: "My Super App"
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: Optional description for the product.
          example: "Real-time Product User analytics."
        config:
          $ref: "#/components/schemas/ProductConfigRequest"
          description: Product-level configuration.
      required:
      - name
    ProductConfigRequest:
      type: object
      properties:
        api_keys:
          $ref: "#/components/schemas/ProductAPIKeysConfigRequest"
          description: Product API key configuration.
    ProductAPIKeysConfigRequest:
      type: object
      properties:
        prefix:
          type: string
          minLength: 2
          maxLength: 32
          pattern: "^[a-z][a-z0-9_]*[a-z0-9]$"
          description: >-
            Root prefix used when generating product and organization API keys
            for this product. The key kind suffix is appended automatically,
            e.g. "acme" produces "acme_prd_apikey_..." and
            "acme_org_apikey_...".
          example: "anchor"
      required:
      - prefix
    ProductConfigResponse:
      type: object
      properties:
        api_keys:
          $ref: "#/components/schemas/ProductAPIKeysConfigResponse"
          description: Product API key configuration.
      required:
      - api_keys
    ProductAPIKeysConfigResponse:
      type: object
      properties:
        prefix:
          type: string
          description: >-
            Root prefix used when generating product and organization API keys
            for this product.
          example: "anchor"
      required:
      - prefix
    ProductResponse: # Response Schema
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ksuid"
          description: Unique identifier for the product (e.g., prefix 'prod_').
          example: "prod_2iABC..."
        tenant_id: # Included for clarity, even if fixed in OS V1
          $ref: "#/components/schemas/ksuid"
          description: Identifier of the PlatformTenant this product belongs to.
          example: "ptnt_1single..."
        name:
          type: string
          description: Name of the product.
          example: "Analytics Dashboard"
        description:
          type: string
          nullable: true
          description: Description of the product.
          example: "Real-time Product User analytics."
        config:
          $ref: "#/components/schemas/ProductConfigResponse"
          description: Product-level configuration.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the product was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the product was last updated.
      required:
      - id
      - tenant_id
      - name
      - config
      - created_at
      - updated_at
    ProductListResponse:
      allOf:
      - $ref: "#/components/schemas/PagedListResponse"
      - properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/ProductResponse"
        required:
        - items
    ProductPermissionResponse: # Response Schema
      description: >-
        A built-in permission that controls access to the product itself within
        Anchor (e.g. product:settings:read, product:billing:update). These
        permissions are system-defined — they cannot be created or deleted via
        the API. Use the search endpoint to discover which permissions are
        available for a product.
      type: object
      properties:
        product_id:
          $ref: "#/components/schemas/ksuid"
          description: ID of the Product this permission is defined for.
          example: "prod_2iABC..."
        name:
          type: string
          description: >-
            The permission string identifier. Permission name filters and
            validation use case-insensitive matching and return the canonical
            stored casing.
          example: "product:settings:read"
        description:
          type: string
          nullable: true
          description: Human-readable description of what this permission grants.
          example: "Allows reading the product settings."
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - product_id
      - name
      - created_at
      - updated_at

    ProductPermissionListResponse:
      allOf:
      - $ref: "#/components/schemas/PagedListResponse"
      - properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/ProductPermissionResponse"
        required:
        - items
    CreateProductResourcePermissionRequest:
      description: >-
        Request body for defining a new domain-resource permission for the
        product's own application resources. For example, if you are building a
        Google Drive-like product you might define permissions such as
        "document:read", "document:create", or "file:delete". These permissions
        are later assigned to ProductRoles, which are attached to end-user
        organization memberships.
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
          description: >-
            The resource permission identifier, using the format
            "<resource>:<action>" (e.g. "document:read", "file:delete",
            "workspace:invite"). Must be unique within the product using
            case-insensitive matching.
          example: "document:read"
        description:
          type: string
          maxLength: 500
          nullable: true
          description: Optional human-readable description of what this permission grants.
          example: "Allows reading document contents."
        scope_modifier:
          type: string
          maxLength: 100
          nullable: true
          description: >-
            Optional scope qualifier that narrows the permission to a subset of
            matching resources (e.g. "own" to restrict to resources the user
            owns, "team" to restrict to resources shared within their team).
          example: "own"
      required:
      - name

    UpdateProductResourcePermissionRequest:
      description: Request body for updating a product resource permission's metadata.
      type: object
      properties:
        description:
          type: string
          maxLength: 500
          nullable: true
          description: Updated human-readable description of what this permission grants.
          example: "Allows updating document contents."

    ProductResourcePermissionResponse:
      description: >-
        A domain-resource permission defined by the product owner for their own
        application resources. These permissions are created by the product
        (e.g. "document:read", "file:delete" for a Google Drive-like product)
        and assigned to ProductRoles. They control what end-users can do
        *inside the product*, as opposed to ProductPermissions which control
        access to the product itself within Anchor.
      type: object
      properties:
        product_id:
          $ref: "#/components/schemas/ksuid"
          description: ID of the Product this resource permission belongs to.
          example: "prod_2iABC..."
        name:
          type: string
          description: >-
            The resource permission identifier (e.g. "document:read"). This
            value is used as the primary key and path parameter.
          example: "document:read"
        description:
          type: string
          nullable: true
          description: Human-readable description of what this permission grants.
          example: "Allows reading document contents."
        scope_modifier:
          type: string
          nullable: true
          description: >-
            Optional scope qualifier that narrows the permission (e.g. "own"
            restricts to resources owned by the user, "team" to resources
            shared within their team).
          example: "own"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the resource permission was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the resource permission was last updated.
      required:
      - product_id
      - name
      - created_at
      - updated_at
    ProductResourcePermissionFilter:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
          description: Filter by resource permission names.
          x-go-type-skip-optional-pointer: true
    ProductResourcePermissionSearchRequest:
      allOf:
      - $ref: "#/components/schemas/SearchRequest"
      - properties:
          filter:
            $ref: "#/components/schemas/ProductResourcePermissionFilter"
          sort_by:
            type: string
            enum: ["created_at", "updated_at", "name"]
            default: "created_at"
            description: Field to sort by
            x-go-type: resourcepermission.SortFieldProductResourcePermission
            x-go-type-import:
              path: anchor/internal/domain/product/resourcepermission

    ProductResourcePermissionListResponse:
      allOf:
      - $ref: "#/components/schemas/PagedListResponse"
      - properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/ProductResourcePermissionResponse"
        required:
        - items
    ProductRoleCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Name of the product role. Must be unique within the
            Product using case-insensitive matching.
          example: "Editor"
        description:
          type: string
          maxLength: 500
          nullable: true
          description: Optional description of the role's purpose.
          example: "Can view and edit resources within assigned organizations/workspaces."
        permissions:
          type: array
          description: Optional list of permission names (strings) to assign 
            initially.
          items:
            type: string
            example: "document:edit"
          x-go-type-skip-optional-pointer: true
      required:
      - name
    ProductRoleUpdateRequest:
      type: object
