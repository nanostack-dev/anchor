    - $ref: "#/components/parameters/IntegrationInstanceIdParameter"
    post:
      summary: Search Integration Audit Logs
      description: >-
        Searches the audit log entries of one integration instance. The log is
        append-only and grows with every webhook and reconcile run, so it pages
        with a cursor and reaches every entry, not only the newest hundred.
        Filter by `actions`, `severities` and a `created_after` and
        `created_before` range. Requires Platform Bearer token.

        Default order is `created_at` descending, then `id` descending, newest
        first. Page with a cursor: send the `next_cursor` of the previous response as `pagination.cursor`; an absent `next_cursor` marks the last page.
      operationId: searchIntegrationAuditLogs
