      - role_id
    ProductOrganizationResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ksuid"
          description: Unique identifier for the organization (e.g., prefix 
            'org_').
          examples: ["org_3iXYZ..."]
        product_id:
          $ref: "#/components/schemas/ksuid"
          description: ID of the Product this organization belongs to.
          examples: ["prod_2iABC..."]
        name:
          type: string
          description: Name of the organization.
          examples: ["Acme Corporation"]
        description:
          type: [string, "null"]
          description: Description of the organization.
          examples: ["Leading provider of innovative solutions."]
        metadata:
          $ref: "#/components/schemas/Metadata"
          description: Key-value metadata for the organization.
        license:
          $ref: "#/components/schemas/OrganizationLicenseResponse"
          description: >-
            The organization's license. Present on the response to a create call
            that asked for one, and on a read passing `include=license`. Absent
            otherwise, which says nothing about whether the organization holds
            one. It never carries `usage` — the license route is where usage is
            computed.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the organization was created.
        updated_at:
          type: string
