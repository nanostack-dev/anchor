      parameters:
      - name: include
        in: query
        required: false
        description: Comma-separated list of additional fields to include.
        schema:
          type: array
          items:
            $ref: "#/components/schemas/UserOrganizationInclude"
        style: form
        explode: false
      responses:
        "200":
          description: Organization details from the user's perspective.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOrganizationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

