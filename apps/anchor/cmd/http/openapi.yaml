        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/products/{product_id}/licensing/templates/{license_template_id}:
    parameters:
    - $ref: '#/components/parameters/ProductIdParameter'
    - $ref: '#/components/parameters/LicenseTemplateIdParameter'
    get:
      summary: Get License Template
      operationId: getLicenseTemplate
      tags:
      - Licensing
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - license_template:read
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseTemplateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update License Template
      description: >-
        Edits a template. Values, when supplied, are replaced wholesale — a
        license field absent from the request is unset. The result is validated
        against the schema on every write, so a rename cannot leave a template
        that no longer satisfies the declaration it is defined against. An
        archived template is refused: the tier is withdrawn, so there is nothing
        left to price.
      operationId: updateLicenseTemplate
      tags:
      - Licensing
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - license_template:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseTemplateUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseTemplateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LicensingWriteConflict'
    delete:
      summary: Delete License Template
      description: >-
        Removes a template that no Organization license has ever named. Refused
        with a 400 if any Organization license still names it, checked before
        the write — the same record a customer was sold cannot lose the
        statement of what they were sold. There is no cascade and no force:
        resolve the reference first, or archive the template instead, which
        withdraws it without removing the row. Archiving remains the only
        withdrawal for a template that might already have customers; delete
        exists for the one nobody was ever licensed from. See
        docs/adr/0011-unreferenced-license-template-can-be-deleted.md.
      operationId: deleteLicenseTemplate
      tags:
      - Licensing
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - license_template:delete
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LicensingWriteConflict'
  /v1/products/{product_id}/licensing/templates/{license_template_id}/archive:
    parameters:
    - $ref: '#/components/parameters/ProductIdParameter'
    - $ref: '#/components/parameters/LicenseTemplateIdParameter'
    post:
      summary: Archive License Template
      description: >-
        Withdraws a tier. The template stops being offered — it can no longer be
        instantiated or edited — but the record is kept, because the
        organizations already licensed from it name it as the statement of what
        they were sold. Archiving frees the name for a replacement. It is
        idempotent, and it cannot be undone.

        This is the withdrawal to use once a template might have customers.
        DELETE on the same template removes the row outright, but only when no
        Organization license names it — archive is what is left once that is no
        longer true. Scoped as an edit, not a delete: the row is kept, so this
        is closer to updating the template's status than to removing it.
      operationId: archiveLicenseTemplate
      tags:
      - Licensing
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - license_template:update
      responses:
        '200':
          description: Archived, or already archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseTemplateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LicensingWriteConflict'
  /v1/products/{product_id}/licensing/organization-licenses/search:
    parameters:
    - $ref: '#/components/parameters/ProductIdParameter'
    post:
      summary: Search Organization Licenses
      description: >-
        Lists the product's organizations alongside the license each one holds,
        one page at a time. This is the licensing view of the customer book:
        who is on which tier, and who is on none.

        Filter by `license_template_ids` to answer "which customers are on the
        tier we are retiring", which archived templates accept. Filter by
        `licensed` to find organizations that were never stamped.
        `full_text_search` matches the organization name.

        An organization with no license is a result with `license` absent, not
        a missing row. `usage` is never derived here; read one organization's
        license for that.

        Default order is `organization_name` ascending, then the organization `id`. Page with a cursor: send the `next_cursor` of the previous response as `pagination.cursor`; an absent `next_cursor` marks the last page.
      operationId: searchOrganizationLicenses
      tags:
      - Licensing
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - organization_license:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationLicenseSearchRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationLicenseSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/products/{product_id}/licensing/organization-licenses/migrate:
    parameters:
    - $ref: '#/components/parameters/ProductIdParameter'
    post:
      summary: Migrate Organization Licenses Onto A Template
      description: >-
        Moves a set of organizations onto one license template, so retiring a
        tier or graduating a cohort is one call rather than a script. An
        organization already on another tier is moved; an organization with no
        license yet is granted one on this tier, same as any other member of
        the selection. Each license takes the target template's values, and
        `template_id` and `instantiated_at` are stamped — which is what
        separates this from adjusting every field by hand, since an adjustment
        deliberately cannot move provenance.

        Select the organizations with `organization_ids` or with
        `from_template_id`, which is every organization currently on a given
        template and accepts an archived one. At most 500 organizations per
        run; a larger selection is refused with its count rather than
        truncated.

        A license field whose value differs from the template the organization
        currently holds is carried forward onto the new license by default, so
        a bespoke arrangement survives the move. Send
        `on_difference: DISCARD` to take the target template whole instead.
        Anchor cannot tell a bespoke adjustment from a template that moved
        after the copy was taken, so neither choice is safe by itself: compare
        the two templates before running. `on_difference` has nothing to act on
        for an organization granted its first license — there is no held value
        to carry forward or discard — so it always takes the target whole.

        Each organization is written in its own transaction, so one failure is
        reported against that organization and the rest of the batch still
        lands. Every organization set gets a `SET` entry in its license
        history, and every entry of one run shares a single `changed_at`.
      operationId: migrateOrganizationLicenses
      tags:
      - Licensing
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - organization_license:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationLicenseMigrationRequest'
      responses:
        '200':
          description: >-
            The run completed. Individual organizations may still have failed;
            read `results`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationLicenseMigrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          # Declared with a body rather than sharing the empty NotFound
          # response: two identifiers in one request can be missing, and a
          # caller has to be able to tell which.
          description: >-
            No license template with that identifier. `LICENSE_TEMPLATE_NOT_FOUND`
            names the target, `LICENSE_MIGRATION_SOURCE_TEMPLATE_NOT_FOUND` the
            one selected from.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          $ref: '#/components/responses/LicensingWriteConflict'
  /v1/products/{product_id}/organizations/{organization_id}/license:
    parameters:
    - $ref: '#/components/parameters/ProductIdParameter'
    - $ref: '#/components/parameters/OrganizationIdParameter'
    post:
      summary: Instantiate Organization License
      description: >-
        Stamps a license template onto an organization, copying its values. The
        copy follows subsequent template updates except on explicitly adjusted
        fields. Adjusting this organization leaves the template unchanged. An
        organization has at most one license, so this is refused once one exists, and an archived template
        is refused because the tier is no longer offered.
      operationId: instantiateOrganizationLicense
      tags:
      - Licensing
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - organization_license:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationLicenseInstantiateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationLicenseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LicensingWriteConflict'
    get:
      summary: Get Organization License
      description: >-
        Reads an organization's effective license in one call: every license
        field, its value, the provenance of the copy, and — for every limit
        field — its latest reported usage and a derived status
        (`within_limit` / `at_limit` / `exceeded` / `stale`). Embedding usage
        here is deliberate: it saves a second call on the hot path. The status
        is computed fresh on every call and never stored; this route is
        cached, and the cache is evicted whenever the license is written, so a
        usage report becomes visible on the next read without a license write.
        This is advice, not a verdict — anchor validates but never gates.
      operationId: getOrganizationLicense
      tags:
      - Licensing
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - organization_license:read
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationLicenseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      summary: Adjust Organization License
      description: >-
        Adjusts license fields for one organization without touching the
        template, so a bespoke enterprise arrangement does not require a new
        tier. Values are merged: a license field present replaces the value
        held, and one absent is left alone. The result is validated against the
        product's license schema exactly as a template write is.
      operationId: adjustOrganizationLicense
      tags:
      - Licensing
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - organization_license:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationLicenseAdjustRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationLicenseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LicensingWriteConflict'
  /v1/products/{product_id}/organizations/{organization_id}/license/diff:
    parameters:
    - $ref: '#/components/parameters/ProductIdParameter'
    - $ref: '#/components/parameters/OrganizationIdParameter'
    get:
      summary: Diff Organization License Against Its Template
      description: >-
        Reports how an organization's license differs from the template it was
        instantiated from, one license field at a time. Use it to find accounts
        with bespoke arrangements. The template always resolves, archived or
        not, so this answers for the lifetime of the license.

        Not a search. The differences are derived per request from one license and its template, so they return together.
      operationId: getOrganizationLicenseDiff
      tags:
      - Licensing
      security:
      - platformBearerAuth: []
      - productApiKeyAuth:
        - organization_license:read
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationLicenseDiffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
