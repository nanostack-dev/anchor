            transitions are managed by the integration state machine.
        webhook_secret:
          type: [string, "null"]
          description: The webhook signing secret for signature validation.
          examples: ["whsec_..."]
        config:
          $ref: "#/components/schemas/IntegrationProviderConfig"
          description: Updated provider-specific configuration (JSON object).
    IntegrationInstanceResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ksuid"
          description: Unique identifier for the integration instance (prefix 
            'iin_').
          examples: ["iin_7pRST..."]
        product_id:
          $ref: "#/components/schemas/ksuid"
          description: ID of the Product this integration instance belongs to.
          examples: ["prod_2iABC..."]
        provider_type:
