openapi: 3.1.1
info:
  title: Anchor API (V1) # Renamed title
  version: 1.0.0 # Initial version
  description: |- # Updated description based on our design
    API for managing organizational structures including Products, Organizations,
    Workspaces, Users (Platform & Product), Roles, Permissions, and API Keys.
    V1 focuses on a single-PlatformTenant deployment model (Open Source).
tags:
- name: Access
  description: Access evaluation. Decides whether a product user or an organization API key may act on an organization or a workspace, following the OpenID AuthZEN Authorization API 1.0 shape.
- name: PlatformAuth
  description: Platform User authentication operations (Login, User Info).
- name: PlatformInvitation
  description: Manage Platform User invitations
  # Product
- name: Product
  description: Manage Products within the PlatformTenant. (Admin operation)
- name: ProductPermission
  description: >-
    View the built-in permissions that control access to the product itself
    (e.g. product:settings:read, product:billing:update). These are
    system-defined and read-only via the API. (Admin operation)
- name: ProductResourcePermission
  description: >-
    Manage domain-resource permissions defined by the product owner for their
    own application resources (e.g. document:read, file:delete for a Google
    Drive-like product). Full CRUD. (Admin + Product API Key operation)
- name: ProductRole
  description: Manage Roles per Product. (Admin operation)
- name: OrganizationRole
  description: The roles an Organization's members may hold, and the Organization's own custom roles.
- name: ProductAPIKey
  description: Manage API Keys per Product. (Admin operation)
- name: OrganizationAPIKey
  description: Manage Organization API Keys. (Admin operation)
- name: Organization
  description: Manage Organizations within a Product. (Requires Product API Key)
- name: Workspace
  description: Manage Workspaces within an Organization. (Requires Product API 
    Key)
- name: ProductUser
  description: Manage Product Users (end-users). (Requires Product API Key)
- name: Membership
  description: Manage Product User memberships in Organizations and Workspaces. 
    (Requires Product API Key)
- name: Permissions
  description: Check and list effective permissions for Product Users. (Requires
    Product API Key)
- name: ProductOrganization
  description: Manage Organizations within a Product. (Requires Product API Key)
- name: OrganizationMember
  description: Manage members within an Organization. (Requires Product API Key)
- name: OrganizationInvitation
  description: Invite email addresses to an Organization and accept the invitation. Anchor
    returns the token to the Product and sends no email. (Requires Product API Key)
- name: Integration
  description: Manage integration instances and process inbound webhooks for
    Products. (Admin + public webhook endpoint)
- name: Licensing
  description: >-
    Declare what a Product's licenses may contain. Anchor validates a license
    schema on write and never blocks an action on it — gating belongs to the
    consuming Product. (Admin + Product API Key operation)
components:
  parameters:
    # --- Define Path Parameters for re-use ---
    PlatformInvitationIdParameter:
      name: invitation_id
      in: path
      description: The KSUID of the platform invitation.
      schema:
        $ref: "#/components/schemas/ksuid"
        examples: ["pinv_9sTUV..."]
      required: true
    PlatformUserIdParameter:
      name: platform_user_id
      in: path
      required: true
      description: The KSUID of the platform invitation.
      schema:
        $ref: "#/components/schemas/ksuid"
        examples: ["puser_9sTUV..."]
    ProductIdParameter:
      name: product_id
      in: path
      required: true
      description: The KSUID of the product.
      schema:
        $ref: "#/components/schemas/ksuid"
        examples: ["prod_2iABC..."]
    OrganizationIncludeParameter:
      name: include
      in: query
      required: false
      description: >-
        Related resources to read alongside each organization, comma separated —
        `?include=workspace,license`. A resource not named is left out of the response
        entirely, which says nothing about whether the organization has it. Each
        named resource is read for the whole response at once, so including one
        costs one more statement, not one per organization.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/OrganizationInclude"
      style: form
      explode: false
      example: ["license"]
    OrganizationInvitationIdParameter:
      name: invitation_id
      in: path
      required: true
      description: The KSUID of the organization invitation.
      schema:
        $ref: "#/components/schemas/ksuid"
        examples: ["oinv_2iABC..."]
    OrganizationMemberIncludeParameter:
      name: include
      in: query
      required: false
      description: >-
        Related resources to read alongside each organization member, comma
        separated — `?include=role_permissions`. A resource not named is left
        out of the response entirely, which says nothing about whether the
        member has it. Each named resource is read for the whole response at
        once, so including one costs one more statement, not one per member.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/OrganizationMemberInclude"
      style: form
      explode: false
      example: ["role_permissions"]
    OrganizationIdParameter:
      name: organization_id
      in: path
      required: true
      description: The KSUID of the organization.
      schema:
        $ref: "#/components/schemas/ksuid"
      example: "org_6jKLM..."
    WorkspaceIdParameter:
      name: workspace_id
      in: path
      required: true
      description: The KSUID of the workspace.
      schema:
        $ref: "#/components/schemas/ksuid"
      example: "ws_6jKLM..."
    ProductUserIdParameter:
      name: product_user_id
      in: path
      required: true
      description: The KSUID of the product Product User.
      schema:
        $ref: "#/components/schemas/ksuid"
        examples: ["pusr_8nOPQ..."]
    ResourceTypeIdParameter:
      name: resource_type_id
      in: path
      required: true
      description: The KSUID of the resource type.
      schema:
        $ref: "#/components/schemas/ksuid"
        examples: ["rtype_2qLCf0ld3r2nT8vK5xR1"]
    ResourceTypePathParameter:
      name: resource_type
      in: path
      required: true
      description: >-
        The slug of the resource's type, such as `folder`. A slug the product
        has not declared answers 404 RESOURCE_TYPE_NOT_FOUND. `organization`
        is the root of every chain, never a registered resource, and answers
        404 RESOURCE_TYPE_NOT_REGISTRABLE on every method: an Organization is
        managed through the organization routes.
      schema:
        type: string
        examples: ["folder"]
    ResourceIdParameter:
      name: resource_id
      in: path
      required: true
      description: >-
        The product's own identifier of the resource, unique in its
        Organization and resource type. Anchor never assigns one. See
        `ResourceExternalId` for the characters it may hold; any other
        value answers 400 INVALID_RESOURCE_ID on a registration and 404
        RESOURCE_NOT_FOUND on a read or a delete.
      schema:
        type: string
        examples: ["3b7e91d2-0c4a-4f6e-9d21-8a5c7e4b2f60"]
    ProductRoleIdParameter:
      name: role_id
      in: path
      required: true
      description: The KSUID of the product role.
      schema:
        $ref: "#/components/schemas/ksuid"
        examples: ["role_5mNOP..."]
    ResourcePermissionNameParameter:
      name: permission_name
      in: path
      required: true
      description: The resource permission name (e.g., file:read, 
        document:edit).
      schema:
        type: string
        minLength: 2
        maxLength: 200
        examples: ["file:read"]
    ProductPermissionIdParameter:
      name: permission_id
      in: path
      required: true
      description: permission name
      schema:
        type: string
        examples: ["file:read"]
    ProductAPIKeyIdParameter:
      name: api_key_id
      in: path
      required: true
      description: The KSUID of the product API key.
      schema:
        $ref: "#/components/schemas/ksuid"
        examples: ["product_apikey_5mNOP..."]
    OrganizationAPIKeyIdParameter:
      name: api_key_id
      in: path
      required: true
      description: The KSUID of the organization API key.
      schema:
        $ref: "#/components/schemas/ksuid"
        examples: ["organization_apikey_5mNOP..."]
    IntegrationInstanceIdParameter:
      name: integration_instance_id
      in: path
      required: true
      description: The KSUID of the integration instance.
      schema:
        $ref: "#/components/schemas/ksuid"
        examples: ["iin_7pRST..."]
    ProviderTypeParameter:
      name: provider_type
      in: path
      required: true
      description: The integration provider type (e.g., CLERK).
      schema:
        $ref: "#/components/schemas/IntegrationProviderType"
    EmailTemplateIdParameter:
      name: email_template_id
      in: path
      required: true
      description: The KSUID of the email template.
      schema:
        $ref: "#/components/schemas/ksuid"
        examples: ["etpl_2iABC..."]
    LicenseTemplateIdParameter:
      name: license_template_id
      in: path
      required: true
      description: The KSUID of the license template.
      schema:
        $ref: "#/components/schemas/ksuid"
        examples: ["ltpl_2iABC..."]
  securitySchemes:
    platformBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT Bearer token obtained via the /auth/login endpoint for Platform User authentication.

    # This API key is issued to the software (product backend) that calls Anchor
    # to manage its product. It carries two distinct permission namespaces:
    #
    # 1. NANOSTACK permissions — built-in scopes that govern what the product
    #    backend can do within Anchor itself (e.g. organization:create,
    #    product_user:read, resources_permissions:write). These are the security
    #    scopes declared on each endpoint below.
    #
    # 2. PRODUCT resource permissions — domain-specific permissions defined by
    #    the product owner for their own application resources (e.g. document:read,
    #    file:delete). These are managed via the /resource-permissions endpoints
    #    and are assigned to ProductRoles, which are then attached to end-user
    #    organization memberships.
    #
    # The key distinction: Anchor permissions control what the product backend
    # can do *in Anchor*; product resource permissions control what end-users
    # can do *inside the product*.
    productApiKeyAuth:
      type: apiKey
      in: header
      name: X-Product-API-Key
  schemas:
    # Generic
    ksuid:
      type: string
      description: Unique identifier using KSUID format with a resource-specific
        prefix.
      examples: ["prefix_2ikcVW44U7UtqJHCOTqHuwkgrBb"]
      pattern: "^[a-z_]{2,20}_[0-9a-zA-Z]{27}$"
    ApiError:
      type: object
      x-go-type: fault.Detail
      x-go-type-import:
        path: github.com/nanostack-dev/nanostack-framework/pkg/fault
      properties:
        code:
          type: string
          description: A machine-readable error code.
          examples: ["VALIDATION_ERROR"]
        message:
          type: string
          description: A human-readable error message.
          examples: ["Request validation failed"]
        field:
          type: string
          description: The specific field that caused the error (optional).
          examples: ["name"]
        metadata:
          type: object # Allow richer metadata
          additionalProperties: true
          description: Additional metadata about the error (optional).
          examples: [{"minLength": 2}]
      required:
      - code
      - message

    ApiErrorResponse:
      type: object
      x-go-type: fault.Error
      x-go-type-import:
        path: github.com/nanostack-dev/nanostack-framework/pkg/fault
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ApiError"
      required:
      - errors
    PagedListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
          description: Number of items matching the filter, independent of the cursor.
        count:
          type: integer
          description: The number of items returned in this response.
        next_cursor:
          type: string
          description: >-
            Cursor for the next page. Absent on the last page: iterate until it
            is absent. Never infer the end from count or total.
      required:
      - total
      - count
    SearchRequest:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/PaginationRequest"
        full_text_search:
          type: string
          description: Full-text search term to match against searchable fields.
        sort_direction:
          $ref: "#/components/schemas/SortDirection"
      description: Generic search request template

    PaginationRequest:
      type: object
      properties:
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 10
          description: >-
            Maximum number of items per page. A request that names no limit,
            including one that sends only a cursor, gets 10.
        offset:
          type: integer
          format: int32
          minimum: 0
          default: 0
          description: >-
            Number of items to skip. Use for page-number navigation only;
            iterate with `cursor`.
        cursor:
          type: string
          maxLength: 8192
          description: >-
            Opaque cursor from the previous page's `next_cursor`. Continues the
            search after the last item of that page, with the same filter and
            sort. Omit to start at the first item. Cannot be combined with a
            non-zero `offset`. An invalid cursor answers 400 INVALID_CURSOR.
      x-go-type: search.Pagination
      x-go-type-import:
        path: github.com/nanostack-dev/nanostack-framework/pkg/search
    SortDirection:
      type: string
      enum: [ASC, DESC]
      description: >-
        Direction of the sort. With a `sort_by`, omitted means ASC. Without
        one, the operation's documented default order applies.
      x-go-type: search.SortDirection
      x-go-type-import:
        path: github.com/nanostack-dev/nanostack-framework/pkg/search
    Metadata:
      type: object
      additionalProperties: true
      description: Optional key-value metadata. Values can be string, number,
        boolean. At most 50 keys; keys are at most 64 characters and string
        values at most 512 characters. Sending metadata replaces the stored
        metadata in full.
      examples: [{"billing_ref": "cust_abc123", "region": "us-east-1", "sla_level": "gold"}]
    # Auth
    AuthTokenResponse:
      additionalProperties: false
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
      - accessToken
      - refreshToken
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          x-go-type: string
        password:
          type: string
      required:
      - email
      - password
    RegisterRequest:
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          x-go-type: string
        password:
          type: string
        invitation_code:
          type: string
          description: Optional invitation code for registration.
          examples: ["INVITE123"]
        tenant_name:
          type: string
          minLength: 2
          maxLength: 100
          description: Optional tenantservice name for the initial setup. If not
            provided, defaults to "Default".
          examples: ["Acme Corporation"]
      required:
      - email
      - password
      type: object

    # Platform Invitation Schemas
    PlatformInvitationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          x-go-type: string
          description: The email address of the Product User being invited to 
            the platform.
          examples: ["new.admin@example.com"]
      required:
      - email
    PlatformInvitationResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ksuid"
          description: Unique identifier for the platform invitation (e.g., 
            prefix 'pinv_').
          examples: ["pinv_9sTUV..."]
        code:
          type: string
          description: The unique invitation code that the Product User will use
            to register.
          examples: ["PLATFORMINVITEABC"]
        email:
          type: string
          format: email
          x-go-type: string
          description: The email address the invitation was sent to.
          examples: ["new.admin@example.com"]
        created_at:
          type: string
          format: date-time
          description: Timestamp when the invitation was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the invitation was last updated.
        tenant_id:
          $ref: "#/components/schemas/ksuid"
          description: The ID of the PlatformTenant this invitation is 
            associated with.
          examples: ["ptnt_1single..."]
      required:
      - id
      - code
      - email
      - created_at
      - updated_at
      - tenant_id
    PlatformInvitationListResponse:
      allOf:
      - $ref: "#/components/schemas/PagedListResponse"
      - properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/PlatformInvitationResponse"
        required:
        - items
    PlatformInvitationFilter:
      type: object
      properties:
        emails:
          type: array
          items:
            type: string
            format: email
            x-go-type: string
          description: Filter by email addresses (can specify multiple).
          x-go-type-skip-optional-pointer: true
        ids:
          type: array
          items:
            $ref: "#/components/schemas/ksuid"
          description: Filter by specific invitation IDs (can specify multiple).
          x-go-type-skip-optional-pointer: true
    PlatformInvitationSearchRequest:
      allOf:
      - $ref: "#/components/schemas/SearchRequest"
      - properties:
          filter:
            $ref: "#/components/schemas/PlatformInvitationFilter"
            description: Filter criteria for platform invitations
          sort_by:
            type: string
            enum:
            - email
            - created_at
            - updated_at
            default: created_at
            description: Field to sort by
            x-go-type: invitation.SortFieldPlatformInvitation
            x-go-type-import:
              path: anchor/internal/domain/invitation

    # Platform User Schemas
    PlatformUserRole:
      type: string
      enum: [OWNER, ADMIN]
      description: The role of the platform user.
      x-go-type: platform.TenantRole
      x-go-type-import:
        path: anchor/internal/domain/platform
    PlatformUserResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ksuid"
          description: Unique identifier for the platform Product User (e.g., 
            prefix 'puser_').
          examples: ["puser_9sTUV..."]
        user_id:
          $ref: "#/components/schemas/ksuid"
          description: Unique identifier for the Product User (e.g., prefix 
            'user_').
          examples: ["user_9sTUV..."]
        email:
          type: string
          format: email
          x-go-type: string
          description: The email address the invitation was sent to.
          examples: ["new.admin@example.com"]
        role:
          $ref: "#/components/schemas/PlatformUserRole"
          description: The role of the platform Product User.
          examples: ["ADMIN"]
        created_at:
          type: string
          format: date-time
          description: Timestamp when the invitation was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the invitation was last updated.
        tenant_id:
          $ref: "#/components/schemas/ksuid"
          description: The ID of the PlatformTenant this invitation is 
            associated with.
          examples: ["tenant_1single..."]
      required:
      - id
      - email
      - created_at
      - updated_at
      - role
      - user_id
      - tenant_id
    PlatformUserFilter:
      type: object
      properties:
        emails:
          type: array
          items:
            type: string
            format: email
            x-go-type: string
          description: Filter by email addresses (can specify multiple).
          x-go-type-skip-optional-pointer: true
        roles:
          type: array
          items:
            $ref: "#/components/schemas/PlatformUserRole"
          description: Filter by Product User roles (can select multiple).
          x-go-type-skip-optional-pointer: true
        ids:
          type: array
          items:
            $ref: "#/components/schemas/ksuid"
          description: Filter by specific Product User IDs (can specify 
            multiple).
          x-go-type-skip-optional-pointer: true
    PlatformUserSearchRequest:
      allOf:
      - $ref: "#/components/schemas/SearchRequest"
      - type: object
        properties:
          filter:
            $ref: "#/components/schemas/PlatformUserFilter"
            description: Filter criteria for platform invitations
          sort_by:
            type: string
            enum:
            - email
            - created_at
            - updated_at
            - role
            default: created_at
            description: Field to sort by
            x-go-type: platform.SortFieldPlatformUser
            x-go-type-import:
              path: anchor/internal/domain/platform
    PlatformUserListResponse:
      allOf:
      - $ref: "#/components/schemas/PagedListResponse"
      - properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/PlatformUserResponse"
        required:
        - items

    # Product
    ProductFilter:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
          description: Filter by product names (can specify multiple).
          x-go-type-skip-optional-pointer: true
        ids:
          type: array
          items:
            $ref: "#/components/schemas/ksuid"
          description: Filter by specific product IDs (can specify multiple).
          x-go-type-skip-optional-pointer: true
    ProductSearchRequest:
      allOf:
      - $ref: "#/components/schemas/SearchRequest"
      - properties:
          filter:
            $ref: "#/components/schemas/ProductFilter"
            description: Filter criteria for platform invitations
          sort_by:
            type: string
            enum:
            - name
            - created_at
            - updated_at
            default: created_at
            description: Field to sort by
            x-go-type: product.SortFieldProduct
            x-go-type-import:
              path: anchor/internal/domain/product
    ProductRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Name of the product. Must be unique within the
            PlatformTenant using case-insensitive matching.
          examples: ["My Super App"]
        description:
          type: [string, "null"]
          maxLength: 1000
          description: Optional description for the product.
          examples: ["Real-time Product User analytics."]
        config:
          $ref: "#/components/schemas/ProductConfigRequest"
          description: Product-level configuration.
      required:
      - name
    ProductConfigRequest:
      type: object
      properties:
        protected:
          type: boolean
          description: >-
            Prevents product deletion when true. Defaults to false on creation;
            omitted updates preserve the current value. Set false before deleting.
        organization_api_keys:
          $ref: "#/components/schemas/ProductOrganizationAPIKeysConfigRequest"
          description: Organization API key configuration for this product.
        events:
          $ref: "#/components/schemas/ProductEventsConfigRequest"
          description: Outbound product-event endpoint configuration.
    ProductOrganizationAPIKeysConfigRequest:
      type: object
      properties:
        prefix:
          type: string
          minLength: 2
          maxLength: 32
          pattern: "^[a-z][a-z0-9_]*[a-z0-9]$"
          description: >-
            Root prefix used when generating organization API keys for
            organizations in this product. The organization API key suffix is
            appended automatically, e.g. "acme" produces
            "acme_org_apikey_...". Product API keys always use the fixed
            Anchor product API key prefix.
          examples: ["anchor"]
      required:
      - prefix
    ProductEventsConfigRequest:
      type: object
      properties:
        endpoint_url:
          type: string
          description: >-
            Absolute URL Anchor POSTs product events to. Use HTTPS in
            production. Omit or send an empty string to clear the endpoint.
            Anchor mints the Standard Webhooks signing secret. The caller
            cannot supply one.
          examples: ["https://echopoint.example/anchor/events"]
        events:
          type: array
          items:
            type: string
          description: >-
            List of event types this endpoint subscribes to. If omitted when
            configuring an endpoint, all registered events are subscribed by default.
          examples: [["organization.created", "organization.updated"]]
    ProductEventsConfigResponse:
      type: object
      properties:
        endpoint_url:
          type: string
          description: URL Anchor POSTs product events to.
        signing_secret_obfuscated:
          type: string
          description: Obfuscated marker that a signing secret is stored.
        signing_secret:
          type: string
          description: >-
            Plaintext Standard Webhooks signing secret (`whsec_...`). Present
            only on the write that minted it. Store it then. Later reads
            return only the obfuscated marker. Encrypted at rest. Delivery
            must sign with the plaintext, so it is never hashed.
        events:
          type: array
          items:
            type: string
          description: List of event types this endpoint receives.
          examples: [["organization.created", "organization.updated"]]
        delivery_status:
          $ref: "#/components/schemas/ProductEventDeliveryStatus"
        consecutive_failed_calls:
          type: integer
          description: >-
            Consecutive failed HTTP delivery attempts. Resets after a successful
            call or when the endpoint configuration is saved.
      required:
      - endpoint_url
      - signing_secret_obfuscated
      - events
      - delivery_status
      - consecutive_failed_calls
    ProductEventDeliveryStatus:
      type: string
      enum: [never_attempted, succeeded, failed]
      description: Result of the most recent HTTP delivery attempt to this endpoint.
    ProductEventsCatalogResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductEventDefinitionResponse"
          description: Registered internal and integration events available for subscription.
      required:
      - items
    ProductEventGroupType:
      type: string
      enum: [internal, integration]
      x-go-type: events.GroupType
      x-go-type-import:
        path: anchor/internal/events
    ProductEventDefinitionResponse:
      type: object
      properties:
        type:
          type: string
          description: Unique event type identifier.
          examples: ["organization.created"]
        name:
          type: string
          description: Human-readable display name.
          examples: ["Organization created"]
        description:
          type: string
          description: Description of when this event is emitted.
          examples: ["Emitted when a new organization is created."]
        group_type:
          $ref: "#/components/schemas/ProductEventGroupType"
          description: Event origin, either Anchor itself or an integration provider.
          examples: ["internal"]
        group_name:
          type: string
          description: Display name of the Anchor area or integration provider.
          examples: ["Organizations"]
      required:
      - type
      - name
      - description
      - group_type
      - group_name
    ProductConfigResponse:
      type: object
      properties:
        protected:
          type: boolean
          description: Whether deletion of this product is prevented.
        organization_api_keys:
          $ref: "#/components/schemas/ProductOrganizationAPIKeysConfigResponse"
          description: Organization API key configuration for this product.
        events:
          $ref: "#/components/schemas/ProductEventsConfigResponse"
          description: Outbound product-event endpoint, absent when none is configured.
      required:
      - protected
      - organization_api_keys
    ProductOrganizationAPIKeysConfigResponse:
      type: object
      properties:
        prefix:
          type: string
          description: >-
            Root prefix used when generating organization API keys for
            organizations in this product.
          examples: ["anchor"]
      required:
      - prefix
    ProductResponse: # Response Schema
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ksuid"
          description: Unique identifier for the product (e.g., prefix 'prod_').
          examples: ["prod_2iABC..."]
        tenant_id: # Included for clarity, even if fixed in OS V1
          $ref: "#/components/schemas/ksuid"
          description: Identifier of the PlatformTenant this product belongs to.
          examples: ["ptnt_1single..."]
        name:
          type: string
          description: Name of the product.
          examples: ["Analytics Dashboard"]
        description:
          type: [string, "null"]
          description: Description of the product.
          examples: ["Real-time Product User analytics."]
        config:
          $ref: "#/components/schemas/ProductConfigResponse"
          description: Product-level configuration.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the product was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the product was last updated.
      required:
      - id
      - tenant_id
      - name
      - config
      - created_at
      - updated_at
    ProductListResponse:
      allOf:
      - $ref: "#/components/schemas/PagedListResponse"
      - properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/ProductResponse"
        required:
        - items
    ProductPermissionResponse: # Response Schema
      description: >-
        A built-in permission that controls access to the product itself within
        Anchor (e.g. product:settings:read, product:billing:update). These
        permissions are system-defined — they cannot be created or deleted via
        the API. Use the search endpoint to discover which permissions are
        available for a product.
      type: object
      properties:
        product_id:
          $ref: "#/components/schemas/ksuid"
          description: ID of the Product this permission is defined for.
          examples: ["prod_2iABC..."]
        name:
          type: string
          description: >-
            The permission string identifier. Permission name filters and
            validation use case-insensitive matching and return the canonical
            stored casing.
          examples: ["product:settings:read"]
        description:
          type: [string, "null"]
          description: Human-readable description of what this permission grants.
          examples: ["Allows reading the product settings."]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - product_id
      - name
      - created_at
      - updated_at

    ProductPermissionListResponse:
      allOf:
      - $ref: "#/components/schemas/PagedListResponse"
      - properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/ProductPermissionResponse"
        required:
        - items
    ResourceTypeSlug:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,48}$'
      description: >-
        The resource type's slug, unique in its product. It names the type in
        API calls and in the access model, so it never changes after creation.
        `organization` is the built-in root type of every product; declaring
        it again answers 409 BUILT_IN_RESOURCE_TYPE.
      examples: ["folder"]

    ProductResourceTypeCreateRequest:
      type: object
      description: >-
        A kind of thing the product protects, placed in the product's tree of
        resource types under `organization`. A product has at most 50 resource
        types of its own besides `organization`.
      required: [slug, name, parent_types]
      properties:
        slug:
          $ref: "#/components/schemas/ResourceTypeSlug"
        name:
          type: string
          minLength: 1
          maxLength: 100
          examples: ["Folder"]
        description:
          type: [string, "null"]
          maxLength: 500
          examples: ["Groups documents."]
        parent_types:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: >-
            Slugs of the other types an instance of this type may sit under,
            such as `[project]` for a folder. An empty list answers 400
            RESOURCE_TYPE_PARENT_REQUIRED. A type never lists itself: set
            `nests_in_itself` instead. A cycle between types answers 400
            RESOURCE_TYPE_CYCLE. A tree deeper than 5 levels, counting
            `organization`, answers 400 RESOURCE_TYPE_TOO_DEEP.
          items:
            $ref: "#/components/schemas/ResourceTypeSlug"
        nests_in_itself:
          type: boolean
          default: false
          description: >-
            `true` lets an instance sit under another instance of the same
            type, such as a folder inside a folder.

    ProductResourceTypeUpdateRequest:
      type: object
      description: >-
        Fields to change. An omitted field keeps its value. The slug never
        changes. The built-in `organization` type accepts only
        `allows_custom_roles`, and answers 409 BUILT_IN_RESOURCE_TYPE to any
        other change.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 500
        parent_types:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: >-
            Replaces the allowed parent types. Removing a parent type that a
            managed role still needs answers 409 RESOURCE_TYPE_IN_USE: a role
            scoped above this type would then hold a permission outside its
            scope. An Organization's custom role never blocks the change: it
            loses those permissions instead, with organization.role.updated.
            Removing a parent type that a registered resource of this type
            sits under also answers 409 RESOURCE_TYPE_IN_USE, with the count in
            `metadata.blocked_by.resources` and the type in
            `metadata.parent_type`.
          items:
            $ref: "#/components/schemas/ResourceTypeSlug"
        nests_in_itself:
          type: boolean
          description: >-
            Turning it off while a registered resource of this type sits under
            another of the same type answers 409 RESOURCE_TYPE_IN_USE, with the
            count in `metadata.blocked_by.resources`.
        allows_custom_roles:
          type: boolean
          description: >-
            Lets the product's Organizations create their own roles scoped to
            this type, through the Organization's role routes. Every type of
            the product accepts it, `organization` included, and each switch
            opens custom roles of its own type only. Turning it off keeps the
            custom roles that exist and the access they grant: Organizations
            can no longer create or change them, but can still delete them.

    ProductResourceTypeTreeItem:
      type: object
      required: [slug, name, parent_types]
      properties:
        slug:
          $ref: "#/components/schemas/ResourceTypeSlug"
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, "null"]
          maxLength: 500
        parent_types:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ResourceTypeSlug"
        nests_in_itself:
          type: boolean
          default: false

    ProductResourceTypeTreeRequest:
      type: object
      description: >-
        The product's whole tree of resource types, `organization` excluded.
        Types are matched by slug: a listed type is created or updated, and a
        type left out is deleted. The tree is validated as a whole, with the
        same rules as the single-type routes, and applied in one transaction.
      required: [resource_types]
      properties:
        resource_types:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ProductResourceTypeTreeItem"

    ProductResourceTypeResponse:
      type: object
      required: [id, product_id, slug, name, parent_types, nests_in_itself, allows_custom_roles, built_in, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/ksuid"
          examples: ["rtype_2qLCf0ld3r2nT8vK5xR1"]
        product_id:
          $ref: "#/components/schemas/ksuid"
        slug:
          $ref: "#/components/schemas/ResourceTypeSlug"
        name:
          type: string
        description:
          type: [string, "null"]
        parent_types:
          type: array
          description: Slugs of the other types an instance may sit under. Empty for `organization`.
          items:
            $ref: "#/components/schemas/ResourceTypeSlug"
        nests_in_itself:
          type: boolean
        allows_custom_roles:
          type: boolean
          description: Whether the product's Organizations may create their own roles scoped to this type.
        built_in:
          type: boolean
          description: "`true` for `organization`, the root type every product has. It can't be changed or deleted."
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductResourceTypeTreeResponse:
      type: object
      required: [resource_types]
      properties:
        resource_types:
          type: array
          description: >-
            Every resource type of the product: `organization` first, then by
            creation time, and types created together by slug.
          items:
            $ref: "#/components/schemas/ProductResourceTypeResponse"

    ProductResourceTypeFilter:
      type: object
      properties:
        ids:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ksuid"
          x-go-type-skip-optional-pointer: true
        slugs:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ResourceTypeSlug"
          x-go-type-skip-optional-pointer: true

    ProductResourceTypeSortField:
      type: string
      enum: [created_at, updated_at, slug, name]
      default: created_at
      description: Field to sort by. Every order ends with `id`.
      x-go-type: resourcetype.SortField
      x-go-type-import:
        path: anchor/internal/domain/resourcetype

    ProductResourceTypeSearchRequest:
      allOf:
      - $ref: "#/components/schemas/SearchRequest"
      - type: object
        properties:
          filter:
            $ref: "#/components/schemas/ProductResourceTypeFilter"
          sort_by:
            $ref: "#/components/schemas/ProductResourceTypeSortField"

    ProductResourceTypeListResponse:
      allOf:
      - $ref: "#/components/schemas/PagedListResponse"
      - properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/ProductResourceTypeResponse"
        required:
        - items

    ResourceExternalId:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^[A-Za-z0-9._~-]{1,200}$'
      description: >-
        The product's own identifier of a resource, such as its database ID.
        It is unique in its Organization and resource type, and fixed once
        registered. It holds 1 to 200 characters from letters, digits, `.`,
        `_`, `~` and `-`, so it fits a URL path segment as is; `.` and `..`
        alone are refused. Any other value answers 400 INVALID_RESOURCE_ID.
      examples: ["3b7e91d2-0c4a-4f6e-9d21-8a5c7e4b2f60"]

    ResourceParentRef:
      type: object
      description: >-
        The one parent of a resource: another registered resource of the same
        Organization, or the Organization itself, named
        `{ "type": "organization", "id": "<organization_id>" }`.
      required: [type, id]
      properties:
        type:
          $ref: "#/components/schemas/ResourceTypeSlug"
        id:
          type: string
          minLength: 1
          maxLength: 255
          description: The parent's `id`, or the Organization's ID when `type` is `organization`.
          examples: ["9f1c2a4e-6b3d-4c8e-a1f0-2d7e5b9c3a11"]

    ResourcePutRequest:
      type: object
      description: >-
        The resource's name and its parent. Both are required on every call,
        whether it creates, renames or moves the resource: Anchor never picks a
        parent.
      required: [name, parent]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            A display name, not unique. Send it again when the resource is
            renamed in the product; it is shown to people and never decides
            access.
          examples: ["Design"]
        parent:
          $ref: "#/components/schemas/ResourceParentRef"

    ResourceResponse:
      type: object
      description: >-
        A registered resource, named by the product's own identifier. Anchor's
        own row ID is never exposed.
      required: [type, id, organization_id, name, parent, created_at, updated_at]
      properties:
        type:
          $ref: "#/components/schemas/ResourceTypeSlug"
        id:
          $ref: "#/components/schemas/ResourceExternalId"
        organization_id:
          $ref: "#/components/schemas/ksuid"
          examples: ["org_2qL9aC3mE8xP1rT6vN4bK2sJ"]
        name:
          type: string
        parent:
          $ref: "#/components/schemas/ResourceParentRef"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ResourceFilter:
      type: object
      properties:
        resource_types:
          type: array
          maxItems: 50
          description: Keeps resources of these types. A slug the product has not declared matches nothing.
          items:
            $ref: "#/components/schemas/ResourceTypeSlug"
          x-go-type-skip-optional-pointer: true
        parent:
          $ref: "#/components/schemas/ResourceParentRef"
        ids:
          type: array
          maxItems: 100
          description: Keeps resources with these product identifiers, of any type unless `resource_types` narrows it.
          items:
            $ref: "#/components/schemas/ResourceExternalId"
          x-go-type-skip-optional-pointer: true
        name_contains:
          type: string
          minLength: 1
          maxLength: 200
          description: Keeps resources whose name contains this text, regardless of case. `%` and `_` match themselves.

    ResourceSortField:
      type: string
      enum: [created_at, name]
      default: created_at
      description: Field to sort by. Every order ends with `id`, then with Anchor's row, so ties keep a stable order.
      x-go-type: resource.SortField
      x-go-type-import:
        path: anchor/internal/domain/resource

    ResourceSearchRequest:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/PaginationRequest"
        filter:
          $ref: "#/components/schemas/ResourceFilter"
        sort_by:
          $ref: "#/components/schemas/ResourceSortField"
        sort_direction:
          $ref: "#/components/schemas/SortDirection"

    ResourceListResponse:
      allOf:
      - $ref: "#/components/schemas/PagedListResponse"
      - properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/ResourceResponse"
        required:
        - items

    ResourceMemberPutRequest:
      type: object
      description: >-
        The roles the member holds on the resource. The call replaces what the
        member held there before. The list holds exactly one role while the
        product allows one role per member per resource, which is the only
        setting for now; the list shape stays when several roles are allowed.
      required: [role_ids]
      properties:
        role_ids:
          type: array
          minItems: 1
          maxItems: 10
          description: >-
            IDs of roles a member of the Organization may hold: a role the
            Product manages or a custom role of this Organization. Any other
            role answers 400 ROLE_NOT_FOUND_IN_REQUEST. Every role must be
            scoped to the resource's type, or it answers 400
            ROLE_SCOPE_MISMATCH. More than one ID answers 400
            SINGLE_ROLE_PER_RESOURCE.
          items:
            $ref: "#/components/schemas/ksuid"
          examples: [["role_2qLBedXr4kT9vN2xQ6pK1wAbCdEf"]]

    ResourceMemberRole:
      type: object
      description: A role the member holds on the resource.
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/ksuid"
          description: The role's ID, as the Organization's role routes show it.
        name:
          type: string
          examples: ["Folder editor"]

    ResourceMemberResponse:
      type: object
      description: >-
        A member of the Organization and the roles they hold on one resource.
      required: [product_user_id, roles, created_at, updated_at]
      properties:
        product_user_id:
          $ref: "#/components/schemas/ksuid"
        roles:
          type: array
          description: >-
            The roles held on the resource. It holds one item while the product
            allows one role per member per resource.
          items:
            $ref: "#/components/schemas/ResourceMemberRole"
        created_at:
          type: string
          format: date-time
          description: When the member first held a role on the resource.
        updated_at:
          type: string
          format: date-time
          description: When the member's roles on the resource last changed.

    ResourceMemberFilter:
      type: object
      properties:
        product_user_ids:
          type: array
          maxItems: 100
          description: Keeps these members.
          items:
            $ref: "#/components/schemas/ksuid"
          x-go-type-skip-optional-pointer: true
        role_ids:
          type: array
          maxItems: 50
          description: >-
            Keeps members holding one of these roles on the resource.
          items:
            $ref: "#/components/schemas/ksuid"
          x-go-type-skip-optional-pointer: true

    ResourceMemberSortField:
      type: string
      enum: [created_at, product_user_id]
      default: created_at
      description: >-
        Field to sort by. `created_at` is when the member first held a role on
        the resource. Every order ends with `product_user_id`.
      x-go-type: roleassignment.SortField
      x-go-type-import:
        path: anchor/internal/domain/roleassignment

    ResourceMemberSearchRequest:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/PaginationRequest"
        filter:
          $ref: "#/components/schemas/ResourceMemberFilter"
        sort_by:
          $ref: "#/components/schemas/ResourceMemberSortField"
        sort_direction:
          $ref: "#/components/schemas/SortDirection"

    ResourceMemberListResponse:
      allOf:
      - $ref: "#/components/schemas/PagedListResponse"
      - properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/ResourceMemberResponse"
        required:
        - items

    CreateProductResourcePermissionRequest:
      description: >-
        Request body for defining a new domain-resource permission for the
        product's own application resources. For example, if you are building a
        Google Drive-like product you might define permissions such as
        "document:read", "document:create", or "file:delete". These permissions
        are later assigned to ProductRoles, which are attached to end-user
        organization memberships.
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
          description: >-
            The resource permission identifier, using the format
            "<resource>:<action>" (e.g. "document:read", "file:delete",
            "workspace:invite"). Must be unique within the product using
            case-insensitive matching.
          examples: ["document:read"]
        description:
          type: [string, "null"]
          maxLength: 500
          description: Optional human-readable description of what this permission grants.
          examples: ["Allows reading document contents."]
        resource_type:
          allOf:
          - $ref: "#/components/schemas/ResourceTypeSlug"
          description: >-
            The resource type this permission is scoped to. Required: Anchor never
            picks a scope. A missing one answers 400 RESOURCE_TYPE_REQUIRED and
            an unknown one 400 RESOURCE_TYPE_NOT_FOUND. It never changes after
            creation.
        scope_modifier:
          type: [string, "null"]
          maxLength: 100
          deprecated: true
          description: >-
            Deprecated. Use the permission's resource_type and role assignments
            on resources. Nothing evaluates it. Removed in the cleanup
            (ADR-0022 G6).
          examples: ["own"]
      required:
      - name
      - resource_type

    UpdateProductResourcePermissionRequest:
      description: Request body for updating a product resource permission's metadata.
      type: object
      properties:
        description:
          type: [string, "null"]
          maxLength: 500
          description: Updated human-readable description of what this permission grants.
          examples: ["Allows updating document contents."]
        resource_type:
          allOf:
          - $ref: "#/components/schemas/ResourceTypeSlug"
          description: >-
            A permission's resource type never changes. Omit it, or send the
            current one; any other value answers 409 PERMISSION_SCOPE_IMMUTABLE.

    ProductResourcePermissionResponse:
      description: >-
        A domain-resource permission defined by the product owner for their own
        application resources. These permissions are created by the product
        (e.g. "document:read", "file:delete" for a Google Drive-like product)
        and assigned to ProductRoles. They control what end-users can do
        *inside the product*, as opposed to ProductPermissions which control
        access to the product itself within Anchor.
      type: object
      properties:
        product_id:
          $ref: "#/components/schemas/ksuid"
          description: ID of the Product this resource permission belongs to.
          examples: ["prod_2iABC..."]
        name:
          type: string
          description: >-
            The resource permission identifier (e.g. "document:read"). This
            value is used as the primary key and path parameter.
          examples: ["document:read"]
        description:
          type: [string, "null"]
          description: Human-readable description of what this permission grants.
          examples: ["Allows reading document contents."]
        resource_type:
          allOf:
          - $ref: "#/components/schemas/ResourceTypeSlug"
          description: The resource type this permission is scoped to.
        scope_modifier:
          type: [string, "null"]
          deprecated: true
          description: >-
            Deprecated. Use the permission's resource_type. Nothing evaluates
            it. Removed in the cleanup (ADR-0022 G6).
          examples: ["own"]
        created_at:
          type: string
          format: date-time
          description: Timestamp when the resource permission was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the resource permission was last updated.
      required:
      - product_id
      - name
      - resource_type
      - created_at
      - updated_at
    ProductResourcePermissionFilter:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
          description: Filter by resource permission names.
          x-go-type-skip-optional-pointer: true
        resource_types:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ResourceTypeSlug"
          description: Keep only permissions scoped to one of these resource types.
          x-go-type-skip-optional-pointer: true
    ProductResourcePermissionSearchRequest:
      allOf:
      - $ref: "#/components/schemas/SearchRequest"
      - properties:
          filter:
            $ref: "#/components/schemas/ProductResourcePermissionFilter"
          sort_by:
            type: string
            enum: ["created_at", "updated_at", "name"]
            default: "created_at"
            description: Field to sort by
            x-go-type: resourcepermission.SortFieldProductResourcePermission
            x-go-type-import:
              path: anchor/internal/domain/product/resourcepermission

    ProductResourcePermissionListResponse:
      allOf:
      - $ref: "#/components/schemas/PagedListResponse"
      - properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/ProductResourcePermissionResponse"
        required:
        - items
    ProductRoleCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Name of the product role. Must be unique within the
            Product using case-insensitive matching.
          examples: ["Editor"]
        description:
          type: [string, "null"]
          maxLength: 500
          description: Optional description of the role's purpose.
          examples: ["Can view and edit resources within assigned organizations/workspaces."]
        permissions:
          type: array
          description: >-
            Optional list of permission names to assign initially. Each must be
            scoped to the role's resource type or to a type below it; any other
            answers 400 PERMISSION_OUTSIDE_ROLE_SCOPE.
          items:
            type: string
            examples: ["document:edit"]
          x-go-type-skip-optional-pointer: true
        resource_type:
          allOf:
          - $ref: "#/components/schemas/ResourceTypeSlug"
          description: >-
            The resource type this role is scoped to. Required: Anchor never
            picks a scope. A missing one answers 400 RESOURCE_TYPE_REQUIRED and
            an unknown one 400 RESOURCE_TYPE_NOT_FOUND. It never changes after
            creation.
      required:
      - name
      - resource_type
    ProductRoleUpdateRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Name of the product role. Must be unique within the
            Product using case-insensitive matching.
          examples: ["Editor"]
        description:
          type: [string, "null"]
          maxLength: 500
          description: Optional description of the role's purpose.
          examples: ["Can view and edit resources within assigned organizations/workspaces."]
        permissions:
          type: array
          description: Permission names to replace the assigned set. Omit this field to
            keep the current permissions; send an empty array to remove all permissions.
          items:
            type: string
            examples: ["document:edit"]
        resource_type:
          allOf:
          - $ref: "#/components/schemas/ResourceTypeSlug"
          description: >-
            A role's resource type never changes. Omit it, or send the
            current one; any other value answers 409 ROLE_SCOPE_IMMUTABLE.
    ProductRoleType:
      type: string
      enum: [MANAGED, CUSTOM]
      x-go-type: role.Type
      x-go-type-import:
        path: anchor/internal/domain/product/role
      description: >-
        MANAGED: the Product manages the role, and every Organization of the
        Product references it by the same ID, so a change to it reaches every
        member who holds it. CUSTOM: one Organization owns the role, and only
        its members may hold it. The Product's role routes list MANAGED roles
        only.
    ProductRoleResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ksuid"
          description: Unique identifier for the product role (e.g., prefix 
            'role_').
          examples: ["role_5mNOP..."]
        product_id:
          $ref: "#/components/schemas/ksuid"
          description: ID of the Product this role belongs to.
          examples: ["prod_2iABC..."]
        name:
          type: string
          description: Name of the product role.
          examples: ["Editor"]
        description:
          type: [string, "null"]
          description: Description of the role.
          examples: ["Can view and edit resources within assigned organizations/workspaces."]
        resource_type:
          allOf:
          - $ref: "#/components/schemas/ResourceTypeSlug"
          description: The resource type this role is scoped to.
        type:
          $ref: "#/components/schemas/ProductRoleType"
        organization_id:
          type: [string, "null"]
          description: The Organization that owns a CUSTOM role. `null` for a MANAGED role.
          examples: ["org_2qL9aC3mE8xP1rT6vN4bK2sJ"]
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/ProductRolePermissionResponse"
          description: List of permissions assigned to this role.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - product_id
      - name
      - resource_type
      - type
      - organization_id
      - permissions
      - created_at
      - updated_at
