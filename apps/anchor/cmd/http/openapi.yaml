        external_ids:
          type: array
          items:
            type: string
          description: Filter by external (Clerk) user IDs.
        emails:
          type: array
          items:
            type: string
            format: email
          description: Filter by email addresses.
        role_ids:
          type: array
          items:
            $ref: "#/components/schemas/ksuid"
          description: Filter by role IDs.
    OrganizationMemberInclude:
      type: string
      enum: [role_permissions]
      description: Additional fields to include in organization member 
        responses.
    OrganizationInvitationStatus:
      type: string
      enum: [pending, accepted, expired]
      description: >-
        The status of an organization invitation. `expired` is derived on read:
        an invitation reads `expired` once its expiry has passed while it is
        pending. Anchor never stores it. Only a pending invitation can be
        accepted or updated.
      x-go-type: organizationinvitation.Status
      x-go-type-import:
        path: anchor/internal/domain/organizationinvitation
    OrganizationInvitationResponse:
      type: object
      description: >-
        An offer to become a member of one organization, with one role. It is
        addressed to an email address.
      properties:
        id:
          $ref: "#/components/schemas/ksuid"
          description: Unique identifier of the invitation.
          examples: ["oinv_2iABC..."]
        organization_id:
          $ref: "#/components/schemas/ksuid"
          description: The organization the invitation is for.
        email:
          type: string
          format: email
          description: The invited email address. It never changes.
          examples: ["alice@example.com"]
        role_id:
          anyOf:
          - $ref: "#/components/schemas/ksuid"
          - type: "null"
          description: >-
            The role the invited person receives on accept. Null means they
            join with no role and no permission. A client that always names a
            role when it invites never sees null.
        status:
          $ref: "#/components/schemas/OrganizationInvitationStatus"
        expires_at:
          type: string
          format: date-time
          description: When the invitation stops being acceptable.
        accepted_at:
          type: string
          format: date-time
          description: When the invitation was accepted. Absent until then.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - organization_id
      - email
      - role_id
      - status
      - expires_at
      - created_at
      - updated_at
    OrganizationInvitationListResponse:
      allOf:
      - $ref: "#/components/schemas/PagedListResponse"
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: "#/components/schemas/OrganizationInvitationResponse"
        required:
        - items
    OrganizationInvitationCreateRequest:
      type: object
      description: Request body for inviting an email address to an organization.
      properties:
        email:
          type: string
          format: email
          description: The email address to invite.
          examples: ["alice@example.com"]
        role_id:
          $ref: "#/components/schemas/ksuid"
          description: >-
            The role the invited person receives on accept. It must be a role
            the Product manages or a custom role of this Organization; any
            other role answers 400 ROLE_NOT_FOUND_IN_REQUEST. Omit it to invite
            a member with no role.
        expires_at:
          type: string
          format: date-time
          description: >-
            When the invitation expires. It must be in the future. Absent means
            7 days from now.
      required:
      - email
    OrganizationInvitationUpdateRequest:
      type: object
      description: >-
        Request body for changing an invitation. Only the role and the expiry
        can change.
      additionalProperties: false
      properties:
        role_id:
          type: [string, "null"]
          pattern: "^[a-z_]{2,20}_[0-9a-zA-Z]{27}$"
          # Server only: a Nullable tells an omitted role_id (400) from null
          # (no role). generate_anchor.sh drops these three hints from the
          # client spec, where a nil pointer sends null.
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          description: >-
            The new role. It must be a role the Product manages or a custom
            role of this Organization; any other role answers 400
