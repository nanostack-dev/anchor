# The suite's file layer (cmd/app.LoadConfig, through CONFIG_PATH). The
# harness (cmd/it/shared) sets the container addresses, the server port and
# the secrets in the environment: a config file holds no secret.
postgres:
  host: localhost
  user: anchor
  db: anchor
  sslmode: disable

migrations:
  base_path: ../../../migrations
  auto_fix_dirty: false

core:
  environment: test
  # The suites register event endpoints on httptest servers (127.0.0.1).
  events:
    allow_private_endpoints: true
  integration:
    allow_private_hosts: true

server:
  allowed_origin: "*"
