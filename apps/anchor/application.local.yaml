# ./application.yaml
postgres:
  host: ${POSTGRES_HOST} # Default to localhost if env var not set
  port: ${POSTGRES_PORT:5432}    # Default to 5432 if env var not set
  user: ${POSTGRES_USER}          # Required env var
  password: ${POSTGRES_PASSWORD}    # Required env var
  dbname: ${POSTGRES_DB}          # Required env var
  sslmode: ${POSTGRES_SSLMODE:disable} # Default to disable

# Migrations configuration
migrations:
  enabled: true
  basePath: "./migrations"
  validate: true
  # Enable this to automatically fix dirty migration states
  autoFixDirty: true
  # Set this to a specific version to force that version number
  # forceVersion: 0

# PgLock configuration
pglock:
  tableName: "pglock_locks"
  autoCreateTable: true
  leaseDuration: "10s"
  heartbeatFrequency: "1s"
  testOnStartup: true
core:
  environment: "${ENVIRONMENT:production}"
  auth:
    refresh_token_lifetime: ${REFRESH_TOKEN_LIFETIME:84600}
    access_token_lifetime: ${ACCESS_TOKEN_LIFETIME:3600}
    admin_jwt_secret: "${ADMIN_JWT_SECRET}"
  encryption:
    global_key: "${APP_ENCRYPTION_KEY}"
    global_key_version: "${APP_ENCRYPTION_KEY_VERSION:v1}"
  integration:
    reconcile_schedule_interval: "${INTEGRATION_RECONCILE_SCHEDULE_INTERVAL:15m}"
  webhooks:
    # Relaxes https-only and the private-address block for outbound webhook
    # targets. Test-only: keep false in every deployed environment.
    allow_insecure_targets: ${WEBHOOKS_ALLOW_INSECURE_TARGETS:false}


# Redis cache configuration
cache:
  address: ${REDIS_ADDRESS:localhost:6379}
  password: ${REDIS_PASSWORD:anchor}
  db: ${REDIS_DB:0}
# Example of another config section
server:
  port: ${SERVER_PORT:8080}
  allowed_origin: "${ALLOWED_ORIGIN:http://localhost:3000}"
