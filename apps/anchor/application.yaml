# Anchor's committed file layer (cmd/app.LoadConfig), read when CONFIG_PATH
# is unset. Keys are the config: names; cmd/app/CONFIG.md lists every setting
# with its env variable and default. The environment overrides each value
# here. Secrets never go in this file: set POSTGRES_PASSWORD, REDIS_PASSWORD,
# ADMIN_JWT_SECRET and APP_ENCRYPTION_KEY, or their *_FILE variables.
# core.environment stays unset here, so it follows ENVIRONMENT.
postgres:
  sslmode: disable

migrations:
  base_path: ./migrations
  # Forces a dirty version clean before migrating; the schema check at start
  # refuses a release whose role migrations were forced past.
  auto_fix_dirty: true

redis:
  address: localhost:6379

server:
  allowed_origin: http://localhost:3000
