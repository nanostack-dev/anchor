packages:
  - "anchor-ui"

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
resolutionMode: time-based
minimumReleaseAgeExclude:
  - "ws@8.21.0"
  - "@tanstack/router-plugin@1.168.47"
  - "@babel/core@7.29.7"
  - "baseline-browser-mapping@2.11.0"
  - "brace-expansion@1.1.21"
  - "brace-expansion@5.0.12"
  - "browserslist@4.28.7"
  - "esbuild@0.28.1"
  - "js-cookie@3.0.6"
  - "js-yaml@4.3.2"
  - "nanoid@3.3.18"
  - "postcss@8.5.23"
  - "seroval@1.6.3"
  - "sharp@0.35.5"
  - "source-map-js@1.2.2"
  - "undici@7.29.1"
  - "dompurify@3.4.16"
  - "@types/*"
  - "typescript"
  - "@nanostackorg/design-system"
allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  sharp: true
  workerd: true

# Security fixes stay scoped to affected dependency ranges.
overrides:
  "@babel/core@<7.29.1": "7.29.7"
  "baseline-browser-mapping@>=2 <2.11.0": "2.11.0"
  "brace-expansion@>=1 <1.1.21": "1.1.21"
  "brace-expansion@>=5 <5.0.12": "5.0.12"
  "browserslist@<4.28.7": "4.28.7"
  "dompurify@<3.4.16": "3.4.16"
  "esbuild@>=0.27.3 <0.28.1": "0.28.1"
  "js-cookie@<3.0.6": "3.0.6"
  "js-yaml@>=4 <4.3.2": "4.3.2"
  "nanoid@>=3 <3.3.18": "3.3.18"
  "postcss@<8.5.23": "8.5.23"
  "seroval@<1.6.3": "1.6.3"
  "sharp@<0.35.5": "0.35.5"
  "source-map-js@>=1 <1.2.2": "1.2.2"
  "undici@>=7 <7.29.1": "7.29.1"
  "ws@>=8 <8.21.0": "8.21.0"
